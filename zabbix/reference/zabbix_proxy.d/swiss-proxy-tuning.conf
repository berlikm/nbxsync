# Swiss production proxy (ch-sta-p-zabp02) — drop into
#   /etc/zabbix/zabbix_proxy.d/swiss-proxy-tuning.conf
# Main file keeps Server=, TLS*, DBName, PidFile, Include.
# Restart zabbix-proxy after copy. Analysis: zabbix/notes/swiss-proxy-tuning.md
#
# Do not set Timeout=30. That starves SCRIPT items (XIQ-SE GraphQL, FortiGate
# HTTP scripts) because they share synchronous pollers with legacy SNMP.

Timeout=5

StartPollers=20
StartPollersUnreachable=8
StartSNMPPollers=4
StartHTTPAgentPollers=2
StartAgentPollers=2
StartPingers=10
StartPreprocessors=16

ProxyBufferMode=hybrid
ProxyMemoryBufferSize=256M
ProxyOfflineBuffer=24

HistoryCacheSize=64M
HistoryIndexCacheSize=16M
CacheSize=256M

LogFileSize=10
LogSlowQueries=3000

# Optional after you confirm the proxy has no web scenarios / ODBC / browser items:
# StartHTTPPollers=0
# StartODBCPollers=0
# StartBrowserPollers=0

# Set explicitly to the Zabbix Cloud proxy name (case-sensitive):
# Hostname=ch-sta-p-zabp02
