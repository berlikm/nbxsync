            }
            var raw = map.throughput_upstream;
            if (raw === undefined || raw === null || raw === '') {
              raw = map['max(throughput_upstream)'];
            }
            var numeric = Number(raw);
            if (raw === undefined || raw === null || raw === '' || !isFinite(numeric)) {
              throw 'TX rate missing';
            }
            return numeric * 8;
          error_handler: DISCARD_VALUE
