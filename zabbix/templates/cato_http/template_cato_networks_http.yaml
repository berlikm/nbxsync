zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 8eaf4d5dcc474db99c4e84b02a47b5be
    template: Cato Networks by HTTP
    name: Cato Networks by HTTP
    description: |
      One account-scoped HTTP collector for Cato Socket overlay state and SLA.

      NetBox Socket hosts remain ICMP-only. This template owns no ICMP item
      and never turns collector loss into a site, Socket, or WAN outage.

      Refresh with configure_nbxsync_network.py --apply-cato. Do not re-run
      zerotouch to update this pack.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: e04b5f18f8da4c5cb38b5a48eefe601a
      name: Cato account snapshot
      type: HTTP_AGENT
      key: cato.account.snapshot
      delay: 1m
      history: 1d
      value_type: TEXT
      url: '{$CATO.API.URL}'
      request_method: POST
      post_type: JSON
      posts: '{"query":"query AccountSnapshot($accountID: ID!) { accountSnapshot(accountID: $accountID) { sites { id connectivityStatus operationalStatus lastConnected connectedSince popName hostCount degradedStatus { isDegraded degradedDetails { reason } } info { name type connType isHA sockets { id serial isPrimary platform version } } haStatus { readiness wanConnectivity keepalive socketVersion } devices { id name connected connectedSince haRole version deviceUptime socketInfo { id serial isPrimary platform version } interfacesLinkState { id mediaIn up hasAddress hasInternet hasTunnel duplex linkSpeed } interfaces { id name connected popName tunnelUptime type physicalPort tunnelRemoteIP tunnelConnectionReason tunnelRemoteIPInfo { provider } info { id name upstreamBandwidth downstreamBandwidth destType } } } } } }","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      headers:
      - name: Content-Type
        value: application/json
      - name: x-api-key
        value: '{$CATO.API.TOKEN}'
      status_codes: '200'
      follow_redirects: YES
      retrieve_mode: BODY
      timeout: 30s
      verify_peer: YES
      verify_host: YES
      allow_traps: NO
      tags:
      - tag: component
        value: cato
      - tag: monitoring_domain
        value: cato_overlay
      - tag: scope
        value: collector
    - uuid: 431c7bf7febc490ea998ecaf4f118b33
      name: Cato account metrics
      type: HTTP_AGENT
      key: cato.account.metrics
      delay: 5m
      history: 1d
      value_type: TEXT
      url: '{$CATO.API.URL}'
      request_method: POST
      post_type: JSON
      posts: '{"query":"query AccountMetrics($accountID: ID!) { accountMetrics(accountID: $accountID, timeFrame: \"last.PT5M\", groupDevices: true, groupInterfaces: false) { sites { id name info { connType } interfaces { name interfaceInfo { id name upstreamBandwidth downstreamBandwidth destType } metrics(toRate: true) { bytesDownstream bytesUpstream lostDownstreamPcnt lostUpstreamPcnt jitterDownstream jitterUpstream rtt packetsDiscardedDownstream packetsDiscardedUpstream } timeseries(labels: [lastMilePacketLoss, lastMileLatency], buckets: 1) { label data info dimensions { label value } } } } } socketPortMetrics(accountID: $accountID, timeFrame: \"last.PT5M\", measures: [{ fieldName: throughput_upstream, aggType: max }, { fieldName: throughput_downstream, aggType: max }], dimensions: [{ fieldName: site_id }, { fieldName: site_name }, { fieldName: socket_interface }, { fieldName: transport_type }]) { records(limit: 500, from: 0) { fieldsMap } } }","variables":{"accountID":"{$CATO.ACCOUNT.ID}"}}'
      headers:
      - name: Content-Type
        value: application/json
      - name: x-api-key
        value: '{$CATO.API.TOKEN}'
      status_codes: '200'
      follow_redirects: YES
      retrieve_mode: BODY
      timeout: 30s
      verify_peer: YES
      verify_host: YES
      allow_traps: NO
      tags:
      - tag: component
        value: cato
      - tag: monitoring_domain
        value: cato_overlay
      - tag: scope
        value: collector
    - uuid: 74b3e7a912ec47939a5e8f193c602726
      name: Cato API snapshot GraphQL error count
      type: DEPENDENT
      key: cato.api.snapshot.error_count
      delay: '0'
      history: 30d
      value_type: UNSIGNED
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var root = JSON.parse(value);
          return Array.isArray(root.errors) ? root.errors.length : 0;
      master_item:
        key: cato.account.snapshot
      tags:
      - tag: component
        value: cato
      - tag: monitoring_domain
        value: cato_overlay
      - tag: scope
        value: collector
      triggers:
      - uuid: a4695fe6acb34c6fade1c10280ce8362
        expression: 'last(/Cato Networks by HTTP/cato.api.snapshot.error_count)>0'
        name: 'Cato API: Snapshot GraphQL errors'
        priority: AVERAGE
        tags:
        - tag: component
          value: cato
        - tag: monitoring_domain
          value: cato_overlay
        - tag: scope
          value: collector
    - uuid: d6874a4d6dc043bea6b7940c549c4058
      name: Cato API metrics GraphQL error count
      type: DEPENDENT
      key: cato.api.metrics.error_count
      delay: '0'
      history: 30d
      value_type: UNSIGNED
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var root = JSON.parse(value);
          return Array.isArray(root.errors) ? root.errors.length : 0;
      master_item:
        key: cato.account.metrics
