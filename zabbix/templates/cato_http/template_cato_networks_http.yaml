      - uuid: b66a55318b864751bbe9986bcd09c6c1
        expression: 'last(/Cato Networks by HTTP/cato.api.metrics.error_count)>0'
        name: 'Cato API: Metrics GraphQL errors'
        priority: AVERAGE
        tags:
        - tag: component
