      name: Cato worst TX utilization
      type: CALCULATED
      key: cato.wan.tx.util.worst.pct
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      params: 'max(last_foreach(//cato.wan.tx.util.pct[*]))'
      tags:
