zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 31bd30f93a974ab98b3a5742085d1346
    template: Extreme EXOS Observability
    name: Extreme EXOS Observability
    description: Health dashboard companion for the stock Extreme EXOS by SNMP template.
      Also nests Port Speed Expect (empty ifAlias is not discovered).
    groups:
    - name: Templates/Network devices
    templates:
    - name: Extreme EXOS by SNMP
    - name: Extreme Port Speed Expect by SNMP
    items:
    - uuid: f4033ae72ce44151b548b1c442f3c68a
      name: CPU
      type: CALCULATED
      key: exos.observability.cpu.util
      delay: 1m
      value_type: FLOAT
      units: '%'
      params: 'last(//system.cpu.util[extremeCpuMonitorTotalUtilization.0])'
      tags:
      - tag: component
        value: cpu
    - uuid: 766fe42cf6d943a0b573205bf50babdf
      name: Temperature
      type: CALCULATED
      key: exos.observability.temperature
      delay: 1m
      value_type: FLOAT
      units: °C
      params: 'last(//sensor.temp.value[extremeCurrentTemperature.0])'
      tags:
      - tag: component
        value: temperature
    - uuid: a7c14e82b6d94f0e9c3a1d5e8f2b4c60
      name: ICMP
      type: CALCULATED
      key: exos.observability.icmp
      delay: 1m
      value_type: FLOAT
      params: last(//icmpping)
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
    - uuid: 43c8b50fcd09497a8fc58127e99fb115
      name: SNMP
      type: CALCULATED
      key: exos.observability.snmp
      delay: 1m
      value_type: FLOAT
      params: 'last(//zabbix[host,snmp,available])'
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
    - uuid: 10fecf8a149240708e79c83134c87539
      name: Memory
      type: CALCULATED
      key: exos.observability.memory.util
      delay: 1m
      value_type: FLOAT
      units: '%'
      params: 'last(//vm.memory.util[1])'
      description: 'Slot 1 system memory (Access and stack master). Stock LLD still
        tickets other slots. Headline metric, not a honeycomb — one cell would fill
        the widget.'
      tags:
      - tag: component
        value: memory
    - uuid: ec0191ec18404a51bcd71ef5a7c1a619
      name: Uptime
      type: CALCULATED
      key: exos.observability.uptime
      delay: 1m
      value_type: FLOAT
      units: uptime
      params: 'last(//system.net.uptime[sysUpTime.0])'
      description: 'sysUpTime from the nested stock template. Same Overview 4th tile
        as VOSS/IQ. Do not bind the stock key on an svggraph item pattern — PHP
        Array to string conversion in CSvgGraphHelper::getMetricsPattern.'
      tags:
      - tag: component
        value: system
    - uuid: 604840101ee549bcba2a7cc835fa1924
      name: Interface discovery seed (not a port)
      type: CALCULATED
      key: 'net.if.status[ifOperStatus.__seed]'
      delay: 1m
      history: 1d
      trends: '0'
      value_type: FLOAT
      params: '0'
      description: |
        Always-present net.if.status key so count(exists_foreach) never becomes
        unsupported when Access has zero labelled ports. Not a real interface —
        subtracted in net.if.discovery.count. Do not graph.
      tags:
      - tag: component
        value: health
    - uuid: 5b5f794571c34e6796b3b9424b7b32f4
      name: Discovered interface count
      type: CALCULATED
      key: net.if.discovery.count
      delay: 1m
      history: 7d
      value_type: FLOAT
      params: 'count(exists_foreach(//net.if.status[*]))-1'
      description: |
        Enabled stock EXOS net.if.status items (nested template), minus the seed.
        Zero with SNMP up is the IFALIAS / GETBULK break. foreach ignores disabled
        leftovers. The seed keeps this item supported at 0 so LLD creating a port
        recovers the Average without a manual Check now.
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 2efe8d519f8546ab978d215ec79aff60
        expression: 'min(/Extreme EXOS Observability/exos.observability.snmp,1h)=1 and last(/Extreme EXOS Observability/net.if.discovery.count)<{$NET.IF.DISCOVERY.MIN}'
        name: 'Extreme EXOS: No discovered interfaces after SNMP is up'
        priority: AVERAGE
        description: |
          SNMP has been up for 1h and LLD produced no enabled net.if.status items.
          Access with no USW/UP labels is this ticket — fix the label, do not widen the regex.
          Dead box stays on stock ICMP High (snmp mirror is 0, so this does not double-page).
          Count stays 0 (supported) while empty; it is not nodata / Not supported.
        tags:
        - tag: scope
          value: availability
    tags:
    - tag: class
      value: network
    - tag: target
      value: exos-observability
    macros:
    - macro: '{$NET.IF.DISCOVERY.MIN}'
      value: '1'
      description: Average ticket when SNMP is up 1h and enabled interface items stay below this.
    - macro: '{$IF.FCS.WARN}'
      value: '2'
      description: Warning threshold of EtherLike FCS/alignment error rate (pkt/s). Context {#IFNAME}. Hysteresis 80%.
    discovery_rules:
    - uuid: 85825ca04de94822b56f2d53139a4b11
      name: EtherLike FCS discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SNMPVALUE},1.3.6.1.2.1.10.7.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8]
      key: net.if.fcs.discovery
      delay: 15m
      lifetime: 7d
      lifetime_type: DELETE_AFTER
      enabled_lifetime: '0'
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFOPERSTATUS}'
          value: '1'
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.MATCHES}'
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      description: 'EtherLike FCS/alignment on oper-up ports. Same IFALIAS macros as stock net.if.discovery. Does not fork stock EXOS YAML. Not-supported (no EtherLike) becomes empty LLD.'
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - |
          try {
          	var data = JSON.parse(value);
          }
          catch (error) {
          	throw 'Failed to parse JSON of EtherLike FCS discovery.';
          }
          var fields = ['{#SNMPVALUE}','{#IFOPERSTATUS}','{#IFALIAS}','{#IFNAME}'];
          data.forEach(function (element) {
          	fields.forEach(function (field) {
          		element[field] = element[field] || '';
          	});
          });
          return JSON.stringify(data);
      item_prototypes:
      - uuid: f19d46c02b25469d84a0b5d914567a6b
        name: 'Interface {#IFNAME}({#IFALIAS}): FCS errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.10.7.2.1.3.{#SNMPINDEX}]
        key: net.if.in.fcs[dot3StatsFCSErrors.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: EtherLike-MIB dot3StatsFCSErrors. Physical-layer CRC.'
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '-1'
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 7927f53238344db1bb9f0596597ced95
          expression: '(min(/Extreme EXOS Observability/net.if.in.fcs[dot3StatsFCSErrors.{#SNMPINDEX}],5m)>{$IF.FCS.WARN:"{#IFNAME}"} or min(/Extreme EXOS Observability/net.if.in.align[dot3StatsAlignmentErrors.{#SNMPINDEX}],5m)>{$IF.FCS.WARN:"{#IFNAME}"}) and last(/Extreme EXOS Observability/net.if.discontinuity[ifCounterDiscontinuityTime.{#SNMPINDEX}])=last(/Extreme EXOS Observability/net.if.discontinuity[ifCounterDiscontinuityTime.{#SNMPINDEX}],#2)'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: 'max(/Extreme EXOS Observability/net.if.in.fcs[dot3StatsFCSErrors.{#SNMPINDEX}],5m)<{$IF.FCS.WARN:"{#IFNAME}"}*0.8 and max(/Extreme EXOS Observability/net.if.in.align[dot3StatsAlignmentErrors.{#SNMPINDEX}],5m)<{$IF.FCS.WARN:"{#IFNAME}"}*0.8'
          name: 'Extreme EXOS: Interface {#IFNAME}({#IFALIAS}): High FCS/alignment error rate'
          event_name: 'Extreme EXOS: Interface {#IFNAME}({#IFALIAS}): High FCS/alignment error rate (>{$IF.FCS.WARN:"{#IFNAME}"} for 5m)'
          priority: WARNING
          description: 'EtherLike CRC/alignment on the Observability companion (no stock YAML fork). Recovers below 80%. Ignores counter discontinuity.'
          tags:
          - tag: scope
            value: performance
      - uuid: f1688cbe3b2f44899b6d72f94212b2d8
        name: 'Interface {#IFNAME}({#IFALIAS}): Alignment errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.10.7.2.1.2.{#SNMPINDEX}]
        key: net.if.in.align[dot3StatsAlignmentErrors.{#SNMPINDEX}]
        delay: 3m
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '-1'
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: f3173aeca9c847e9b487b800d4919c25
        name: 'Interface {#IFNAME}({#IFALIAS}): Symbol errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.10.7.2.1.18.{#SNMPINDEX}]
        key: net.if.in.symbol[dot3StatsSymbolErrors.{#SNMPINDEX}]
        delay: 3m
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '-1'
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: b2a7fd1e71f24d2b9c5c2203192a56d1
        name: 'Interface {#IFNAME}({#IFALIAS}): Counter discontinuity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.19.{#SNMPINDEX}]
        key: net.if.discontinuity[ifCounterDiscontinuityTime.{#SNMPINDEX}]
        delay: 3m
        preprocessing:
        - type: CHECK_NOT_SUPPORTED
          parameters:
          - '-1'
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
