            name: reference
            value: EPROB
          - type: INTEGER
            name: show
            value: '3'
          - type: INTEGER
            name: show_opdata
            value: '2'
        - type: svggraph
          name: CPU history
          'y': '4'
          width: '36'
          height: '6'
          fields:
