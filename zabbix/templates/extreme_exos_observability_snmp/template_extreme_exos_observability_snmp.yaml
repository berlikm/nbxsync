            name: ds.0.color.0
            value: 199C0D
          - type: INTEGER
            name: ds.0.dataset_type
            value: '0'
          - type: ITEM
            name: ds.0.itemids.0
            value:
              host: Extreme EXOS Observability
              key: exos.observability.cpu.util
          - type: STRING
            name: lefty_max
            value: '100'
