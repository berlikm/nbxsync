            value: '0'
          - type: ITEM
            name: ds.0.itemids.0
            value:
              host: Extreme EXOS Observability
              key: exos.observability.temperature
          - type: STRING
            name: reference
            value: ETMPH
          - type: INTEGER
            name: show_problems
            value: '1'
