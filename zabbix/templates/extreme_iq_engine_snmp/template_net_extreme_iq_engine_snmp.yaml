    macros:
    - macro: '{$ICMP_LOSS_WARN}'
      value: '10'
      description: 'Ops default (wired mgmt). Not an Extreme-published AP threshold; stock Zabbix often uses 20.'
    - macro: '{$ICMP_RESPONSE_TIME_WARN}'
      value: '0.15'
      description: Warning threshold of average ICMP response time in seconds.
    - macro: '{$SNMP.TIMEOUT}'
      value: '5m'
      description: Time interval for the SNMP availability trigger.
    - macro: '{$CPU.UTIL.CRIT}'
      value: '95'
      description: |
        Ops default — Extreme does not publish ahCpuUtilization alert points.
        GTAC 000056717: high CPU alone ≠ fault; 000099170: 30–60% can occur under load.
    - macro: '{$CPU.UTIL.WARN}'
      value: '90'
      description: |
        Ops default (raised from 80 to cut false pages). Baseline on live AP305C before tightening.
    - macro: '{$MEMORY.UTIL.MAX}'
      value: '90'
      description: AP memory critical %
    - macro: '{$TEMP_WARN}'
      value: '70'
      description: AP environment temp warning °C
    - macro: '{$TEMP_CRIT}'
      value: '85'
      description: AP environment temp critical °C
    - macro: '{$TEMP_CRIT_LOW}'
      value: '-273'
      description: Silence zero/unsupported temp
    - macro: '{$AP.CLIENT.WARN}'
      value: '10000'
      description: Safety mute if the DISABLED client-count trigger is ever enabled.
    - macro: '{$AP.RADIO.IFNAME.MATCHES}'
      value: '^(wifi|Wifi|WIFI|radio|Radio)[0-9]+$'
      description: 'Secondary LLD guard (AP305C wifi0/wifi1). Primary discriminator is ahIfType=0.'
    - macro: '{$NET.IF.IFNAME.MATCHES}'
      value: '^(eth|Eth|ETH|mgt|MGT)'
      description: Ethernet LLD ifName filter
    - macro: '{$NET.IF.IFTYPE.MATCHES}'
      value: '^6$'
      description: Ethernet ifType only
    - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
      value: '^1$'
      description: Admin-up only
    - macro: '{$IFCONTROL}'
      value: '1'
      description: 1=alert eth link-down
    - macro: '{$UNSUPPORTED.MAX}'
      value: '5'
      description: Average ticket when unsupported items stay above this for 30m.
