    macros:
    - macro: '{$CPU.UTIL.CRIT}'
      value: '90'
    - macro: '{$FAN_CRIT_STATUS}'
      value: '3'
      description: VOSS rcChasFanOperStatus down(3)
    - macro: '{$ICMP_LOSS_WARN}'
      value: '20'
      description: Warning threshold of ICMP packet loss in %.
    - macro: '{$ICMP_RESPONSE_TIME_WARN}'
      value: '0.15'
      description: Warning threshold of the average ICMP response time in seconds.
    - macro: '{$IF.ERRORS.WARN}'
      value: '2'
      description: Warning threshold of error packet rate. Can be used with interface name as context.
    - macro: '{$IF.UTIL.MAX}'
      value: '101'
      description: Silence stock bandwidth trigger (101=off). Capacity uses Port Speed Expect + class context.
    - macro: '{$IFCONTROL}'
      value: '1'
    - macro: '{$MEMORY.UTIL.MAX}'
      value: '90'
    - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
      value: ^.*
    - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
      value: ^2$
      description: Ignore down(2) administrative status
    - macro: '{$NET.IF.IFALIAS.MATCHES}'
      value: .*
    - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
    - macro: '{$NET.IF.IFDESCR.MATCHES}'
      value: .*
    - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
    - macro: '{$NET.IF.IFNAME.MATCHES}'
      value: ^.*$
    - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
      value: (^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})
      description: Filter out loopbacks, nulls, docker veth links and docker0 bridge by default
    - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
      value: ^.*$
    - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
      value: ^6$
      description: Ignore notPresent(6)
    - macro: '{$NET.IF.IFTYPE.MATCHES}'
      value: '^(6|161)$'
      description: Physical ethernet + LAG only (exclude EXOS/VOSS VLAN ifaces from port alerts).
    - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
    - macro: '{$PSU_CRIT_STATUS}'
      value: '4'
      description: VOSS rcChasPowerSupplyOperStatus down(4)
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time interval for the SNMP availability trigger.
    - macro: '{$TEMP_CRIT}'
      value: '65'
    - macro: '{$TEMP_CRIT_LOW}'
      value: '-273'
      description: Silence too-low false positives (stack/VM report 0┬░C). Keep critical high.
    - macro: '{$TEMP_CRIT_STATUS}'
      value: '3'
      description: VOSS rcVossSystemTemperatureStatus highCritial(3)
    - macro: '{$TEMP_WARN}'
      value: '999'
      description: Silence warning tier (closets without cooling); keep TEMP_CRIT + vendor status.
    - macro: '{$VIST.DOWN_STATUS}'
      value: '2'
      description: V-IST session down(2)
    - macro: '{$IST.DOWN_STATUS}'
      value: '2'
      description: IST session down(2)
    - macro: '{$CARD.DOWN_STATUS}'
      value: '2'
      description: rcCardOperStatus down(2)
    - macro: '{$ISIS.CIRCUIT.DOWN_STATUS}'
      value: '2'
      description: rcIsisCircuitOperState down(2)
    - macro: '{$MLT.AGG.DOWN_STATUS}'
      value: '2'
      description: rcMltAggOperState disable(2)
    - macro: '{$OPTIC.TEMP.CRIT}'
      value: '70'
      description: Optic temperature critical ┬░C
    - macro: '{$OPTIC.RX.POWER.MIN}'
      value: '1'
      description: Minimum optic RX power in ┬╡W (0 ignored)
    - macro: '{$IF.FLAP.WARN}'
      value: '0'
      description: 'Link-flap warning ΓÇö fire when rcPortNumStateTransition change exceeds this (context-capable).'
