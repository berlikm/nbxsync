      - uuid: dac59dd59578499c92014e48d0fc07f3
        name: 'Interface {#IFNAME}({#IFALIAS}): Shutdown reason'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.4.10.1.1.114.{#SNMPINDEX}]
        key: net.if.shutdown.reason[rcPortShutdownReason.{#SNMPINDEX}]
        delay: 5m
        description: 'MIB: rcPortShutdownReason.'
        valuemap:
          name: 'RAPID-CITY::rcPortShutdownReason'
        tags:
        - tag: component
          value: network
      trigger_prototypes:
      - uuid: 2a8e4279183249c7b6e069b716c79331
        expression: 'change(/Extreme VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Extreme VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          and (

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or

          last(/Extreme VOSS by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117

          )

          and

          (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: '(change(/Extreme VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Extreme VOSS
          by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or

          (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)

          '
        name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
        opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
        priority: INFO
        description: This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of
          autonegotiation issues. Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 00c3ec6c234a40f3861332561ebe1588
        expression: '(avg(/Extreme VOSS by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Extreme
          VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or

          avg(/Extreme VOSS by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Extreme
          VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and

          last(/Extreme VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'avg(/Extreme VOSS by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Extreme
          VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and

          avg(/Extreme VOSS by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Extreme
          VOSS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])

          '
        name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
        event_name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
        opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: The utilization of the network interface is close to its estimated maximum bandwidth.
        manual_close: 'YES'
        dependencies:
        - name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 63d194df25f548ed98a7b9ac03c328f1
        expression: 'min(/Extreme VOSS by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          or min(/Extreme VOSS by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'max(/Extreme VOSS by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          and max(/Extreme VOSS by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          '
        name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): High error rate'
        event_name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
        opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.
        manual_close: 'YES'
        dependencies:
        - name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
      graph_prototypes:
      - uuid: 7cc861d8cdf94af3a9fe99f13162f867
