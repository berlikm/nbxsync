          value: network
        trigger_prototypes:
        - uuid: e833cd51334b46fbb4d7e501ff25b0ab
          expression: change(/Extreme VOSS by SNMP/net.if.flaps[rcPortNumStateTransition.{#SNMPINDEX}])>{$IF.FLAP.WARN:"{#IFNAME}"}
          name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Link flapping'
