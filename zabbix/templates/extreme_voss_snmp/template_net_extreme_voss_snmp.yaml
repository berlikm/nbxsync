    discovery_rules:
    - uuid: 45c2d7874f464d96a9cc9dfaea618499
      name: FAN Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SNMPVALUE},1.3.6.1.4.1.2272.1.4.7.1.1.1]
      key: fan.discovery
      delay: 1h
      item_prototypes:
      - uuid: 7975ce969e59437490e7c8d41e6e1747
        name: 'Fan {#SNMPVALUE}: Ambient temperature'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.4.7.1.1.3.{#SNMPINDEX}]
        key: sensor.fan.temp[rcChasFanAmbientTemperature.{#SNMPINDEX}]
        units: ┬░C
        description: 'MIB: RAPID-CITY rcChasFanAmbientTemperature

          Air temperature entering the fan (┬░C).'
        tags:
        - tag: component
          value: fan
        value_type: FLOAT
      - uuid: 7fb2bc992e2140b88ef633bb26a27630
        name: 'Fan {#SNMPVALUE}: Fan status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.4.7.1.1.2.{#SNMPINDEX}]
        key: sensor.fan.status[rcChasFanOperStatus.{#SNMPINDEX}]
        delay: 3m
        trends: '0'
        description: 'MIB: RAPID-CITY rcChasFanOperStatus

          unknown(1) up(2) down(3) notpresent(4)'
        valuemap:
          name: RAPID-CITY::rcChasFanOperStatus
        tags:
        - tag: component
          value: fan
        trigger_prototypes:
        - uuid: efd3e1471ae34377b36acd6795801974
          expression: count(/Extreme VOSS by SNMP/sensor.fan.status[rcChasFanOperStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS}")=1
          name: 'Extreme VOSS: Fan {#SNMPVALUE}: Fan is in critical state'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: Please check the fan unit
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
      description: RAPID-CITY rcChasFanTable ΓÇö fan id discovery.
    - uuid: 543dd008b3df42c5b6f486833a0e3e5f
      name: Slot memory discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SNMPVALUE},1.3.6.1.4.1.2272.1.85.10.1.1.2]
      key: memory.discovery
      delay: 1h
      item_prototypes:
      - uuid: 8e90ef98f3224661b8d3cdba44d6b9d6
        name: 'Slot {#SNMPINDEX}: Available memory'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.7.{#SNMPINDEX}]
        key: vm.memory.available[rcKhiSlotMemFree.{#SNMPINDEX}]
        units: B
        description: 'MIB: RAPID-CITY rcKhiSlotMemFree

          DRAM available in KB.'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1024'
        tags:
        - tag: component
          value: memory
      - uuid: cf1242df1b884eae8444fa935798ede6
        name: 'Slot {#SNMPINDEX}: Used memory'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.6.{#SNMPINDEX}]
        key: vm.memory.used[rcKhiSlotMemUsed.{#SNMPINDEX}]
        units: B
        description: 'MIB: RAPID-CITY rcKhiSlotMemUsed

          DRAM used in KB.'
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1024'
        tags:
        - tag: component
          value: memory
      - uuid: e60dbcd12eb14f2fa8b9b0c1a14b588b
        name: 'Slot {#SNMPINDEX}: Memory utilization'
        type: SNMP_AGENT
        key: vm.memory.util[rcKhiSlotMemUtil.{#SNMPINDEX}]
        value_type: FLOAT
        units: '%'
        description: 'MIB: RAPID-CITY rcKhiSlotMemUtil

          Current memory utilization %.'
        tags:
        - tag: component
          value: memory
        trigger_prototypes:
        - uuid: db5abe04de1741c08a507119f25b108b
          expression: min(/Extreme VOSS by SNMP/vm.memory.util[rcKhiSlotMemUtil.{#SNMPINDEX}],5m)>{$MEMORY.UTIL.MAX}
          name: 'Extreme VOSS: Slot {#SNMPINDEX}: High memory utilization'
          event_name: 'Extreme VOSS: Slot {#SNMPINDEX}: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
          priority: AVERAGE
          description: The system is running out of free memory.
          tags:
          - tag: scope
            value: capacity
          - tag: scope
            value: performance
        snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.8.{#SNMPINDEX}]
      - uuid: 615337b676354077988df22cf17efa82
        name: 'Slot {#SNMPINDEX}: Memory utilization 5m avg'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.9.{#SNMPINDEX}]
        key: vm.memory.util.avg5[rcKhiSlotMem5MinAve.{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: '%'
        description: 'MIB: rcKhiSlotMem5MinAve'
        tags:
        - tag: component
          value: memory
      graph_prototypes:
      - uuid: 47e0c8bbd08e42929c073822cf86b16b
        name: 'Slot {#SNMPINDEX}: Memory usage'
        ymin_type_1: FIXED
        graph_items:
        - drawtype: BOLD_LINE
          color: 199C0D
          item:
            host: Extreme VOSS by SNMP
            key: vm.memory.used[rcKhiSlotMemUsed.{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: GRADIENT_LINE
          color: F63100
          item:
            host: Extreme VOSS by SNMP
            key: vm.memory.available[rcKhiSlotMemFree.{#SNMPINDEX}]
      - uuid: 08de931765df42d1967d7d995402951f
        name: 'Slot {#SNMPINDEX}: Memory utilization'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: Extreme VOSS by SNMP
            key: vm.memory.util[rcKhiSlotMemUtil.{#SNMPINDEX}]
      description: RAPID-CITY rcKhiSlotPerfTable ΓÇö memory per slot. CPU uses scalar item for slot 1 (rcKhiSlotCpuCurrentUtil.1).
    - uuid: c0e08139247945038307dfe2a3a5a579
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]
      key: net.if.discovery
      delay: 15m
      lifetime: '0'
      enabled_lifetime: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.MATCHES}'
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.MATCHES}'
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.MATCHES}'
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      description: Discovering interfaces from IF-MIB.
      item_prototypes:
      - uuid: b4a142becd4945c1af65c411f8852329
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: net.if.in.discards[ifInDiscards.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          The number of inbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 65d4466403c64d02b74077e9641eead5
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable
          to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission
          units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in
          the value of this counter can occur at re-initialization of the management system, and at other times as indicated
          by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6c2f384768944856829f41420d6584a7
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        delay: 3m
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets received on the interface, including framing characters. This object is a 64-bit version
          of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system,
          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 7494e703ec164c7ea3d638c4ad907865
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          The number of outbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 5976b81ca1e64153a6fdd695855f8fbb
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: net.if.out.errors[ifOutErrors.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being
          deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of outbound
          transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities
          in the value of this counter can occur at re-initialization of the management system, and at other times as indicated
          by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: b57a8839fd9847a08d517bafbd3637af
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        delay: 3m
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit
          version of ifOutOctets.Discontinuities in the value of this counter can occur at re-initialization of the management
          system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 62ba1c41cc1246028a3ec00fbaf58177
        name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]
        key: net.if.speed[ifHighSpeed.{#SNMPINDEX}]
        delay: 5m
        trends: '0'
        units: bps
        description: 'MIB: IF-MIB

          An estimate of the interface''s current bandwidth in units of 1,000,000 bits per second. If this object reports
          a value of `n'' then the speed of the interface is somewhere in the range of `n-500,000'' to`n+499,999''.  For interfaces
          which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain
          the nominal bandwidth. For a sub-layer which has no concept of bandwidth, this object should be zero.

          '
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 40b3a2b285554a4c9b6150227fc66bbe
        name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: net.if.status[ifOperStatus.{#SNMPINDEX}]
        trends: '0'
        description: 'MIB: IF-MIB

          The current operational state of the interface.

          - The testing(3) state indicates that no operational packet scan be passed

          - If ifAdminStatus is down(2) then ifOperStatus should be down(2)

          - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit
          and receive network traffic

          - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting
          for an incoming connection)

          - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1)
          state

          - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.

          '
        valuemap:
          name: IF-MIB::ifOperStatus
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 7b543f006f5046de8a4604ac30104969
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Extreme VOSS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
          name: 'Extreme VOSS: Interface {#IFNAME}({#IFALIAS}): Link down'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: 'This trigger expression works as follows:

            1. It can be triggered if the operations status is down.

            2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not
            important. No new trigger will be fired if this interface is down.

            3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the operational status was up to (1) sometime
            before (so, does not fire for "eternal off" interfaces.)


            WARNING: if closed manually - it will not fire again on the next poll, because of .diff.

            '
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
      - uuid: 3f4252c143004767bfec9a219046b5e4
        name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]
        key: net.if.type[ifType.{#SNMPINDEX}]
        delay: 1h
        trends: '0'
        description: 'MIB: IF-MIB

          The type of interface.

          Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),

          through updating the syntax of the IANAifType textual convention.

          '
        valuemap:
          name: IF-MIB::ifType
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 20b5ec2a764d4cbc9291bdd768bdfd0a
        name: 'Interface {#IFNAME}({#IFALIAS}): State transitions'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2272.1.4.10.1.1.21.{#SNMPINDEX}]
        key: net.if.flaps[rcPortNumStateTransition.{#SNMPINDEX}]
        delay: 5m
        description: 'MIB: rcPortNumStateTransition ΓÇö link state change count.'
        tags:
