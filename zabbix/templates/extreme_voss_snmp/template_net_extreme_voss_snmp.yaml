zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: ef500de1308e475bb8aa20dd10cbfd46
    template: Extreme VOSS by SNMP
    name: Extreme VOSS by SNMP
    description: 'Template Extreme VOSS / Fabric Engine


      MIBs used:

      RAPID-CITY (enterprises.2272) ΓÇö rcKhi, rcChassis, rcVossSystem, rcSystem,
      rcPlugOptMod, rcIsis/SPBM, rcVirtualIst, rcMlt, rcCard
      LLDP-MIB

      IF-MIB

      EtherLike-MIB

      HOST-RESOURCES-MIB

      SNMPv2-MIB


      Modeled on official Extreme EXOS by SNMP; OIDs remapped for VOSS.

      Note: rcSysCpuUtil/rcSysDram* are NOT supported on VOSS ΓÇö using rcKhiSlot*.

      '
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 8aa443651dc04d919c41fba12ac0fbdc
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      description: 'The host accessibility by ICMP ping.


        0 - ICMP ping fails;

        1 - ICMP ping successful.

        '
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 588e36de8bc24e0ba667a0d88a50817d
        expression: max(/Extreme VOSS by SNMP/icmpping,#3)=0
        name: 'Extreme VOSS: Unavailable by ICMP ping'
        priority: HIGH
        description: Last three attempts returned timeout. Please check device connectivity.
        tags:
        - tag: scope
          value: availability
    - uuid: 29fabd2b2f254495ac00946297e61ae5
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: '%'
      description: The percentage of lost packets.
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: b521f1e72b984d35ab89e169bc86df9b
        expression: min(/Extreme VOSS by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Extreme VOSS by SNMP/icmppingloss,5m)<100
        name: 'Extreme VOSS: High ICMP ping loss'
        opdata: 'Loss: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: ICMP packets loss detected.
        dependencies:
        - name: 'Extreme VOSS: Unavailable by ICMP ping'
          expression: max(/Extreme VOSS by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: da8f3cc31315418180c576b3084911b4
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: s
      description: The ICMP ping response time (in seconds).
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: a5bbb869aedb4bd8b543c7fdbb42f0e4
        expression: avg(/Extreme VOSS by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'Extreme VOSS: High ICMP ping response time'
        opdata: 'Value: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Average ICMP response time is too high.
        dependencies:
        - name: 'Extreme VOSS: High ICMP ping loss'
          expression: min(/Extreme VOSS by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Extreme VOSS by SNMP/icmppingloss,5m)<100
        - name: 'Extreme VOSS: Unavailable by ICMP ping'
          expression: max(/Extreme VOSS by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 72bf3d125d92439080c2cab9de3acc8e
      name: SNMP traps (fallback)
      type: SNMP_TRAP
      key: snmptrap.fallback
      value_type: LOG
      description: The item is used to collect all SNMP traps unmatched by other snmptrap items
      logtimefmt: hh:mm:sszyyyy/MM/dd
      tags:
      - tag: component
        value: network
    - uuid: 96d1581403e6436683b85737dba7fda8
      name: System contact details
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: system.contact[sysContact.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        The textual identification of the contact person for this managed node, together with information on how to contact
        this person. If no contact information is known, the value is the zero-length string.

        '
      inventory_link: CONTACT
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 9a4e06d70cff4d27be73307f44c82b81
      name: CPU utilization (slot 1)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.2.1]
      key: system.cpu.util[rcKhiSlotCpuCurrentUtil.1]
      value_type: FLOAT
      units: '%'
      description: 'MIB: RAPID-CITY rcKhiSlotCpuCurrentUtil

        Percentage CPU utilization for slot 1 (VOSS/Fabric Engine).

        rcSysCpuUtil is not supported on VOSS.'
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 629f1df200f74d008e06ad1a49299b66
        expression: min(/Extreme VOSS by SNMP/system.cpu.util[rcKhiSlotCpuCurrentUtil.1],5m)>{$CPU.UTIL.CRIT}
        name: 'Extreme VOSS: High CPU utilization'
        event_name: 'Extreme VOSS: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: The CPU utilization is too high. The system might be slow to respond.
        tags:
        - tag: scope
          value: performance
    - uuid: eb1be9ff87184c5baa0b3f9787989130
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: system.descr[sysDescr.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        A textual description of the entity. This value should

        include the full name and version identification of the system''s hardware type, software operating-system, and

        networking software.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 2b81489f8f7d4c0ab046533d58ecf042
      name: Firmware version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.9.1]
      key: system.hw.firmware
      delay: 1h
      value_type: CHAR
      description: 'MIB: ENTITY-MIB entPhysicalFirmwareRev (index 1)

        May be empty on some VOSS platforms ΓÇö verify with snmpget.'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 33dea881de8a41f4b975fdda20ca7780
        expression: last(/Extreme VOSS by SNMP/system.hw.firmware,#1)<>last(/Extreme VOSS by SNMP/system.hw.firmware,#2) and
          length(last(/Extreme VOSS by SNMP/system.hw.firmware))>0
        name: 'Extreme VOSS: Firmware has changed'
        opdata: 'Current value: {ITEM.LASTVALUE1}'
        priority: INFO
        description: Firmware version has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 8efec9ad649948769586d05cf0e29355
      name: Hardware model name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.67.0]
      key: system.hw.model
      delay: 1h
      value_type: CHAR
      description: 'MIB: RAPID-CITY rcChasModelName'
      inventory_link: MODEL
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 454efdac976240b49f1de25eb2eba142
      name: Hardware serial number
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.2.0]
      key: system.hw.serialnumber
      delay: 1h
      value_type: CHAR
      description: 'MIB: RAPID-CITY rcChasSerialNumber'
      inventory_link: SERIALNO_A
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: f60a10fdc3c64f64bfddfe5f4b96c6a5
        expression: last(/Extreme VOSS by SNMP/system.hw.serialnumber,#1)<>last(/Extreme VOSS by SNMP/system.hw.serialnumber,#2)
          and length(last(/Extreme VOSS by SNMP/system.hw.serialnumber))>0
        name: 'Extreme VOSS: Device has been replaced'
        event_name: 'Extreme VOSS: Device has been replaced (new serial number received)'
        priority: INFO
        description: Device serial number has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: e56bd27d5d4b45e8ac6d6db2e1902d0c
      name: Uptime (hardware)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.1.1.0]
      key: system.hw.uptime[hrSystemUptime.0]
      delay: 30s
      trends: '0'
      units: uptime
      description: 'MIB: HOST-RESOURCES-MIB

        HOST-RESOURCES hrSystemUptime ΓÇö often unsupported on VOSS/Fabric Engine (No Such Object).
        Preprocessing maps not-supported to 0; restart trigger falls back to sysUpTime.

        '
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 7b559ecf0b604be0b1e3db19b5b675a7
      name: Hardware version(revision)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.3.0]
      key: system.hw.version
      delay: 1h
      value_type: CHAR
      description: 'MIB: RAPID-CITY rcChasHardwareRevision'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: e03de1e870154900827b05eb481b1350
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: system.location[sysLocation.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.

        '
      inventory_link: LOCATION
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 2465c9b1c20e42779ebba5d3be208806
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: system.name
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        An administratively-assigned name for this managed node.By convention, this is the node''s fully-qualified domain
        name. If the name is unknown, the value is the zero-length string.

        '
      inventory_link: NAME
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: d94ae10cde3649b7a5297848c2af7f10
        expression: last(/Extreme VOSS by SNMP/system.name,#1)<>last(/Extreme VOSS by SNMP/system.name,#2) and length(last(/Extreme
          VOSS by SNMP/system.name))>0
        name: 'Extreme VOSS: System name has changed'
        event_name: 'Extreme VOSS: System name has changed (new name: {ITEM.VALUE})'
        priority: INFO
        description: The name of the system has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        - tag: scope
          value: security
    - uuid: f6b9039a5b704ddcbc58cf582cde6929
      name: Uptime (network)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: system.net.uptime[sysUpTime.0]
      delay: 30s
      trends: '0'
      units: uptime
      description: 'MIB: SNMPv2-MIB

        Time (in hundredths of a second) since the network management portion of the system was last re-initialized.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 7f9f3a9b04bd4f3cb2f46a2eb4185ad7
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: system.objectid[sysObjectID.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        The vendor''s authoritative identification of the network management subsystem contained in the entity. This value
        is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what
        kind of box'' is being managed.  For example, if vendor`Flintstones, Inc.'' was assigned the subtree1.3.6.1.4.1.4242,
        it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router''.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: a55732926bfe4d7494b83aacd30ffd66
      name: Operating system
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.1.7.0]
      key: system.sw.os[rcSysVersion.0]
      delay: 1h
      value_type: CHAR
      description: 'MIB: RAPID-CITY rcSysVersion

        Software version string.'
      inventory_link: OS
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: os
      triggers:
      - uuid: 3ef3c52582394116b30cb92f35e1bd19
        expression: last(/Extreme VOSS by SNMP/system.sw.os[rcSysVersion.0],#1)<>last(/Extreme VOSS by SNMP/system.sw.os[rcSysVersion.0],#2)
          and length(last(/Extreme VOSS by SNMP/system.sw.os[rcSysVersion.0]))>0
        name: 'Extreme VOSS: Operating system description has changed'
        priority: INFO
        description: Operating system description has changed. Possible reasons that system has been updated or replaced.
          Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'Extreme VOSS: System name has changed'
          expression: last(/Extreme VOSS by SNMP/system.name,#1)<>last(/Extreme VOSS by SNMP/system.name,#2) and length(last(/Extreme
            VOSS by SNMP/system.name))>0
        tags:
        - tag: scope
          value: notice
    - uuid: 7b57a6652b2e4d30a3f8f920e4301bf4
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      description: 'Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the
        host list.

        Possible values:

        0 - not available

        1 - available

        2 - unknown

        '
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: a529239ff54c46c0a4bfcde7891fb826
        expression: max(/Extreme VOSS by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Extreme VOSS: No SNMP data collection'
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: SNMP is not available for polling. Please check device connectivity and SNMP settings.
        dependencies:
        - name: 'Extreme VOSS: Unavailable by ICMP ping'
          expression: max(/Extreme VOSS by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
    - uuid: b909f8e8ee8941c98c11173572270452
      name: 'CPU utilization 1m avg (slot 1)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.23.1]
      key: system.cpu.util.avg1[rcKhiSlotCpu1MinAve.1]
      value_type: FLOAT
      units: '%'
      description: 'MIB: rcKhiSlotCpu1MinAve ΓÇö 1-minute average CPU util for slot 1.'
      tags:
      - tag: component
        value: cpu
    - uuid: 96b7a23257dc46b7a0790509f71c20e1
      name: 'CPU utilization 5m avg (slot 1)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.3.1]
      key: system.cpu.util.avg5[rcKhiSlotCpu5MinAve.1]
      value_type: FLOAT
      units: '%'
      description: 'MIB: rcKhiSlotCpu5MinAve ΓÇö 5-minute average CPU util for slot 1.'
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: ece609763cfd408f8c78abb5a0ad3efd
        expression: min(/Extreme VOSS by SNMP/system.cpu.util.avg5[rcKhiSlotCpu5MinAve.1],5m)>{$CPU.UTIL.CRIT}
        name: 'Extreme VOSS: High CPU utilization (5m avg)'
        priority: WARNING
        description: '5-minute average CPU utilization is too high.'
        tags:
        - tag: scope
          value: performance
    - uuid: 4baf753d9a3d4c6185b6a9dfc6cbe2b6
      name: 'Memory utilization 5m avg (slot 1)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.85.10.1.1.9.1]
      key: vm.memory.util.avg5[rcKhiSlotMem5MinAve.1]
      value_type: FLOAT
      units: '%'
      description: 'MIB: rcKhiSlotMem5MinAve ΓÇö 5-minute average memory util for slot 1.'
      tags:
      - tag: component
        value: memory
    - uuid: cce780d5a5bc4172a6724fadfc26e9aa
      name: 'Chassis number of slots'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.4.0]
      key: system.hw.chassis.slots[rcChasNumSlots.0]
      delay: 1h
      description: 'MIB: rcChasNumSlots'
      tags:
      - tag: component
        value: system
    - uuid: f7087a6e08914c65b5fa4a5fab412781
      name: 'Chassis number of ports'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.5.0]
      key: system.hw.chassis.ports[rcChasNumPorts.0]
      delay: 1h
      description: 'MIB: rcChasNumPorts'
      tags:
      - tag: component
        value: system
    - uuid: 871b175ce4184149b4df2a1791d25242
      name: 'Chassis part number'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.66.0]
      key: system.hw.chassis.partnumber[rcChasPartNumber.0]
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: 'MIB: rcChasPartNumber'
      tags:
      - tag: component
        value: system
    - uuid: 36e059ac448843e58a6c7cd35cc38672
      name: 'Chassis brand name'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.4.68.0]
      key: system.hw.chassis.brand[rcChasBrandName.0]
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: 'MIB: rcChasBrandName'
      tags:
      - tag: component
        value: system
    - uuid: 8d49b1ee5f9c4ca9b7b64af382e019d9
      name: 'Chassis base MAC address'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.100.1.5.0]
      key: system.hw.chassis.basemac[rc2kChassisBaseMacAddr.0]
      delay: 1h
      value_type: CHAR
      trends: '0'
      description: 'MIB: rc2kChassisBaseMacAddr'
      tags:
      - tag: component
        value: system
    - uuid: 06b62a5f15f743e899b7255d8847df97
      name: 'Total power capacity'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.1.116.0]
      key: sensor.power.total[rcSysTotalPower.0]
      delay: 1h
      value_type: FLOAT
      units: 'W'
      description: 'MIB: rcSysTotalPower (watts).'
      tags:
      - tag: component
        value: power
    - uuid: a0b1cd1738634c28ae48d095aa5a4209
      name: 'Redundant power capacity'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.1.117.0]
      key: sensor.power.redundant[rcSysRedundantPower.0]
      delay: 1h
      value_type: FLOAT
      units: 'W'
      description: 'MIB: rcSysRedundantPower (watts).'
      tags:
      - tag: component
        value: power
    - uuid: ed3bc904881a4a52bb4b8a8a2625b0e4
      name: 'V-IST session status'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.211.1.0]
      key: fabric.vist.status[rcVirtualIstSessionStatus.0]
      delay: 1m
      description: 'MIB: rcVirtualIstSessionStatus ΓÇö up(1) down(2).'
      valuemap:
        name: 'RAPID-CITY::rcVirtualIstSessionStatus'
      tags:
      - tag: component
        value: fabric
      triggers:
      - uuid: 95190b5f61e144b1bbb854521b10fc00
        expression: '{$VIST.CONTROL}=1 and last(/Extreme VOSS by SNMP/fabric.vist.status[rcVirtualIstSessionStatus.0])={$VIST.DOWN_STATUS}'
        name: 'Extreme VOSS: V-IST session is down'
        priority: HIGH
        description: 'Virtual IST session is down (if V-IST is used).'
        tags:
        - tag: scope
          value: availability
    - uuid: 86e9c58574264622bbb217fffab95acd
      name: 'V-IST peer IP'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.211.2.0]
      key: fabric.vist.peer[rcVirtualIstPeerIp.0]
      delay: 5m
      value_type: CHAR
      trends: '0'
      description: 'MIB: rcVirtualIstPeerIp'
      tags:
      - tag: component
        value: fabric
    - uuid: 0cdc34d751f54fb4ae1bc239a4112117
      name: 'V-IST VLAN ID'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2272.1.211.3.0]
      key: fabric.vist.vlan[rcVirtualIstVlanId.0]
      delay: 5m
      description: 'MIB: rcVirtualIstVlanId'
      tags:
      - tag: component
        value: fabric
