  triggers:
  - uuid: db7291ebfca7432b967585b4853fc1ad
    expression: (last(/Extreme VOSS by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/Extreme VOSS by SNMP/system.hw.uptime[hrSystemUptime.0])<10m)
      or (last(/Extreme VOSS by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/Extreme VOSS by SNMP/system.net.uptime[sysUpTime.0])<10m)
    name: 'Extreme VOSS: Host has been restarted'
    event_name: 'Extreme VOSS: {HOST.NAME} has been restarted (uptime < 10m)'
    priority: WARNING
    description: Uptime is less than 10 minutes.
    manual_close: 'YES'
    dependencies:
    - name: 'Extreme VOSS: No SNMP data collection'
      expression: max(/Extreme VOSS by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
    tags:
    - tag: scope
      value: notice
  graphs:
  - uuid: f9a85b23be724b29a9016c7f39ec6481
    name: 'Extreme VOSS: CPU utilization'
    ymin_type_1: FIXED
    ymax_type_1: FIXED
    graph_items:
    - drawtype: GRADIENT_LINE
      color: 199C0D
      item:
        host: Extreme VOSS by SNMP
        key: system.cpu.util[rcKhiSlotCpuCurrentUtil.1]
