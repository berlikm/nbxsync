        - uuid: 8262680c7331464fbc3d861133b09dd7
          name: ExtremeCloud IQ API available
          type: DEPENDENT
          key: xiq.cloud.available
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
