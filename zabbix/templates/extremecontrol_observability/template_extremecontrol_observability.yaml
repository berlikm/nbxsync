zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: 36b575ac588e4b7aa053ab032b3c6ac3
      template: ExtremeControl Observability
      name: ExtremeControl Observability
      description: |
        ExtremeControl engine companion. ICMP and Linux agent stay on the VM
        path — this template does not nest ICMP and does not speak RADIUS.
        FreeRADIUS down is ticketed from XIQ-SE Observability engine LLD.
        Portal TCP 8444 is disabled until opted in.

        Operator page: zabbix/07-extreme-control.md.
        Refresh with configure_nbxsync_network.py --apply-xiqse.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$NAC.PORTAL.PORT}'
          value: '8444'
          description: Captive portal / admin HTTPS. Not RADIUS 1812.
        - macro: '{$NAC.PORTAL.FQDN}'
          value: ''
          description: Engine FQDN or IP. Role Jinja on primary_ip4.
        - macro: '{$NAC.PORTAL.CONTROL}'
          value: '0'
          description: Ticket portal TCP down. Default off — not auth.
      items:
        - uuid: 12acf3f8703d49368e9c54f5d0898ef1
          name: ExtremeControl portal TCP
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$NAC.PORTAL.PORT}]'
          delay: 1m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: portal
          triggers:
            - uuid: d5155205a96c41d090036cf608fc9bb9
              expression: '{$NAC.PORTAL.CONTROL}=1 and max(/ExtremeControl Observability/net.tcp.service[tcp,,{$NAC.PORTAL.PORT}],#3)=0'
              name: 'ExtremeControl: portal TCP 8444 down'
              event_name: 'ExtremeControl: portal TCP 8444 down'
              priority: WARNING
              status: DISABLED
              description: |
                Admin/portal port, not RADIUS. Enable {$NAC.PORTAL.CONTROL} after a quiet pilot.
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: class
          value: network
        - tag: target
          value: extremecontrol
      dashboards:
        - uuid: 1c957a19146f46ef94da5522bdea4fc9
          name: Health
          pages:
            - name: Overview
              widgets:
                - type: item
                  name: Portal TCP
                  width: '24'
                  height: '4'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: ExtremeControl Observability
                        key: 'net.tcp.service[tcp,,{$NAC.PORTAL.PORT}]'
                    - type: INTEGER
                      name: show.0
                      value: '2'
                    - type: INTEGER
                      name: value_bold
                      value: '1'
                    - type: INTEGER
                      name: value_size
                      value: '28'
                - type: problems
                  name: Problems
                  x: '24'
                  width: '48'
                  height: '4'
                  fields:
                    - type: STRING
                      name: reference
                      value: NPROB
                    - type: INTEGER
                      name: show
                      value: '3'
      valuemaps:
        - uuid: b9e0d1c24a3f4e5d8c7b6a5948372615
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
