zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: dc9704d3a182532bb9832dcb62f9d4e0
      template: ExtremeControl by SNMP
      name: ExtremeControl by SNMP
      description: |
        ExtremeControl / IA-V engine via SNMP. MIB: ENTERASYS-NAC-APPLIANCE-MIB
        (etsysModules 73, 1.3.6.1.4.1.5624.1.2.73). Canary 2026-08-28: all five
        ENACs answered 16 Counter64 scalars with the switch MONITORING SNMPv3
        profile (MD5/DES).

        Does not nest ICMP (06 / existing ping owns it). Does not speak RADIUS
        UDP. Does not clone EXOS/VOSS/IQ templates. License seats stay on
        XIQ-SE Observability GraphQL.

        Operator page: zabbix/07-extreme-control.md.
        OIDs: templates/extremecontrol_snmp/OID_MAPPING.md.
        Refresh with configure_nbxsync_network.py --apply-xiqse.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$SNMP.TIMEOUT}'
          value: '5m'
          description: Time interval for the SNMP availability trigger.
        - macro: '{$UNSUPPORTED.MAX}'
          value: '1'
          description: Average when unsupported items stay above this for 30m.
        - macro: '{$NAC.SNMP.CONTACTLOST.CONTROL}'
          value: '0'
          description: Ticket contact-lost switches > 0. Default off until the Counter64-as-gauge reading is trusted.
        - macro: '{$NAC.SNMP.FAIL.WARN}'
          value: '101'
          description: Decided-auth failure % Warning. 101 silences until a quiet baseline.
      items:
        - uuid: d4b892e15d4155f1824526d6725666d8
          name: SNMP agent availability
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            0 not available, 1 available, 2 unknown. Mgmt blind; RADIUS may still work.
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 32e02f7816b65d879fc4698404633d2b
              expression: max(/ExtremeControl by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              name: 'ExtremeControl SNMP: No SNMP data collection'
              event_name: 'ExtremeControl SNMP: No SNMP data collection'
              priority: WARNING
              description: |
                Mgmt blind; 802.1X may still work. ICMP High from 06 is the page
                if the box is gone. Same SNMPv3 profile as switches (MONITORING).
              tags:
                - tag: scope
                  value: availability
        - uuid: eaf043853f4e580893d02f8945622c3d
          name: Unsupported item count
          type: INTERNAL
          key: 'zabbix[host,,items_unsupported]'
          delay: 15m
          description: Watch the watcher — the 16 canary OIDs must not go silent.
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 45a3a824e2d05f5980c03346649e7b17
              expression: min(/ExtremeControl by SNMP/zabbix[host,,items_unsupported],30m)>{$UNSUPPORTED.MAX}
              name: 'ExtremeControl SNMP: Too many unsupported items'
              event_name: 'ExtremeControl SNMP: Too many unsupported items'
              priority: AVERAGE
              description: SNMP=1 but items unsupported — view/OID mismatch, not a cable.
              dependencies:
                - name: 'ExtremeControl SNMP: No SNMP data collection'
                  expression: max(/ExtremeControl by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: availability
        - uuid: 93046c3946d15491b88182bce9dcf579
          name: SNMP
          type: CALCULATED
          key: nac.snmp.available
          delay: 1m
          value_type: FLOAT
          params: 'last(//zabbix[host,snmp,available])'
          description: Headline SNMP for the Overview tile.
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
        - uuid: 29bcdef835445d6ea59ba454bcb5fac9
          name: System name
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: f3b06d702a095615994b8f729d15a2ba
              expression: last(/ExtremeControl by SNMP/system.name,#1)<>last(/ExtremeControl by SNMP/system.name,#2) and length(last(/ExtremeControl by SNMP/system.name))>0
              name: 'ExtremeControl SNMP: System name has changed'
              event_name: 'ExtremeControl SNMP: System name has changed'
              priority: INFO
              description: Possible replacement or rename. Acknowledge to close.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: c741e56e1d1850829201ff7146cb8efa
          name: System description
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          inventory_link: TYPE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: f9c3ab8360715fbf9c63ba1f53cac04b
          name: System object ID
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'system.objectid[sysObjectID.0]'
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          description: |
            IA-V is 1.3.6.1.4.1.1916.2.252 when Extreme set sysObjectID.
            Stock net-snmp Linux is 1.3.6.1.4.1.8072.3.2.10 — still a Control
            engine if ENTERASYS-NAC-APPLIANCE-MIB answers.
          tags:
            - tag: component
              value: system
        - uuid: 423cbe088201577ab9bf97e5710c630e
          name: ExtremeControl product
          type: DEPENDENT
          key: nac.snmp.product
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                    var CONTROL_PRODUCTS = {
                      '1.3.6.1.4.1.1916.2.251': 'NAC-A-20',
                      '1.3.6.1.4.1.1916.2.252': 'IA-V',
                      '1.3.6.1.4.1.1916.2.253': 'IA-A-20',
                      '1.3.6.1.4.1.1916.2.254': 'IA-A-300',
                      '1.3.6.1.4.1.1916.2.279': 'IA-A-25',
                      '1.3.6.1.4.1.1916.2.280': 'IA-A-305',
                      '1.3.6.1.4.1.1916.2.418': 'IA-Generic'
                    };

                    function normalizeOid(oid) {
                      return String(oid || '').replace(/^\.+/, '');
                    }

                    function classifyControlProduct(oid) {
                      return CONTROL_PRODUCTS[normalizeOid(oid)] || '';
                    }

                    function controlProductIdentity(oid) {
                      return classifyControlProduct(oid) ? 1 : 0;
                    }

                    return classifyControlProduct(value);

          master_item:
            key: 'system.objectid[sysObjectID.0]'
          tags:
            - tag: component
              value: system
        - uuid: f279640b7b905a65976ab96ef7d0ad03
          name: ExtremeControl product identity
          type: DEPENDENT
          key: nac.snmp.identity
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          description: 1 when sysObjectID is an Extreme Access Control product. 0 for net-snmp Linux is OK.
          valuemap:
            name: ExtremeControl identity
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                    var CONTROL_PRODUCTS = {
                      '1.3.6.1.4.1.1916.2.251': 'NAC-A-20',
                      '1.3.6.1.4.1.1916.2.252': 'IA-V',
                      '1.3.6.1.4.1.1916.2.253': 'IA-A-20',
                      '1.3.6.1.4.1.1916.2.254': 'IA-A-300',
                      '1.3.6.1.4.1.1916.2.279': 'IA-A-25',
                      '1.3.6.1.4.1.1916.2.280': 'IA-A-305',
                      '1.3.6.1.4.1.1916.2.418': 'IA-Generic'
                    };

                    function normalizeOid(oid) {
                      return String(oid || '').replace(/^\.+/, '');
                    }

                    function classifyControlProduct(oid) {
                      return CONTROL_PRODUCTS[normalizeOid(oid)] || '';
                    }

                    function controlProductIdentity(oid) {
                      return classifyControlProduct(oid) ? 1 : 0;
                    }

                    return controlProductIdentity(value);

          master_item:
            key: 'system.objectid[sysObjectID.0]'
          tags:
            - tag: component
              value: system
        - uuid: d5fb1880ca185e6dbb6d2292a3cbc1aa
          name: Uptime (network)
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 1m
          trends: '0'
          units: uptime
          description: SNMPv2-MIB sysUpTime.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 703f134580ef54c28b4de5688295974b
              expression: last(/ExtremeControl by SNMP/system.net.uptime[sysUpTime.0])<10m
              name: 'ExtremeControl SNMP: Host has been restarted'
              event_name: 'ExtremeControl SNMP: Host has been restarted'
              priority: WARNING
              description: sysUpTime under 10 minutes. Next day, not a page.
              dependencies:
                - name: 'ExtremeControl SNMP: No SNMP data collection'
                  expression: max(/ExtremeControl by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: notice
