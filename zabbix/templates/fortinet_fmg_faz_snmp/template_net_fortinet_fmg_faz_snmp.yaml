zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: bc3b3b54fd984bf588f6bb8e2bcafd0e
      template: Fortinet FMG-FAZ by SNMP
      name: Fortinet FMG-FAZ by SNMP
      description: |
        SNMP template for FortiManager and FortiAnalyzer (shared FORTINET-FORTIMANAGER-FORTIANALYZER-MIB,
        enterprises.12356.103, build 3737). There is no official Zabbix template (ZBXNEXT-10433).
        
        Do not also link Network Generic or ICMP Ping (icmpping collision). Do not assign
        FortiGate HTTP/SNMP. Platform Template Rules FortiManager / FortiAnalyzer point at
        the Observability companions, which nest this parent.
        
        Health (Overview / Hardware / Cluster) and Network interfaces ship here — same chrome
        as EXOS/VOSS/IQ. Device and log product boards live on the companions.
        
        Operator page: zabbix/03-fortinet.md. OIDs: templates/fortinet_fmg_faz_snmp/OID_MAPPING.md.
      groups:
        - name: Templates/Network devices
      items:
      - uuid: 6c81b20aa4924e6684851e88cc10a66f
        name: ICMP ping
        type: SIMPLE
        key: icmpping
        description: Host accessibility by ICMP ping. Do not also link Network Generic or ICMP Ping.
        valuemap:
          name: Service state
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 1f11f5503a944378b21fdd54d646bf3d
            expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
            priority: HIGH
            description: Last three ICMP attempts failed. Per chassis, not a cluster VIP.
            tags:
              - tag: scope
                value: availability
      - uuid: d32c2dc9030241f694f48b538b4a60e7
        name: ICMP loss
        type: SIMPLE
        key: icmppingloss
        value_type: FLOAT
        units: '%'
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 5bef148a4c9e432799483f870f1f60d2
            expression: 'min(/Fortinet FMG-FAZ by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Fortinet FMG-FAZ by SNMP/icmppingloss,5m)<100'
            name: 'Fortinet FMG-FAZ by SNMP: High ICMP ping loss'
            status: DISABLED
            priority: WARNING
            description: CH proxy loss is WAN. Collect; do not page.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            tags:
              - tag: scope
                value: availability
      - uuid: c3fa6e54a90f4e08880c8f2858fb5e63
        name: ICMP response time
        type: SIMPLE
        key: icmppingsec
        value_type: FLOAT
        units: s
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 49f6df84e7c04749af51e00c20d1708d
            expression: 'avg(/Fortinet FMG-FAZ by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
            name: 'Fortinet FMG-FAZ by SNMP: High ICMP ping response time'
            status: DISABLED
            priority: WARNING
            description: CH proxy RTT is WAN. Collect; do not page.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            tags:
              - tag: scope
                value: performance
      - uuid: f0f7afc2d004405cb1a8264c44330144
        name: SNMP agent availability
        type: INTERNAL
        key: 'zabbix[host,snmp,available]'
        description: 0 not available, 1 available, 2 unknown. Mgmt blind; the product may still run.
        valuemap:
          name: zabbix.host.available
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 4fc46a5b2f2444d998ade7c571508503
            expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
            priority: WARNING
            description: Mgmt blind; FMG/FAZ may still manage devices or ingest logs. Next day, same as EXOS/VOSS/IQ.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            tags:
              - tag: scope
                value: availability
      - uuid: 27690d94b3ac49fb8680b95b272994ae
        name: Unsupported item count
        type: INTERNAL
        key: 'zabbix[host,,items_unsupported]'
        delay: 15m
        description: Watch the watcher — a required FMG-FAZ MIB object must not quietly become green. Optional scalar items map not-supported to zero; optional tables use native empty LLD.
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 2e3a691ea350482cbbcce1c029fd6261
            expression: 'min(/Fortinet FMG-FAZ by SNMP/zabbix[host,,items_unsupported],30m)>{$UNSUPPORTED.MAX}'
            name: 'Fortinet FMG-FAZ by SNMP: Too many unsupported items'
            priority: AVERAGE
            description: SNMP=1 but items unsupported — firmware/OID mismatch, not a cable.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            tags:
              - tag: scope
                value: availability
      - uuid: 371c94e005b94912b07c103fd485239e
        name: ICMP
        type: CALCULATED
        key: fm.observability.icmp
        delay: 1m
        value_type: FLOAT
        params: last(//icmpping)
        description: Headline ICMP for the Overview gauge and nodata watcher.
        valuemap:
          name: Service state
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 811f13fdf4ba494fa78d8825ede2a0e3
            expression: nodata(/Fortinet FMG-FAZ by SNMP/fm.observability.icmp,10m)=1
            name: 'Fortinet FMG-FAZ by SNMP: no ICMP data for 10m'
            priority: AVERAGE
            description: Watcher — proxy/host unknown, not ICMP down. Dead box is ICMP High.
            tags:
              - tag: scope
                value: availability
      - uuid: f598e8342ebe4c1a90b438b57e865aff
        name: SNMP
        type: CALCULATED
        key: fm.observability.snmp
        delay: 1m
        value_type: FLOAT
        params: 'last(//zabbix[host,snmp,available])'
        description: Headline SNMP for the Overview gauge.
        valuemap:
          name: zabbix.host.available
        tags:
          - tag: component
            value: health
      - uuid: 053f22a3720d42f093ea2d3b59b2da85
        name: Interface discovery seed (not a port)
        type: CALCULATED
        key: 'net.if.status[ifOperStatus.__seed]'
        delay: 1m
        value_type: FLOAT
        history: 1d
        trends: '0'
        params: '0'
        description: Always-present net.if.status key so count(exists_foreach) never becomes unsupported. Subtracted in net.if.discovery.count. Do not graph.
        tags:
          - tag: component
            value: health
      - uuid: be76d3ca16df4d37835dd8c9aaf463ad
        name: Discovered interface count
        type: CALCULATED
        key: net.if.discovery.count
        delay: 1m
        value_type: FLOAT
        history: 7d
        params: 'count(exists_foreach(//net.if.status[*]))-1'
        description: Enabled IF-MIB oper-status items minus the seed. Zero with SNMP up is the IFNAME/IFTYPE LLD break.
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 7a794ebb3ae241ef96ac567ec5f44a14
            expression: 'min(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],1h)=1 and last(/Fortinet FMG-FAZ by SNMP/net.if.discovery.count)<{$NET.IF.DISCOVERY.MIN}'
            name: 'Fortinet FMG-FAZ by SNMP: No discovered interfaces after SNMP is up'
            priority: AVERAGE
            description: SNMP has been up for 1h and LLD produced no enabled net.if.status items. Count stays 0 (supported) while empty.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
            tags:
              - tag: scope
                value: availability
      - uuid: fa4b3596055c41408dfed119de2bc8f0
        name: Managed device discovery seed (not a device)
        type: CALCULATED
        key: 'fm.device.connect[__seed]'
        delay: 1m
        value_type: FLOAT
        history: 1d
        trends: '0'
        params: '0'
        description: Always-present fm.device.connect key so count(exists_foreach) never becomes unsupported. Subtracted in fm.device.discovery.count.
        tags:
          - tag: component
            value: health
      - uuid: b7d096dc27044f2f8094b926a3f08803
        name: Discovered managed-device count
        type: CALCULATED
        key: fm.device.discovery.count
        delay: 1m
        value_type: FLOAT
        history: 7d
        params: 'count(exists_foreach(//fm.device.connect[*]))-1'
        description: 'Enabled managed-device connect items minus the seed. Census uses fm.device.number against {$FM.DEVICE.EXPECTED}.'
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 9791a05a5d0942c6843f48e6ee6792ed
            expression: '{$FM.DEVICE.EXPECTED}>0 and min(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],1h)=1 and last(/Fortinet FMG-FAZ by SNMP/fm.device.number)<>{$FM.DEVICE.EXPECTED}'
            name: 'Fortinet FMG-FAZ by SNMP: Managed device count unexpected'
            priority: AVERAGE
            description: 'SNMP up 1h and fmDeviceNumber differs from {$FM.DEVICE.EXPECTED}. Default 0 disables this. Set the known count after a quiet census.'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
              - tag: scope
                value: availability
      - uuid: 3cde4c6110554c4abd437cd77fc1fc20
        name: System name
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.1.5.0
        key: system.name
        delay: 1h
        value_type: CHAR
        history: 7d
        trends: '0'
        inventory_link: NAME
        preprocessing:
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 6h
        tags:
          - tag: component
            value: system
        triggers:
          - uuid: e2b3c48c57294ec8bc49f79ad906620d
            expression: 'last(/Fortinet FMG-FAZ by SNMP/system.name,#1)<>last(/Fortinet FMG-FAZ by SNMP/system.name,#2) and length(last(/Fortinet FMG-FAZ by SNMP/system.name))>0'
            name: 'Fortinet FMG-FAZ by SNMP: System name has changed'
            priority: INFO
            description: Possible replacement or rename. Acknowledge to close.
            manual_close: 'YES'
            tags:
              - tag: scope
                value: notice
      - uuid: 3a84e1df78e74c6fb7f2e3f2df45720d
        name: System description
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.1.1.0
        key: system.descr
        delay: 1h
        value_type: CHAR
        history: 7d
        trends: '0'
        preprocessing:
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 6h
        tags:
          - tag: component
            value: system
      - uuid: 0e881224ef2c4fa19717a916ab872b5d
        name: Firmware version
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.7.0
        key: fm.sys.version
        delay: 1h
        value_type: CHAR
        history: 7d
        trends: '0'
        description: 'MIB: fmSysVersion.'
        inventory_link: OS
        preprocessing:
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 6h
        tags:
          - tag: component
            value: system
        triggers:
          - uuid: 3df730a09101417fbb5c4bde869a414d
            expression: 'last(/Fortinet FMG-FAZ by SNMP/fm.sys.version,#1)<>last(/Fortinet FMG-FAZ by SNMP/fm.sys.version,#2) and length(last(/Fortinet FMG-FAZ by SNMP/fm.sys.version))>0'
            name: 'Fortinet FMG-FAZ by SNMP: Firmware version has changed'
            priority: INFO
            description: Firmware updated or box replaced. Acknowledge to close.
            manual_close: 'YES'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: System name has changed'
                expression: 'last(/Fortinet FMG-FAZ by SNMP/system.name,#1)<>last(/Fortinet FMG-FAZ by SNMP/system.name,#2) and length(last(/Fortinet FMG-FAZ by SNMP/system.name))>0'
            tags:
              - tag: scope
                value: notice
      - uuid: d08127306ed6463b9f8ef32b9a04b5ee
        name: Serial number
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.100.1.1.1.0
        key: system.hw.serialnumber
        delay: 1h
        value_type: CHAR
        history: 7d
        trends: '0'
        description: 'MIB: FORTINET-CORE-MIB fnSysSerial.'
        inventory_link: SERIALNO_A
        preprocessing:
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 6h
        tags:
          - tag: component
            value: system
        triggers:
          - uuid: cd209470eea345caa4c8603c479f7033
            expression: 'last(/Fortinet FMG-FAZ by SNMP/system.hw.serialnumber,#1)<>last(/Fortinet FMG-FAZ by SNMP/system.hw.serialnumber,#2) and length(last(/Fortinet FMG-FAZ by SNMP/system.hw.serialnumber))>0'
            name: 'Fortinet FMG-FAZ by SNMP: Device has been replaced'
            priority: INFO
            description: Serial changed. Acknowledge to close.
            manual_close: 'YES'
            tags:
              - tag: scope
                value: notice
          - uuid: 7482951251914ecaac560ce6fe376723
            expression: 'nodata(/Fortinet FMG-FAZ by SNMP/system.hw.serialnumber,2h)=1 and last(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available])=1'
            name: 'Fortinet FMG-FAZ by SNMP: Serial number is missing while SNMP is up'
            priority: WARNING
            description: SNMP answers but fnSysSerial is silent.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
              - tag: scope
                value: notice
      - uuid: cedb886c8c28469a8f3c3f7f669fc94a
        name: Uptime (network)
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.1.3.0]
        key: 'system.net.uptime[sysUpTime.0]'
        delay: 1m
        trends: '0'
        units: uptime
        description: SNMPv2-MIB sysUpTime. Overview 4th tile (same as EXOS/VOSS/IQ).
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '0.01'
        tags:
          - tag: component
            value: system
      - uuid: baa10d157e17408b8e9cd42c3e7bb50f
        name: Uptime (FMG/FAZ 64-bit)
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.8.0
        key: fm.sys.uptime
        delay: 1m
        trends: '0'
        units: uptime
        description: 'MIB: fmSysUpTime. Counter64 hundredths. Reboot uses this (no wrap like sysUpTime).'
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '0.01'
        tags:
          - tag: component
            value: system
        triggers:
          - uuid: 024d4ba83fc2474d95cacfb06b9ebcfc
            expression: last(/Fortinet FMG-FAZ by SNMP/fm.sys.uptime)<10m
            name: 'Fortinet FMG-FAZ by SNMP: Host has been restarted'
            priority: WARNING
            description: fmSysUpTime under 10 minutes. Next day, same as EXOS unplanned reboot. Do not page.
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
              - tag: scope
                value: notice
      - uuid: 47ff8deb3cb048b8be203c80dcbc5c13
        name: CPU utilization
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.1.0
        key: fm.sys.cpu.util
        delay: 1m
        value_type: FLOAT
        units: '%'
        description: 'MIB: fmSysCpuUsage (0..100).'
        tags:
          - tag: component
            value: cpu
        triggers:
          - uuid: 407c9b35bea7493d94196d9fd593c21e
            expression: 'min(/Fortinet FMG-FAZ by SNMP/fm.sys.cpu.util,5m)>{$CPU.UTIL.WARN}'
            name: 'Fortinet FMG-FAZ by SNMP: High CPU utilization'
            priority: WARNING
            description: 'Ops threshold {$CPU.UTIL.WARN}. Not a page.'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
              - tag: scope
                value: performance
          - uuid: 09b53e67caf541cab9d1fbd92f07d9be
            expression: 'min(/Fortinet FMG-FAZ by SNMP/fm.sys.cpu.util,5m)>{$CPU.UTIL.CRIT}'
            name: 'Fortinet FMG-FAZ by SNMP: Critical CPU utilization'
            status: DISABLED
            priority: AVERAGE
            description: '{$CPU.UTIL.CRIT}=101 silences this. Enable only after a quiet pilot.'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: High CPU utilization'
                expression: 'min(/Fortinet FMG-FAZ by SNMP/fm.sys.cpu.util,5m)>{$CPU.UTIL.WARN}'
            tags:
              - tag: scope
                value: performance
      - uuid: a231356d11dc44db945eeba6071526da
        name: CPU utilization (exclude nice)
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.6.0
        key: fm.sys.cpu.util.excl.nice
        delay: 1m
        value_type: FLOAT
        units: '%'
        description: 'MIB: fmSysCpuUsageExcludedNice. Optional; not-supported maps to 0.'
        preprocessing:
          - type: CHECK_NOT_SUPPORTED
            parameters:
              - '-1'
            error_handler: CUSTOM_VALUE
            error_handler_params: '0'
        tags:
          - tag: component
            value: cpu
      - uuid: a49aa7d643f94ad7ae1f9daae804304c
        name: Memory used
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.2.0
        key: fm.sys.mem.used
        delay: 1m
        units: B
        description: 'MIB: fmSysMemUsed (KB).'
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '1024'
        tags:
          - tag: component
            value: memory
      - uuid: 0dfddc9dbf5542249be07173b2b7fd5d
        name: Memory capacity
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.3.0
        key: fm.sys.mem.capacity
        delay: 1m
        units: B
        description: 'MIB: fmSysMemCapacity (KB), physical+swap.'
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '1024'
        tags:
          - tag: component
            value: memory
      - uuid: 2a21a1ee2c22451aab2868209241aa2b
        name: Memory utilization
        type: CALCULATED
        key: fm.sys.mem.util
        delay: 1m
        value_type: FLOAT
        units: '%'
        params: '(last(//fm.sys.mem.capacity)>0)*((last(//fm.sys.mem.used)/last(//fm.sys.mem.capacity))*100)'
        description: fmSysMemUsed / fmSysMemCapacity. Capacity 0 stays 0, not unsupported.
        tags:
          - tag: component
            value: memory
        triggers:
          - uuid: 82af19de154d49098f3baf922df0f131
            expression: 'min(/Fortinet FMG-FAZ by SNMP/fm.sys.mem.util,5m)>{$MEMORY.UTIL.MAX}'
            name: 'Fortinet FMG-FAZ by SNMP: High memory utilization'
            priority: AVERAGE
            description: 'Memory above {$MEMORY.UTIL.MAX} for 5m.'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
              - tag: scope
                value: performance
      - uuid: bd6a2dcf8d794b17985d49b1bbb08a06
        name: Disk used
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.4.0
        key: fm.sys.disk.used
        delay: 1m
        units: B
        description: 'MIB: fmSysDiskUsage (MB). FAZ log disk is the product.'
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '1048576'
        tags:
          - tag: component
            value: storage
      - uuid: d2cdfa6a4d904ca198b38a846a78de5e
        name: Disk capacity
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.12356.103.2.1.5.0
        key: fm.sys.disk.capacity
        delay: 1m
        units: B
        description: 'MIB: fmSysDiskCapacity (MB).'
        preprocessing:
          - type: MULTIPLIER
            parameters:
              - '1048576'
        tags:
          - tag: component
            value: storage
      - uuid: f4d7e2d9d43e46e195685437766c312e
        name: Disk utilization
        type: CALCULATED
        key: fm.sys.disk.util
        delay: 1m
        value_type: FLOAT
        units: '%'
        params: '(last(//fm.sys.disk.capacity)>0)*((last(//fm.sys.disk.used)/last(//fm.sys.disk.capacity))*100)'
        description: fmSysDiskUsage / fmSysDiskCapacity. FAZ High is on FortiAnalyzer Observability.
        tags:
          - tag: component
            value: storage
        triggers:
          - uuid: fc4ab220db584e65b30e5aa2ea27fe2f
            expression: 'min(/Fortinet FMG-FAZ by SNMP/fm.sys.disk.util,15m)>{$DISK.UTIL.WARN} and min(/Fortinet FMG-FAZ by SNMP/fm.sys.disk.util,15m)<={$DISK.UTIL.CRIT}'
            name: 'Fortinet FMG-FAZ by SNMP: High disk utilization'
            priority: WARNING
            description: 'Disk above {$DISK.UTIL.WARN}. Next day on FMG; FAZ still has Average/High above this.'
            dependencies:
              - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
              - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            tags:
