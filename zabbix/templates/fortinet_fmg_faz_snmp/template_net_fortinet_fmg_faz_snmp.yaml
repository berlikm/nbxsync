                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 84e358c4fa1e4f01b76fc81fb58f7a20
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: '0'
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          graph_prototypes:
            - uuid: cdc5b30581ff461395b303b5142999b1
              name: 'Interface {#IFNAME}: Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: Fortinet FMG-FAZ by SNMP
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: Fortinet FMG-FAZ by SNMP
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
        - uuid: 8f6c7049e67d4ae9a5874ab826402ccd
