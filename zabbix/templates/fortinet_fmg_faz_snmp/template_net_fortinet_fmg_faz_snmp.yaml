      discovery_rules:
        - uuid: fd64ad2cc80e42ac9733f6d39c67161c
          name: Network interface discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
          key: net.if.discovery
          delay: 1h
          lifetime: 7d
          lifetime_type: DELETE_AFTER
          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Admin-up ethernet only. Unused ports must be admin-down. Mute with {$IFCONTROL:"{#IFNAME}"}=0.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	var data = JSON.parse(value);
                  } catch (error) {
                  	throw 'Failed to parse JSON of FMG/FAZ discovery.';
                  }
                  var fields = ['{#IFNAME}','{#IFTYPE}','{#IFADMINSTATUS}','{#IFOPERSTATUS}','{#IFALIAS}'];
                  data.forEach(function (element) {
                  	fields.forEach(function (field) {
                  		element[field] = element[field] || '';
                  	});
                  });
                  return JSON.stringify(data);
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
                formulaid: C
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: D
          item_prototypes:
            - uuid: 2446bcb489cc471388e9dbdba3a3db12
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: '0'
              valuemap:
                name: 'IF-MIB::ifStatus'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: c70068ca62074fc3896c4a24cca35099
                  expression: '{$IFCONTROL}=1 and min(/Fortinet FMG-FAZ by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#3)<>1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Fortinet FMG-FAZ by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1 or {$IFCONTROL}=0'
                  name: 'Fortinet FMG-FAZ by SNMP: Interface {#IFNAME}: Link down'
                  priority: AVERAGE
                  description: 'Admin-up ethernet not up for 3×1m, including never-up and lowerLayerDown. Unused ports must be admin-down. Mute with {$IFCONTROL:"{#IFNAME}"}=0.'
                  dependencies:
                    - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
                    - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 4da4693ea83e4d799392dc0e6d7bbb4a
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: 365d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 29abe56fe9d549d682ddca3cbbbbbe67
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: 365d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: bf6ac00c78ad4e45872a9c6bffecede0
              name: 'Interface {#IFNAME}: Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: f478f33c19c34849a60881989bf8e550
                  expression: '{$IFCONTROL}=1 and (min(/Fortinet FMG-FAZ by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN} or min(/Fortinet FMG-FAZ by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN})'
                  name: 'Fortinet FMG-FAZ by SNMP: Interface {#IFNAME}: High error rate'
                  priority: WARNING
                  description: 'In or out error rate above {$IF.ERRORS.WARN}. Next day.'
                  dependencies:
                    - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
                    - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: b856495ca9ae42008f31a098c944eb2b
              name: 'Interface {#IFNAME}: Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
