          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'MIB: fmSensorTable. Empty on VMs (maps to []). State is the alert; value is DisplayString inventory.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	var data = JSON.parse(value);
