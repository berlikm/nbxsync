      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '10'
          description: Disabled trigger threshold. CH proxy loss is WAN.
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: Disabled trigger threshold. CH proxy RTT is WAN.
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: Time interval for the SNMP availability trigger.
        - macro: '{$CPU.UTIL.WARN}'
          value: '85'
          description: CPU Warning. Not a page.
        - macro: '{$CPU.UTIL.CRIT}'
          value: '101'
          description: 101 silences CPU High (same bar as FortiGate HTTP).
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Memory Average % (5m).'
        - macro: '{$DISK.UTIL.WARN}'
          value: '80'
          description: 'Disk Warning %.'
        - macro: '{$DISK.UTIL.CRIT}'
          value: '90'
          description: 'Disk Average %. FAZ High lives on FortiAnalyzer Observability.'
        - macro: '{$IF.UTIL.MAX}'
          value: '101'
          description: 101 silences interface util until a commit baseline exists.
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: Warning threshold of in-or-out error rate (errors/s).
        - macro: '{$IFCONTROL}'
          value: '1'
          description: '1=alert discovered link-down. Context {#IFNAME} to mute.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '.*'
          description: Physical mgmt/HA ports. Override per device if needed.
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '^(vlan|ssl|hamgmt|npu|disk)'
          description: Drop logical overlay ifaces.
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: ^6$
          description: ethernetCsmacd only.
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: ^1$
          description: Admin-up only.
        - macro: '{$NET.IF.DISCOVERY.MIN}'
          value: '1'
          description: Average when SNMP is up 1h and enabled IF items stay below this.
        - macro: '{$UNSUPPORTED.MAX}'
          value: '5'
          description: Average when unsupported items stay above this for 30m.
        - macro: '{$FM.DEVICE.CONTROL}'
          value: '1'
          description: 1=ticket managed-device connect down. Mute with 0.
        - macro: '{$FM.DEVICE.EXPECTED}'
          value: '0'
          description: 0 disables census. Set to the known managed-device count.
        - macro: '{$FM.DEVICE.NAME.MATCHES}'
          value: '.*'
          description: Device LLD include.
        - macro: '{$FM.DEVICE.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: Device LLD exclude.
        - macro: '{$FM.DEVICE.MODE.MATCHES}'
          value: '^[1-3]$'
          description: Drop unregistered(0). fmg(1) faz(2) fmg-faz(3).
        - macro: '{$FM.CONFIG.CONTROL}'
          value: '0'
          description: 0=cfgit owns config drift. Do not enable here.
        - macro: '{$FM.HA.CONTROL}'
          value: '0'
          description: 1=ticket HA peer down. Standalone default 0.
        - macro: '{$FM.HA.EXPECTED}'
          value: '0'
          description: 0 disables peer-count census. Pair = 1 peer.
        - macro: '{$FM.ADOM.NAME.MATCHES}'
          value: '.*'
          description: ADOM LLD include.
        - macro: '{$FM.ADOM.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: ADOM LLD exclude.
        - macro: '{$FM.ADOM.ARCHIVE.WARN}'
          value: '80'
          description: 'ADOM archive used-% Warning (FAZ).'
        - macro: '{$FM.ADOM.ARCHIVE.CRIT}'
          value: '90'
