                  var fields = ['{#FM.DEVICE.NAME}','{#FM.DEVICE.SN}','{#FM.DEVICE.MODE}','{#FM.DEVICE.ADOM}','{#FM.DEVICE.CONNECT}','{#FM.DEVICE.CONFIG}'];
                  data.forEach(function (element) {
                  	fields.forEach(function (field) {
                  		element[field] = element[field] || '';
                  	});
                  });
                  return JSON.stringify(data);
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FM.DEVICE.NAME}'
                value: "{$FM.DEVICE.NAME.MATCHES}"
                formulaid: A
              - macro: '{#FM.DEVICE.NAME}'
                value: "{$FM.DEVICE.NAME.NOT_MATCHES}"
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#FM.DEVICE.MODE}'
                value: "{$FM.DEVICE.MODE.MATCHES}"
                formulaid: C
          item_prototypes:
            - uuid: 5a711be2de794d11b294527fe19a3fce
              name: 'Device {#FM.DEVICE.NAME}: Connect state'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.6.2.1.12.{#SNMPINDEX}'
              key: 'fm.device.connect[{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: '0'
              valuemap:
                name: Fortinet fmDeviceEntConnectState
              tags:
                - tag: component
                  value: inventory
                - tag: device
                  value: '{#FM.DEVICE.NAME}'
                - tag: adom
                  value: '{#FM.DEVICE.ADOM}'
              trigger_prototypes:
                - uuid: 8cf616a98fe4492384db5be4bfcb2fe8
                  expression: '{$FM.DEVICE.CONTROL}=1 and min(/Fortinet FMG-FAZ by SNMP/fm.device.connect[{#SNMPINDEX}],#3)=2'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Fortinet FMG-FAZ by SNMP/fm.device.connect[{#SNMPINDEX}])=1 or {$FM.DEVICE.CONTROL}=0'
                  name: 'Fortinet FMG-FAZ by SNMP: Managed device {#FM.DEVICE.NAME} is offline'
                  priority: AVERAGE
                  description: Connect down(2) for 3×1m. FMG = FGFM tunnel; FAZ = log device stopped sending. Zabbix owns this ticket — mute FAZ-native device-down duplicates. unknown(0) is not this trigger.
                  dependencies:
                    - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
                    - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 49bad424f8ca4d5ab0ab9d034bdd1670
              name: 'Device {#FM.DEVICE.NAME}: Config state'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.6.2.1.14.{#SNMPINDEX}'
              key: 'fm.device.config[{#SNMPINDEX}]'
              delay: 15m
              history: 7d
              trends: '0'
              valuemap:
                name: Fortinet fmDeviceEntConfigState
              tags:
                - tag: component
                  value: inventory
                - tag: device
                  value: '{#FM.DEVICE.NAME}'
                - tag: adom
                  value: '{#FM.DEVICE.ADOM}'
              trigger_prototypes:
                - uuid: 9fc9f952f92641bb80b81938c5a3e202
                  expression: '{$FM.CONFIG.CONTROL}=1 and min(/Fortinet FMG-FAZ by SNMP/fm.device.config[{#SNMPINDEX}],15m)=2'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Fortinet FMG-FAZ by SNMP/fm.device.config[{#SNMPINDEX}])=1 or {$FM.CONFIG.CONTROL}=0'
                  name: 'Fortinet FMG-FAZ by SNMP: Managed device {#FM.DEVICE.NAME} config is out of sync'
                  status: DISABLED
                  priority: AVERAGE
                  description: 'cfgit owns config drift. Default {$FM.CONFIG.CONTROL}=0. Do not enable both.'
                  dependencies:
                    - name: 'Fortinet FMG-FAZ by SNMP: Unavailable by ICMP ping'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/icmpping,#3)=0'
                    - name: 'Fortinet FMG-FAZ by SNMP: No SNMP data collection'
                      expression: 'max(/Fortinet FMG-FAZ by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 8d0304b7533b4191a8e304627bacbbf4
              name: 'Device {#FM.DEVICE.NAME}: Log rate (hour)'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.6.2.1.25.{#SNMPINDEX}'
              key: 'fm.device.log.rate.hour[{#SNMPINDEX}]'
              delay: 15m
              value_type: FLOAT
              units: logs/s
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: component
                  value: log
                - tag: device
                  value: '{#FM.DEVICE.NAME}'
                - tag: adom
                  value: '{#FM.DEVICE.ADOM}'
        - uuid: 1b1e88cd817c4107b3b2a7eac4654c39
          name: Log-forward target discovery
          type: SNMP_AGENT
          snmp_oid: discovery[{#FM.LOGFWD.NAME},1.3.6.1.4.1.12356.103.2.1.19.1.2,{#FM.LOGFWD.RATE},1.3.6.1.4.1.12356.103.2.1.19.1.3]
          key: fm.logfwd.discovery
          delay: 15m
          lifetime: 7d
          lifetime_type: DELETE_AFTER
          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'MIB: fmSysLogForwardTable. Empty when no log-forward is configured.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	var data = JSON.parse(value);
                  } catch (error) {
                  	throw 'Failed to parse JSON of FMG/FAZ discovery.';
                  }
                  var fields = ['{#FM.LOGFWD.NAME}','{#FM.LOGFWD.RATE}'];
                  data.forEach(function (element) {
                  	fields.forEach(function (field) {
                  		element[field] = element[field] || '';
                  	});
                  });
                  return JSON.stringify(data);
          item_prototypes:
            - uuid: 722e4658cb494d18b90d0de64cd09a30
              name: 'Log forward {#FM.LOGFWD.NAME}: Rate'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.2.1.19.1.3.{#SNMPINDEX}'
              key: 'fm.logfwd.rate[{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: logs/s
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: component
                  value: log
                - tag: target
                  value: '{#FM.LOGFWD.NAME}'
