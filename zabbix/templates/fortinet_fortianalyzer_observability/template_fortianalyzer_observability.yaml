zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: a7e7ff1e27cd48ff919a62cf0256af6c
      template: FortiAnalyzer Observability
      name: FortiAnalyzer Observability
      description: |
        FortiAnalyzer companion for Fortinet FMG-FAZ by SNMP. Nests the shared SNMP parent (do not also
        link Network Generic, ICMP Ping, or FortiGate templates).
        
        Platform Template Rule FortiAnalyzer points here. Logs board is the product
        page. Log disk High is justified here (log loss) — unlike FortiGate.
        Device connect-down on the parent is the Zabbix choice for "device stopped
        sending logs". FAZ product alerts gate on inherited parent ICMP/SNMP health
        because Zabbix rejects child-template dependencies on parent triggers.
        
        Operator page: zabbix/03-fortinet.md.
      groups:
        - name: Templates/Network devices
      templates:
        - name: Fortinet FMG-FAZ by SNMP
      items:
      - uuid: ec580ac082124eaf9e4c3ce5777735e4
        name: Log rate
        type: CALCULATED
        key: faz.observability.log.rate
        delay: 1m
        value_type: FLOAT
        units: logs/s
        params: last(//fm.sys.log.rate.hr)
        description: Headline log receive rate.
        tags:
          - tag: component
            value: log
      - uuid: e6cb975878bb48de84d92a31edf213df
        name: Log lag
        type: CALCULATED
        key: faz.observability.log.lag
        delay: 1m
        value_type: FLOAT
        units: s
        params: last(//fm.sys.log.lag)
        description: Receive-to-index delay. This is the FAZ product failure mode.
        tags:
          - tag: component
            value: log
        triggers:
          - uuid: 44bcc8c4bdb548c8aaf28da490dba868
            expression: '(min(/FortiAnalyzer Observability/faz.observability.log.lag,10m)>{$FAZ.LOG.LAG.WARN} and min(/FortiAnalyzer Observability/faz.observability.log.lag,10m)<={$FAZ.LOG.LAG.CRIT}) and max(/FortiAnalyzer Observability/icmpping,#3)=1 and max(/FortiAnalyzer Observability/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=1'
            name: 'FortiAnalyzer Observability: Log indexing lag is high'
            priority: WARNING
            description: Indexing is falling behind receive. Reports/search will lag. Next day unless it climbs to Average.
            tags:
              - tag: scope
                value: capacity
          - uuid: 5b26d0fa60b942198ae8a6363d16bf0a
            expression: '(min(/FortiAnalyzer Observability/faz.observability.log.lag,5m)>{$FAZ.LOG.LAG.CRIT}) and max(/FortiAnalyzer Observability/icmpping,#3)=1 and max(/FortiAnalyzer Observability/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=1'
            name: 'FortiAnalyzer Observability: Log indexing lag is critical'
            priority: AVERAGE
            description: 'Log lag above {$FAZ.LOG.LAG.CRIT} seconds. Ticket — FAZ is not keeping up. Disk/CPU/ingest path.'
            tags:
              - tag: scope
                value: capacity
      - uuid: b22ce1db288747c4a518c7cbcdfe8f06
        name: Disk utilization
        type: CALCULATED
        key: faz.observability.disk.util
        delay: 1m
        value_type: FLOAT
        units: '%'
        params: last(//fm.sys.disk.util)
        description: FAZ log disk. High is justified — this is the product.
        tags:
          - tag: component
            value: storage
        triggers:
          - uuid: 5684fe84696a466ca019b0243315edb8
            expression: '(min(/FortiAnalyzer Observability/faz.observability.disk.util,5m)>{$DISK.UTIL.HIGH}) and max(/FortiAnalyzer Observability/icmpping,#3)=1 and max(/FortiAnalyzer Observability/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=1'
            name: 'FortiAnalyzer Observability: Log disk is critically full'
            priority: HIGH
            description: 'Log disk above {$DISK.UTIL.HIGH}. 03:00 page — FAZ will stop ingesting. Exception to site-only High: the product is about to drop data.'
            tags:
              - tag: scope
                value: capacity
      - uuid: d6965be93ae24cebb0405cc081807c4d
        name: License GB/day today
        type: CALCULATED
        key: faz.observability.lic.gbday
        delay: 1m
        value_type: FLOAT
        units: GB
        params: last(//fm.sys.lic.gbday.today)
        description: 'GiB received today. Trigger off while {$FAZ.LIC.GBDAY.MAX}=0.'
        tags:
          - tag: component
            value: license
        triggers:
          - uuid: a6e574b3463f43d0a1d62b95dd484870
            expression: '({$FAZ.LIC.GBDAY.MAX}>0 and min(/FortiAnalyzer Observability/faz.observability.lic.gbday,30m)>{$FAZ.LIC.GBDAY.MAX}) and max(/FortiAnalyzer Observability/icmpping,#3)=1 and max(/FortiAnalyzer Observability/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=1'
            name: 'FortiAnalyzer Observability: Licensed GB/day threshold exceeded'
            priority: AVERAGE
            description: 'Today''s ingest above {$FAZ.LIC.GBDAY.MAX}. Default 0 disables this until the licensed cap is known.'
            tags:
              - tag: scope
                value: capacity
      - uuid: dc2cc96e3d724a4ea0c33c752c3ac527
        name: Managed log devices
        type: CALCULATED
        key: faz.observability.device.count
        delay: 1m
        value_type: FLOAT
        params: last(//fm.device.number)
        description: Registered log devices.
        tags:
          - tag: component
            value: health
      tags:
        - tag: class
          value: network
        - tag: target
          value: fortianalyzer
      macros:
        - macro: '{$FAZ.LOG.LAG.WARN}'
          value: '60'
          description: Log lag Warning (seconds).
        - macro: '{$FAZ.LOG.LAG.CRIT}'
          value: '300'
          description: Log lag Average (seconds).
        - macro: '{$FAZ.LIC.GBDAY.MAX}'
          value: '0'
          description: '0 disables GB/day license Average. Set to the licensed cap.'
        - macro: '{$DISK.UTIL.HIGH}'
          value: '95'
          description: FAZ log-disk High. 95 is log-loss territory.
        - macro: '{$IFCONTROL:"port2"}'
          value: '0'
          description: FAZ unused NIC. 0 mutes link-down. Set 1 on the host if this port is live.
        - macro: '{$IFCONTROL:"port3"}'
          value: '0'
          description: FAZ unused NIC. 0 mutes link-down. Set 1 on the host if this port is live.
        - macro: '{$IFCONTROL:"port4"}'
          value: '0'
          description: FAZ unused NIC. 0 mutes link-down. Set 1 on the host if this port is live.
