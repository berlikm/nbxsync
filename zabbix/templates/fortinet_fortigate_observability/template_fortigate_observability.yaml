                    - type: INTEGER
                      name: angle
                      value: '270'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'FortiGate Observability'
                        key: fgate.observability.api
                    - type: STRING
                      name: max
                      value: '1'
                    - type: STRING
