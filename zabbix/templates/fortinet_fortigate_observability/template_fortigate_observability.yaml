                  height: '4'
                  fields:
                    - type: INTEGER
                      name: angle
                      value: '270'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'FortiGate Observability'
                        key: fgate.observability.api
                    - type: STRING
                      name: max
                      value: '1'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: thresholds.0.color
                      value: FF465C
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: 0EC9AC
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '1'
                - type: gauge
                  name: CPU
                  x: '36'
                  width: '18'
                  height: '4'
                  fields:
                    - type: INTEGER
                      name: angle
                      value: '270'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'FortiGate Observability'
                        key: fgate.observability.cpu.util
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
                      name: min
                      value: '0'
                    - type: STRING
                      name: units
                      value: '%'
                - type: gauge
                  name: Memory
                  x: '54'
