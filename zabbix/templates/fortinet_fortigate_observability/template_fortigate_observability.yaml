                    - type: INTEGER
                      name: angle
                      value: '270'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'FortiGate Observability'
                        key: fgate.observability.cpu.util
                    - type: STRING
                      name: max
                      value: '100'
                    - type: STRING
