zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: e7e2c7012c56494e87f0b717ecea934a
      template: 'FortiGate Observability'
      name: 'FortiGate Observability'
      description: |
        Estate companion for stock FortiGate by HTTP (Cloud Zabbix 7.0-2) + ICMP Ping.

        Platform FortiOS Template Rule points here. Do not assign this template
        on generic role Firewall (FortiManager / FortiAnalyzer share that role).

        Stock HTTP remains the version-pinned vendor parent with bounded
        ZBX-27082 and multi-VDOM collector compatibility patches. This companion
        owns HA, configured memory-pressure alerting, and the runtime-managed
        `fgate.observability.inventory` SD-WAN/IPsec census. Do not import
        bundled 7.0-3 over the Cloud template.
      groups:
        - name: 'Templates/Network devices'
      templates:
        - name: 'FortiGate by HTTP'
        - name: 'ICMP Ping'
      items:
        - uuid: f55e414be13f400fb4b1218fa5a7b11c
          name: ICMP
          type: CALCULATED
          key: fgate.observability.icmp
          delay: 1m
          value_type: FLOAT
          params: 'last(//icmpping)'
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: bad9bf341eea4059ba50abf8c757852c
              expression: 'nodata(/FortiGate Observability/fgate.observability.icmp,10m)=1'
              name: 'FortiGate: no ICMP data for 10m'
              priority: AVERAGE
              description: 'Watcher — proxy/host unknown, not ICMP down. Dead box is stock ICMP High.'
              tags:
                - tag: scope
                  value: availability
        - uuid: f34832e2daf644f489fb18256aaa9fe3
          name: API
          type: CALCULATED
          key: fgate.observability.api
          delay: 1m
          value_type: FLOAT
          params: 'last(//fgate.api.status)'
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 1ff7c54eb81344008f340b8d9236173e
              expression: 'nodata(/FortiGate Observability/fgate.observability.api,10m)=1'
              name: 'FortiGate: no API data for 10m'
              priority: AVERAGE
              description: 'Watcher gap — API item silent. Not a WAN path ticket.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6bb8892666d44fa38916fb150e486c40
          name: CPU
          type: CALCULATED
          key: fgate.observability.cpu.util
          delay: 1m
          value_type: FLOAT
          units: '%'
          params: 'last(//fgate.cpu.util)'
          tags:
            - tag: component
              value: cpu
        - uuid: 3dbd521f004141919ea782d5db0bf0bd
          name: Memory
          type: CALCULATED
          key: fgate.observability.memory.util
          delay: 1m
          value_type: FLOAT
          units: '%'
          params: 'last(//fgate.memory.util)'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: fd0d551e32fb44beb3ca58ba8c64724e
              expression: 'min(/FortiGate Observability/fgate.observability.memory.util,3m)>={$FGATE.MEMORY.EXTREME}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiGate Observability/fgate.observability.memory.util,5m)<{$FGATE.MEMORY.GREEN}'
              name: 'FortiGate: memory pressure is above the configured extreme threshold'
              priority: DISASTER
              description: 'Sustained memory use is above FortiOS memory-use-threshold-extreme. Recovery requires the configured green threshold.'
              tags:
                - tag: scope
                  value: capacity
            - uuid: 307cb12157024b69a6892a3ac96855fa
              expression: 'min(/FortiGate Observability/fgate.observability.memory.util,5m)>={$FGATE.MEMORY.RED}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiGate Observability/fgate.observability.memory.util,5m)<{$FGATE.MEMORY.GREEN}'
              name: 'FortiGate: memory pressure is above the configured red threshold'
              priority: HIGH
              description: 'Sustained memory use is above FortiOS memory-use-threshold-red. Recovery requires the configured green threshold.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 6d668a44c47948cfae2d30e439524aa6
          name: 'Unsupported items'
          type: INTERNAL
          key: 'zabbix[host,,items_unsupported]'
          delay: 1m
          tags:
            - tag: component
              value: census
          triggers:
            - uuid: ebdf9babd27e4bfc86c12302165f5b8f
              expression: 'min(/FortiGate Observability/zabbix[host,,items_unsupported],10m)>0'
              name: 'FortiGate: unsupported items'
              priority: AVERAGE
              description: 'Watcher — HTTP/ICMP items not collecting. Not a WAN ticket.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 9ca225a082ea4338baa8f998d32beea1
          name: 'HA role'
          type: CALCULATED
          key: fgate.observability.ha.role
          delay: 1m
          value_type: FLOAT
          params: 'last(//fgate.ha.role)'
          description: '1 = primary/standalone. Script item lives on FortiGate by HTTP after apply patches.'
          tags:
            - tag: component
              value: ha
        - uuid: c3cada040fee41f6b233f7183fdd0250
          name: 'Interface discovery seed (not a port)'
          type: CALCULATED
          key: 'fgate.netif.status[__seed]'
          delay: 1m
          history: 1d
          trends: '0'
          value_type: FLOAT
          params: '0'
          description: |
            Always-present fgate.netif.status key so count(exists_foreach) stays
            supported at zero discovered WAN/HA/mgmt ports.
          tags:
            - tag: component
              value: census
        - uuid: a8113cbbcfb04db18e43cb1effedc875
          name: 'Discovered interface count'
          type: CALCULATED
          key: fgate.observability.netif.count
          delay: 1m
          value_type: FLOAT
          params: 'count(exists_foreach(//fgate.netif.status[*]))-1'
          description: 'Enabled FortiGate by HTTP netif.status items minus the seed.'
          tags:
            - tag: component
              value: census
          triggers:
            - uuid: 76f7a92f7df746aa986b15e0d77c2ff3
              expression: 'min(/FortiGate Observability/fgate.observability.api,30m)=1 and last(/FortiGate Observability/fgate.observability.netif.count)<{$NET.IF.DISCOVERY.MIN}'
              name: 'FortiGate: fewer discovered interfaces than expected'
              priority: AVERAGE
              description: 'API is up and LLD produced fewer in-scope interfaces than {$NET.IF.DISCOVERY.MIN}. The baseline is enabled+cabled NetBox names observable in FortiOS CMDB — this is an API/LLD regression, not a WAN-path ticket.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2b093bccf2954e83b72316ec93725947
          name: 'SD-WAN member discovery seed'
          type: CALCULATED
          key: 'fgate.sdwan_member.link_status[__seed]'
          delay: 1m
          history: 1d
          trends: '0'
          value_type: FLOAT
          params: '0'
          description: 'Keeps SD-WAN member count supported when a box has no members.'
          tags:
            - tag: component
              value: census
        - uuid: 64adb3464ba64b41a667112877029310
          name: 'SD-WAN member count'
          type: CALCULATED
          key: fgate.observability.sdwan.count
          delay: 1m
          value_type: FLOAT
          params: 'count(exists_foreach(//fgate.sdwan_member.link_status[*]))-1'
          description: 'Enabled SD-WAN member link_status items minus the seed. Apply sets {$FGATE.SDWAN.EXPECTED} to the exact configured member count per device.'
          tags:
            - tag: component
              value: census
          triggers:
            - uuid: 1925268d439243278aa7378cfe622b4a
              expression: 'min(/FortiGate Observability/fgate.observability.api,30m)=1 and last(/FortiGate Observability/fgate.observability.sdwan.count)<{$FGATE.SDWAN.EXPECTED}'
              name: 'FortiGate: fewer SD-WAN members than expected'
              priority: AVERAGE
              description: 'API is up and member LLD is below the configured per-device {$FGATE.SDWAN.EXPECTED}.'
              tags:
                - tag: scope
                  value: availability
        - uuid: da10f96dc1c54b22aa959808ae998679
          name: 'HA member count'
          type: SCRIPT
          key: fgate.observability.ha.member.count
          delay: 1m
          value_type: FLOAT
          params: |
            var params = JSON.parse(value);
            function getHttpData(url) {
            	var request = new HttpRequest();
            	if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {
            		request.setProxy(params.http_proxy);
            	}
            	request.addHeader('Accept: application/json');
            	request.addHeader('Authorization: Bearer ' + params.token);
            	var response = request.get(url);
            	var code = request.getStatus();
            	var body = null;
            	try {
            		body = JSON.parse(response);
            	} catch (error) {
            		if (code === 200) throw 'invalid JSON';
            	}
            	if (body && body.status === 'error' && typeof body.http_status !== 'undefined') {
            		code = body.http_status;
            	}
            	return { code: code, body: body };
            }
            var api_url = params.scheme + '://' + params.fqdn + ':' + params.port;
            var ha = getHttpData(api_url + '/api/v2/monitor/system/ha-peer');
            if (ha.code === 404 || ha.code === 424) {
            	return 1;
            }
            if (ha.code !== 200 || !ha.body) {
            	throw 'HA peer request failed: HTTP ' + ha.code;
            }
            var rows = ha.body.results || ha.body;
            if (!Array.isArray(rows)) {
            	rows = rows && typeof rows === 'object' ? [rows] : [];
            }
            return rows.length || 1;
          timeout: '{$FGATE.DATA.TIMEOUT}'
          parameters:
            - name: fqdn
              value: '{$FGATE.API.FQDN}'
            - name: http_proxy
              value: '{$FGATE.HTTP.PROXY}'
            - name: port
              value: '{$FGATE.API.PORT}'
            - name: scheme
              value: '{$FGATE.SCHEME}'
            - name: token
              value: '{$FGATE.API.TOKEN}'
          description: 'Authoritative system/ha-peer row count. Standalone 404/424 → 1; other failures are unsupported. Estate default {$FGATE.HA.EXPECTED}=2.'
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 3f185b781b924cccaa2e152e9dbf6519
              expression: 'min(/FortiGate Observability/fgate.observability.api,30m)=1 and last(/FortiGate Observability/fgate.observability.ha.member.count)<>{$FGATE.HA.EXPECTED}'
              name: 'FortiGate: HA member count unexpected'
              priority: AVERAGE
              description: 'API is up and system/ha-peer count differs from {$FGATE.HA.EXPECTED}. Estate default 2; host override 1 on standalone.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 400b4a31654c4ae5bdd392723ae74f07
          name: 'HA VDOM checksum mismatches'
          type: SCRIPT
          key: fgate.observability.ha.vdom_mismatches
          delay: 5m
          value_type: FLOAT
          params: |
            var params = JSON.parse(value);
            function getHttpData(url) {
            	var request = new HttpRequest();
            	if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {
            		request.setProxy(params.http_proxy);
            	}
            	request.addHeader('Accept: application/json');
            	request.addHeader('Authorization: Bearer ' + params.token);
            	var response = request.get(url);
            	var code = request.getStatus();
            	var body = null;
            	try {
            		body = JSON.parse(response);
            	} catch (error) {
            		if (code === 200) throw 'invalid JSON';
            	}
            	if (body && body.status === 'error' && typeof body.http_status !== 'undefined') {
            		code = body.http_status;
            	}
            	return { code: code, body: body };
            }
            var api_url = params.scheme + '://' + params.fqdn + ':' + params.port;
            var ha = getHttpData(api_url + '/api/v2/monitor/system/ha-nonsync-checksums');
            if (ha.code === 404 || ha.code === 424) {
            	return 0;
            }
            if (ha.code !== 200 || !ha.body) {
            	throw 'HA checksum request failed: HTTP ' + ha.code;
            }
            var rows = ha.body.results || ha.body;
            if (!Array.isArray(rows)) {
            	rows = rows && typeof rows === 'object' ? [rows] : [];
            }
            if (rows.length < 2) {
            	return 0;
            }
            var baseline = {};
            var mismatches = {};
            for (var i = 0; i < rows.length; i++) {
            	var vdoms = rows[i] && rows[i].checksum && rows[i].checksum.vdoms;
            	if (!vdoms || typeof vdoms !== 'object') {
            		throw 'HA checksum row has no VDOM map';
            	}
            	Object.keys(vdoms).forEach(function (vdom) {
            		var checksum = String(vdoms[vdom]);
            		if (typeof baseline[vdom] === 'undefined') {
            			baseline[vdom] = checksum;
            		} else if (baseline[vdom] !== checksum) {
            			mismatches[vdom] = 1;
            		}
            	});
            }
            return Object.keys(mismatches).length;
          timeout: '{$FGATE.DATA.TIMEOUT}'
          parameters:
            - name: fqdn
              value: '{$FGATE.API.FQDN}'
            - name: http_proxy
              value: '{$FGATE.HTTP.PROXY}'
            - name: port
              value: '{$FGATE.API.PORT}'
            - name: scheme
              value: '{$FGATE.SCHEME}'
            - name: token
              value: '{$FGATE.API.TOKEN}'
          description: 'Number of VDOM configuration checksum mismatches across HA peers. Global checksum is intentionally excluded because member-local global settings can differ.'
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 55f7a8c069864d9caa96ba9ceaf1b7f8
              expression: 'last(/FortiGate Observability/fgate.observability.ha.role)=1 and min(/FortiGate Observability/fgate.observability.api,30m)=1 and min(/FortiGate Observability/fgate.observability.ha.vdom_mismatches,15m)>0'
              name: 'FortiGate: HA VDOM configuration is out of sync'
              priority: HIGH
              description: 'At least one VDOM checksum differs across HA members for 15 minutes. Primary-only ticket prevents duplicate incidents from both cluster members.'
              tags:
                - tag: scope
                  value: availability
      macros:
        - macro: '{$FGATE.SCHEME}'
          value: https
        - macro: '{$FGATE.API.PORT}'
          value: '20443'
        - macro: '{$CPU.UTIL.CRIT}'
          value: '101'
          description: 'Quiet duplicate stock High CPU trigger; companion retains the metric for dashboards.'
        - macro: '{$MEMORY.UTIL.CRIT}'
          value: '101'
          description: 'Quiet duplicate stock High memory trigger; companion alerts on configured FortiOS thresholds.'
        - macro: '{$DISK.FREE.CRIT}'
          value: '0'
        - macro: '{$NET.IF.UTIL.MAX}'
          value: '101'
        - macro: '{$FIRMWARE.UPDATES.CONTROL}'
          value: '0'
        - macro: '{$FWP.FWNAME.MATCHES}'
          value: '^$'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$FGATE.PATH.CONTROL}'
          value: '1'
          description: '1 = WAN/SD-WAN path tickets. ha.role=0 still mutes secondary.'
        - macro: '{$SDWAN.HEALTH.IFNAME.MATCHES}'
          value: '.*'
        - macro: '{$SDWAN.MEMBER.NAME.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.DISCOVERY.MIN}'
          value: '0'
          description: 'Apply overrides this per device from enabled+cabled NetBox interfaces.'
        - macro: '{$FGATE.SDWAN.EXPECTED}'
          value: '0'
          description: 'Minimum SD-WAN members. Apply sets the exact configured member count per Device; safe template default is zero.'
        - macro: '{$FGATE.HA.EXPECTED}'
          value: '2'
          description: 'Expected system/ha-peer members. Estate default 2; host override 1 on standalone.'
        - macro: '{$FGATE.MEMORY.GREEN}'
          value: '82'
          description: 'FortiOS memory-use-threshold-green; apply refreshes a device override.'
        - macro: '{$FGATE.MEMORY.RED}'
          value: '88'
          description: 'FortiOS memory-use-threshold-red; apply refreshes a device override.'
        - macro: '{$FGATE.MEMORY.EXTREME}'
          value: '95'
          description: 'FortiOS memory-use-threshold-extreme; apply refreshes a device override.'
      tags:
        - tag: class
          value: network
        - tag: target
          value: fortigate
      dashboards:
