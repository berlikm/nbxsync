zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  templates:
    - uuid: 52bd809ec8a54feb8364f3d13a9c8074
      template: MSSQL Observability
      name: MSSQL Observability
      description: |
        Estate companion for stock MSSQL by Zabbix agent 2. Link **alongside** stock on
        roles MSSQL / MSSQL Query Server — do not nest stock (that would still be one
        {$MSSQL.URI}). Stock keeps the default instance
        (sqlserver://localhost:1433). This template LLD-discovers named Windows
        instances (MSSQL$%) via WMI and calls the Agent 2 MSSQL plugin with
        sqlserver://localhost/{#MSSQL.INSTANCE} (no port; plugin ≥ 7.0.6, template requires plugin ≥ 7.0.10).
        
        Named-instance databases and Always On local DBs are a second, flattened LLD
        ({#MSSQL.INSTANCE}+{#DBNAME}). Zabbix 7.0 cannot nest discovery-under-discovery
        on the same host. Keys include the instance so they cannot collide with stock.
        Backup USED flags default to 1 on every environment — do not mute Test/Dev here.
        
        Do not reuse the Windows-by-agent service LLD key. Do not nest ICMP or
        invent host prototypes. Do not put instance names in NetBox.
        
        Operator spec: zabbix/notes/mssql-agent2-instances.md.
      groups:
        - name: Templates/Databases
      items:
      - uuid: 3f55ba471ea249e6a93c97cc8e67baee
        name: Named instance WMI
        key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
        delay: 15m
        value_type: TEXT
        history: '0'
        trends: '0'
        timeout: 30s
        description: 'Win32_Service rows matching MSSQL% (JS keeps MSSQL$ named instances). MSSQLSERVER and MSSQLFDLauncher are dropped. Not-supported becomes empty LLD.'
        preprocessing:
          - type: CHECK_NOT_SUPPORTED
            parameters:
              - '-1'
            error_handler: CUSTOM_VALUE
            error_handler_params: '[]'
          - type: JAVASCRIPT
            parameters:
              - |
                var parsed;
                try {
                  parsed = JSON.parse(value);
                } catch (e) {
                  throw 'MSSQL named-instance LLD: invalid WMI JSON';
                }
                var rows = [];
                if (parsed === null) {
                  return '[]';
                }
                if (Object.prototype.toString.call(parsed) === '[object Array]') {
                  rows = parsed;
                } else if (typeof parsed === 'object') {
                  rows = [parsed];
                } else {
                  return '[]';
                }
                var PREFIX = 'MSSQL$';
                var out = [];
                for (var i = 0; i < rows.length; i++) {
                  var row = rows[i];
                  var name = row && row.Name;
                  if (typeof name !== 'string') {
                    continue;
                  }
                  if (name.indexOf(PREFIX) !== 0) {
                    continue;
                  }
                  if (name.indexOf('MSSQLFDLauncher') === 0) {
                    continue;
                  }
                  var instance = name.substring(PREFIX.length);
                  if (!instance) {
                    continue;
                  }
                  out.push({
                    '{#MSSQL.SERVICE}': name,
                    '{#MSSQL.INSTANCE}': instance,
                    '{#MSSQL.URI}': 'sqlserver://localhost/' + instance,
                    '{#MSSQL.DISPLAY}': row.DisplayName || name
                  });
                }
                return JSON.stringify(out);
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 1h
        tags:
          - tag: component
            value: raw
      - uuid: 3ecd3acbb9b04143a837cbc412cc20c1
        name: Named instances
        type: DEPENDENT
        key: mssql.observability.instance.count
        delay: '0'
        value_type: UNSIGNED
        description: Count of named MSSQL$ instances from WMI after JS (before LLD filters).
        master_item:
          key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
        preprocessing:
          - type: JSONPATH
            parameters:
              - $.length()
            error_handler: CUSTOM_VALUE
            error_handler_params: '0'
        tags:
          - tag: component
            value: health
        triggers:
          - uuid: 33a0e2815f7245a9a40f8fffeec4c0c8
            expression: 'last(/MSSQL Observability/mssql.observability.instance.count)<{$MSSQL.INSTANCE.DISCOVERY.MIN} and {$MSSQL.INSTANCE.DISCOVERY.MIN}>0'
            name: 'MSSQL Observability: Named instance count unexpected'
            priority: AVERAGE
            description: 'Named-instance census. Default MIN=0 so default-only hosts stay quiet. Set {$MSSQL.INSTANCE.DISCOVERY.MIN} on the Device when you expect N instances.'
            tags:
              - tag: scope
                value: availability
      - uuid: 33d27282beac4664824f7cc40b522e0a
        name: Named-instance database catalog seed
        type: CALCULATED
        key: 'mssql.observability.db.catalog[_seed]'
        delay: 1h
        value_type: TEXT
        history: '0'
        trends: '0'
        params: '"[]"'
        description: Keeps last_foreach of database catalogs from going unsupported when LLD is empty.
        tags:
          - tag: component
            value: raw
          - tag: mssql_seed
            value: seed
      - uuid: 7fa843d2401a43d68e8557acb30edc5a
        name: Named-instance database LLD JSON
        type: CALCULATED
        key: mssql.observability.database.lldjson
        delay: 5m
        value_type: TEXT
        history: '0'
        trends: '0'
        params: 'last_foreach(//mssql.observability.db.catalog[*])'
        description: 'Flattened {#MSSQL.INSTANCE}+{#DBNAME} catalog from every named-instance db.get. Zabbix 7.0 cannot nest database LLD under instance LLD.'
        preprocessing:
          - type: JAVASCRIPT
            parameters:
              - |
                try {
                  var parsed = JSON.parse(value);
                } catch (error) {
                  return '[]';
                }
                if (parsed == null || parsed === '') {
                  return '[]';
                }
                if (!Array.isArray(parsed)) {
                  parsed = [parsed];
                }
                var out = [];
                for (var i = 0; i < parsed.length; i++) {
                  var chunk = parsed[i];
                  if (chunk == null || chunk === '') {
                    continue;
                  }
                  if (typeof chunk === 'string') {
                    try {
                      chunk = JSON.parse(chunk);
                    } catch (error) {
                      continue;
                    }
                  }
                  if (!Array.isArray(chunk)) {
                    chunk = [chunk];
                  }
                  for (var j = 0; j < chunk.length; j++) {
                    var row = chunk[j];
                    if (row && typeof row === 'object') {
                      out.push(row);
                    }
                  }
                }
                return JSON.stringify(out);
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 1h
        tags:
          - tag: component
            value: raw
      - uuid: 3fa71d5d85034ff1b696d6804b7e685f
        name: Named-instance AG local-DB catalog seed
        type: CALCULATED
        key: 'mssql.observability.local_db.catalog[_seed]'
        delay: 1h
        value_type: TEXT
        history: '0'
        trends: '0'
        params: '"[]"'
        description: Keeps last_foreach of AG local-DB catalogs from going unsupported when LLD is empty.
        tags:
          - tag: component
            value: raw
          - tag: mssql_seed
            value: seed
      - uuid: f37ef09913864c05a595d32b55d00d8a
        name: Named-instance AG local-DB LLD JSON
        type: CALCULATED
        key: mssql.observability.local_db.lldjson
        delay: 5m
        value_type: TEXT
        history: '0'
        trends: '0'
        params: 'last_foreach(//mssql.observability.local_db.catalog[*])'
        description: 'Flattened {#MSSQL.INSTANCE}+{#GROUP_NAME}+{#DBNAME} catalog from local.db.get.'
        preprocessing:
          - type: JAVASCRIPT
            parameters:
              - |
                try {
                  var parsed = JSON.parse(value);
                } catch (error) {
                  return '[]';
                }
                if (parsed == null || parsed === '') {
                  return '[]';
                }
                if (!Array.isArray(parsed)) {
                  parsed = [parsed];
                }
                var out = [];
                for (var i = 0; i < parsed.length; i++) {
                  var chunk = parsed[i];
                  if (chunk == null || chunk === '') {
                    continue;
                  }
                  if (typeof chunk === 'string') {
                    try {
                      chunk = JSON.parse(chunk);
                    } catch (error) {
                      continue;
                    }
                  }
                  if (!Array.isArray(chunk)) {
                    chunk = [chunk];
                  }
                  for (var j = 0; j < chunk.length; j++) {
                    var row = chunk[j];
                    if (row && typeof row === 'object') {
                      out.push(row);
                    }
                  }
                }
                return JSON.stringify(out);
          - type: DISCARD_UNCHANGED_HEARTBEAT
            parameters:
              - 1h
        tags:
          - tag: component
            value: raw
      discovery_rules:
        - uuid: cb908a0bf4d64704b69907e919467af3
          name: Named instance discovery
          type: DEPENDENT
          key: mssql.named.instance.discovery
          delay: '0'
          lifetime: 7d
          lifetime_type: DELETE_AFTER
          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Named SQL Server instances (MSSQL$*). Default instance is stock.'
          master_item:
            key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#MSSQL.INSTANCE}'
                value: '{$MSSQL.INSTANCE.MATCHES}'
                formulaid: A
              - macro: '{#MSSQL.INSTANCE}'
                value: '{$MSSQL.INSTANCE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 675a7ebddc2246a98092d73fefd999ec
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Ping'
              key: 'mssql.ping["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 1m
              timeout: 30s
              description: Plugin TDS ping for this named instance (1=alive). Not TCP 1433.
              valuemap:
                name: Service state
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              tags:
                - tag: component
                  value: availability
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
              trigger_prototypes:
                - uuid: 5eb5a1d7fa704650afbae654fa3d323a
                  expression: 'max(/MSSQL Observability/mssql.ping["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],#3)=0'
                  name: 'MSSQL [{#MSSQL.INSTANCE}]: TDS unavailable'
                  priority: AVERAGE
                  description: Named instance is not answering TDS. Windows already tickets a stopped MSSQL$ service. This is login/URI/Browser/plugin — not Disaster.
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 0625bb035bb240dbaac8b402852eeb93
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Version'
              key: 'mssql.version["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 5m
              value_type: CHAR
              trends: '0'
              timeout: 30s
              description: SQL Server version string for this named instance. Delay 5m so nodata 15m is three misses.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: application
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
              trigger_prototypes:
                - uuid: 70b0db2ec48940d2912ad06244c7fe17
                  expression: 'nodata(/MSSQL Observability/mssql.version["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],15m)=1'
                  name: 'MSSQL [{#MSSQL.INSTANCE}]: no version data for 15m'
                  priority: AVERAGE
                  description: No version for 15m — login missing on this instance, plugin, or Browser/port. Depends on TDS unavailable so a down instance is one ticket.
                  dependencies:
                    - name: 'MSSQL [{#MSSQL.INSTANCE}]: TDS unavailable'
                      expression: 'max(/MSSQL Observability/mssql.ping["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],#3)=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 945c5894c04248aa9aafaf11d753df2f
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get performance counters'
              key: 'mssql.perfcounter.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: '0;m0-59'
              value_type: TEXT
              history: '0'
              trends: '0'
              timeout: 30s
              description: Perfcounter master for this named instance (same interval as stock).
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: e0d4914d47e743769a0429d961197139
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Buffer Manager counters'
              type: DEPENDENT
              key: 'mssql.observability.buffer_manager.raw[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: TEXT
              history: '0'
              trends: '0'
              master_item:
                key: 'mssql.perfcounter.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.object_name=~''.*Buffer Manager'')]'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 255fe06d39934cfaa66857f68b3f7812
              name: 'MSSQL [{#MSSQL.INSTANCE}]: SQL Statistics counters'
              type: DEPENDENT
              key: 'mssql.observability.sql_statistics.raw[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: TEXT
              history: '0'
              trends: '0'
              master_item:
                key: 'mssql.perfcounter.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.object_name=~''.*SQL Statistics'')]'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 19e71f97fbe24653b0ac7d756796307f
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Locks counters'
              type: DEPENDENT
              key: 'mssql.observability.locks.raw[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: TEXT
              history: '0'
              trends: '0'
              master_item:
                key: 'mssql.perfcounter.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.object_name=~''.*Locks'' && @.instance_name==''_Total'')]'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 6f0286e189aa420c85f81d2c0b35034a
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Buffer cache hit ratio'
              type: DEPENDENT
              key: 'mssql.observability.buffer_cache_hit_ratio[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: Pages found in buffer cache without a disk read.
              master_item:
                key: 'mssql.observability.buffer_manager.raw[{#MSSQL.INSTANCE}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.counter_name==''BufferCacheHitRatio'')].cntr_value.first()'
              tags:
                - tag: component
                  value: cache
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
              trigger_prototypes:
                - uuid: 9d3a4e70371f4d14b2747563e5d2b038
                  expression: 'max(/MSSQL Observability/mssql.observability.buffer_cache_hit_ratio[{#MSSQL.INSTANCE}],5m)<{$MSSQL.BUFFER_CACHE.MIN}'
                  name: 'MSSQL [{#MSSQL.INSTANCE}]: Buffer cache hit ratio is low'
                  event_name: 'MSSQL [{#MSSQL.INSTANCE}]: Buffer cache hit ratio is low (below {$MSSQL.BUFFER_CACHE.MIN}% for 5m)'
                  priority: WARNING
                  description: Estate Warning only — stock High on the default instance is too hot here.
                  dependencies:
                    - name: 'MSSQL [{#MSSQL.INSTANCE}]: TDS unavailable'
                      expression: 'max(/MSSQL Observability/mssql.ping["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],#3)=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: e4b1d186c7294db88c7f20f1cc2f4b0b
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Page life expectancy'
              type: DEPENDENT
              key: 'mssql.observability.page_life_expectancy[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: FLOAT
              units: s
              description: Seconds a page stays in the buffer pool without references.
              master_item:
                key: 'mssql.observability.buffer_manager.raw[{#MSSQL.INSTANCE}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.counter_name==''Page life expectancy'')].cntr_value.first()'
              tags:
                - tag: component
                  value: page
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
              trigger_prototypes:
                - uuid: b87215e231a147ac9d6d9bb294f9c82f
                  expression: 'max(/MSSQL Observability/mssql.observability.page_life_expectancy[{#MSSQL.INSTANCE}],15m)<{$MSSQL.PAGE_LIFE.MIN}'
                  name: 'MSSQL [{#MSSQL.INSTANCE}]: Page life expectancy is low'
                  event_name: 'MSSQL [{#MSSQL.INSTANCE}]: Page life expectancy is low (less {$MSSQL.PAGE_LIFE.MIN}s for 15m)'
                  priority: WARNING
                  description: Estate Warning only — stock High on the default instance is too hot here.
                  dependencies:
                    - name: 'MSSQL [{#MSSQL.INSTANCE}]: TDS unavailable'
                      expression: 'max(/MSSQL Observability/mssql.ping["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],#3)=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: d4b8950e7b26428eb193824485f0ee4e
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Batch requests per second'
              type: DEPENDENT
              key: 'mssql.observability.batch_requests_rate[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: FLOAT
              units: rps
              description: Transact-SQL batches received per second.
              master_item:
                key: 'mssql.observability.sql_statistics.raw[{#MSSQL.INSTANCE}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.counter_name==''Batch Requests/sec'')].cntr_value.first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: performance
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: b3e50b3edba14435ae162f1aa904431b
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Lock timeouts per second'
              type: DEPENDENT
              key: 'mssql.observability.lock_timeouts_rate[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: FLOAT
              units: rps
              description: Timed-out lock requests per second, including NOWAIT.
              master_item:
                key: 'mssql.observability.locks.raw[{#MSSQL.INSTANCE}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.counter_name==''Lock Timeouts/sec'')].cntr_value.first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: lock
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: b6b8df024f6140728afe38346cd4980b
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get job status'
              key: 'mssql.job.status.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 10m
              value_type: TEXT
              history: '0'
              trends: '0'
              timeout: 30s
              description: SQL Agent job status JSON for this named instance.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 5543b617c39b45279b68480bdbcd0ea2
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Failed jobs'
              type: DEPENDENT
              key: 'mssql.observability.failed_jobs[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: UNSIGNED
              description: Jobs whose last run_status is Failed (0).
              master_item:
                key: 'mssql.job.status.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.run_status==0)].length()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              tags:
                - tag: component
                  value: mssql-job
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 3e701a797e4e4c3a91227d823c504b00
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get last backup'
              key: 'mssql.last.backup.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 10m
              value_type: TEXT
              history: 7d
              trends: '0'
              timeout: 30s
              description: Last-backup JSON for this named instance. Per-database age is flattened LLD.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 45b50c5a4ea6461e82186d0a3b265ac5
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get database'
              key: 'mssql.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 10m
              value_type: TEXT
              history: 7d
              trends: '0'
              timeout: 30s
              description: Database JSON for this named instance. Feeds flattened database LLD.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 030b1464f93740dbb6f573b77ac7184f
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Database catalog'
              type: DEPENDENT
              key: 'mssql.observability.db.catalog[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: TEXT
              history: '0'
              trends: '0'
              description: 'LLD rows for this instance stamped with {#MSSQL.INSTANCE} and {#MSSQL.URI}.'
              master_item:
                key: 'mssql.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var data = JSON.parse(value);
                      } catch (error) {
                        return '[]';
                      }
                      if (data == null || data === '') {
                        return '[]';
                      }
                      if (!Array.isArray(data)) {
                        data = [data];
                      }
                      var instance = '{#MSSQL.INSTANCE}';
                      var uri = '{#MSSQL.URI}';
                      var instanceKey = '{#' + 'MSSQL.INSTANCE}';
                      var uriKey = '{#' + 'MSSQL.URI}';
                      var dbKey = '{#' + 'DBNAME}';
                      var recoveryKey = '{#' + 'RECOVERY_MODEL}';
                      var out = [];
                      for (var i = 0; i < data.length; i++) {
                        var row = data[i] || {};
                        var dbname = String(row.dbname || row.DBName || '');
                        if (!dbname) {
                          continue;
                        }
                        var lld = {};
                        lld[instanceKey] = instance;
                        lld[uriKey] = uri;
                        lld[dbKey] = dbname;
                        lld[recoveryKey] = String(row.recovery_model == null ? '' : row.recovery_model);
                        out.push(lld);
                      }
                      return JSON.stringify(out);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
