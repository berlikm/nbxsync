      tags:
        - tag: class
          value: database
        - tag: target
          value: mssql
      macros:
        - macro: '{$MSSQL.INSTANCE.MATCHES}'
          value: '.*'
          description: 'Allowlist for named-instance LLD ({#MSSQL.INSTANCE}).'
        - macro: '{$MSSQL.INSTANCE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Denylist for named-instance LLD. Example: SQLEXPRESS.'
        - macro: '{$MSSQL.INSTANCE.DISCOVERY.MIN}'
          value: '0'
          description: Census floor. 0 is valid (default-only hosts). Set per Device if you expect N named instances.
        - macro: '{$MSSQL.BUFFER_CACHE.MIN}'
          value: '50'
          description: Buffer cache hit ratio Warning floor (percent). Estate uses Warning only.
        - macro: '{$MSSQL.PAGE_LIFE.MIN}'
          value: '300'
          description: Page life expectancy Warning floor (seconds). Estate uses Warning only.
        - macro: '{$MSSQL.DBNAME.MATCHES}'
          value: '.*'
          description: 'Allowlist for named-instance database LLD ({#DBNAME}). Same default as stock.'
        - macro: '{$MSSQL.DBNAME.NOT_MATCHES}'
          value: 'master|tempdb|model|msdb'
          description: Denylist for named-instance database LLD. System databases only — not an environment mute.
        - macro: '{$MSSQL.BACKUP_FULL.USED}'
          value: '1'
          description: '1 = fire full-backup age triggers. Default 1 on every environment. Override per database with context, not per Test/Dev role.'
        - macro: '{$MSSQL.BACKUP_FULL.WARN}'
          value: 9d
          description: Full backup age Warning (stock default).
        - macro: '{$MSSQL.BACKUP_FULL.CRIT}'
          value: 10d
          description: Full backup age High (stock default).
        - macro: '{$MSSQL.BACKUP_DIFF.USED}'
          value: '1'
          description: 1 = fire diff-backup age triggers. Default 1 on every environment.
        - macro: '{$MSSQL.BACKUP_DIFF.WARN}'
          value: 3d
          description: Diff backup age Warning (stock default).
        - macro: '{$MSSQL.BACKUP_DIFF.CRIT}'
          value: 6d
          description: Diff backup age High (stock default).
        - macro: '{$MSSQL.BACKUP_LOG.USED}'
          value: '1'
          description: 1 = fire log-backup age triggers. Default 1 on every environment. Simple recovery is skipped.
        - macro: '{$MSSQL.BACKUP_LOG.WARN}'
          value: 4h
          description: Log backup age Warning (stock default).
        - macro: '{$MSSQL.BACKUP_LOG.CRIT}'
          value: 8h
          description: Log backup age High (stock default).
        - macro: '{$MSSQL.PERCENT_LOG_USED.MAX}'
          value: '80'
          description: Percent log used Warning ceiling (stock default 80).
        - macro: '{$MSSQL.LOG_FLUSH_WAITS.MAX}'
          value: '1'
          description: Log flush waits/sec Warning (stock default).
        - macro: '{$MSSQL.LOG_FLUSH_WAIT_TIME.MAX}'
          value: '1'
          description: Log flush wait time ms Warning (stock default).
