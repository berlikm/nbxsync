            - uuid: ead25fc965ec5a18a04ad37c11db1f4e
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get local DB'
              key: 'mssql.local.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 5m
              value_type: TEXT
              history: '0'
              trends: '0'
              timeout: 30s
              description: Always On local-database JSON for this named instance. Feeds flattened AG LLD.
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[]'
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 4255a05aa1fe5ac5a399dae72d2bed42
              name: 'MSSQL [{#MSSQL.INSTANCE}]: AG local-DB catalog'
              type: DEPENDENT
              key: 'mssql.observability.local_db.catalog[{#MSSQL.INSTANCE}]'
              delay: '0'
              value_type: TEXT
              history: '0'
              trends: '0'
              description: AG local-DB LLD rows stamped with instance, group, and database.
              master_item:
                key: 'mssql.local.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                      	var data = JSON.parse(value);
                      } catch (error) {
                      	return '[]';
                      }
                      if (data == null || data === '') {
                      	return '[]';
                      }
                      if (!Array.isArray(data)) {
                      	data = [data];
                      }
                      var instance = '{#MSSQL.INSTANCE}';
                      var uri = '{#MSSQL.URI}';
                      var out = [];
                      for (var i = 0; i < data.length; i++) {
                      	var row = data[i] || {};
                      	var dbname = String(row.dbname || row.DBName || '');
                      	var group = String(row.group_name || row.groupName || '');
                      	if (!dbname || !group) {
                      		continue;
                      	}
                      	out.push({
                      		'{#MSSQL.INSTANCE}': instance,
                      		'{#MSSQL.URI}': uri,
                      		'{#DBNAME}': dbname,
                      		'{#GROUP_NAME}': group
                      	});
                      }
                      return JSON.stringify(out);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
        - uuid: 32b1aa39edeb5a4d88dfe4f7a138989b
          name: Named instance database discovery
          type: DEPENDENT
          key: mssql.observability.database.discovery
          delay: '0'
          lifetime: 7d
          lifetime_type: DELETE_AFTER
          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'User databases on every named instance. Flattened from mssql.db.get catalogs. System DBs filtered by {$MSSQL.DBNAME.NOT_MATCHES} (not an environment mute).'
          master_item:
            key: mssql.observability.database.lldjson
          filter:
            evaltype: AND
            conditions:
              - macro: '{#DBNAME}'
                value: '{$MSSQL.DBNAME.MATCHES}'
