zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  host_groups:
    - uuid: 6f2c8a91d4b047e3b8c15a7e9d04f3c2
      name: 'MSSQL instances'
  templates:
    - uuid: 52bd809ec8a54feb8364f3d13a9c8074
      template: 'MSSQL Observability'
      name: 'MSSQL Observability'
      description: |
        Estate companion for stock MSSQL by Zabbix agent 2 (vendor 7.0-6).

        Link this template *alongside* stock Agent 2 on roles MSSQL and
        MSSQL Query Server. Do not nest stock — nesting would still be one
        {$MSSQL.URI}. Stock keeps sqlserver://localhost:1433 (default
        instance). This companion discovers Windows named instances
        (MSSQL$…) and calls the same plugin keys with
        sqlserver://localhost/{#MSSQL.INSTANCE} (no port; plugin 7.0.6+).

        Requires Zabbix agent 2 with MSSQL loadable plugin >= 7.0.10 and
        server/proxy >= 7.0.6. Uses wmi.getall, not service.discovery
        (Windows by Zabbix agent already owns that key). Named-instance
        db.get and last.backup.get results are retained and normalized into
        per-instance database/backup inventories on the Windows host.

        Named-instance databases/graphs use a 7.0 host prototype (Zabbix
        cannot nest LLD-under-LLD on Cloud 7.0). Each MSSQL$* becomes
        {#MSSQL.PARENT}-mssql-{#MSSQL.INSTANCE} with stock Agent 2 and
        {$MSSQL.URI}=sqlserver://localhost/{#MSSQL.INSTANCE}. Parent name
        is {$MSSQL.PARENT.HOST} when set, else Win32_Service.SystemName
        ({HOST.HOST} is not expanded in host/group prototypes). Children
        join only the YAML host group MSSQL instances. Do not add
        hostname or Roles/MSSQL/* group prototypes (they explode the
        Sites/Roles/OS tree and put Query Server children under MSSQL).
        Filter children with tags parent_host and sql_instance. Drop the
        prototype after Cloud nested LLD exists. Do not nest stock on
        this template, clone TCP-1433 Disaster here, or put instance
        names in NetBox. Host prototypes have no description field
        (Cloud 7.0 import rejects it).

        See zabbix/notes/mssql-agent2-instances.md.
      groups:
        - name: Templates/Databases
      items:
        - uuid: 3f55ba471ea249e6a93c97cc8e67baee
          name: 'MSSQL: Named instance WMI'
          key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode,SystemName FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
          delay: 1h
          history: 1h
          value_type: TEXT
          trends: '0'
          description: |
            Win32_Service rows whose Name starts with MSSQL. LIKE 'MSSQL%'
            (no $ in the item key). SELECT includes SystemName so LLD can
            name child hosts without {HOST.HOST} (not expanded on
            prototypes). JS keeps only MSSQL$<instance>; MSSQLSERVER and
            MSSQLFDLauncher* are dropped. Default-only hosts correctly
            yield an empty LLD array.
          timeout: 30s
          tags:
            - tag: component
              value: census
        - uuid: 3ecd3acbb9b04143a837cbc412cc20c1
          name: 'MSSQL: Named instance count'
          type: DEPENDENT
          key: mssql.observability.instance.count
          delay: '0'
          history: 90d
          value_type: FLOAT
          description: |
            Count of named instances after JS filter. Census trigger is off
            while {$MSSQL.INSTANCE.DISCOVERY.MIN}=0 (default-only boxes).
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var parsed;
                  try {
                    parsed = JSON.parse(value);
                  } catch (e) {
                    throw 'MSSQL named-instance LLD: invalid WMI JSON';
                  }
                  var rows = [];
                  if (parsed === null) {
                    return '[]';
                  }
                  if (Object.prototype.toString.call(parsed) === '[object Array]') {
                    rows = parsed;
                  } else if (typeof parsed === 'object') {
                    rows = [parsed];
                  } else {
                    return '[]';
                  }
                  var PREFIX = 'MSSQL$';
                  var parentMacro = '{$MSSQL.PARENT.HOST}';
                  var out = [];
                  function trimCopy(text) {
                    return String(text).replace(/^[ \t]+|[ \t]+$/g, '');
                  }
                  function sanitizeParent(name) {
                    var cleaned = '';
                    var i;
                    for (i = 0; i < name.length; i++) {
                      var ch = name.charAt(i);
                      if (
                        (ch >= '0' && ch <= '9') ||
                        (ch >= 'A' && ch <= 'Z') ||
                        (ch >= 'a' && ch <= 'z') ||
                        ch === '_' ||
                        ch === '.' ||
                        ch === ' ' ||
                        ch === '-'
                      ) {
                        cleaned += ch;
                      } else {
                        cleaned += '_';
                      }
                    }
                    return trimCopy(cleaned);
                  }
                  function resolveParent(row) {
                    var macro = trimCopy(parentMacro);
                    var raw = '';
                    if (macro && macro.indexOf('{$') !== 0 && macro !== 'CHANGE_IF_NEEDED') {
                      raw = macro;
                    } else if (row && typeof row.SystemName === 'string') {
                      raw = row.SystemName;
                    }
                    return sanitizeParent(raw);
                  }
                  for (var i = 0; i < rows.length; i++) {
                    var row = rows[i];
                    var name = row && row.Name;
                    if (typeof name !== 'string') {
                      continue;
                    }
                    if (name.indexOf(PREFIX) !== 0) {
                      continue;
                    }
                    if (name.indexOf('MSSQLFDLauncher') === 0) {
                      continue;
                    }
                    var instance = name.substring(PREFIX.length);
                    if (!instance) {
                      continue;
                    }
                    var parent = resolveParent(row);
                    if (!parent) {
                      throw 'MSSQL named-instance LLD: missing parent host name';
                    }
                    out.push({
                      '{#MSSQL.SERVICE}': name,
                      '{#MSSQL.INSTANCE}': instance,
                      '{#MSSQL.URI}': 'sqlserver://localhost/' + instance,
                      '{#MSSQL.DISPLAY}': row.DisplayName || name,
                      '{#MSSQL.PARENT}': parent
                    });
                  }
                  return JSON.stringify(out);
            - type: JSONPATH
              parameters:
                - $.length()
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode,SystemName FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
          tags:
            - tag: component
              value: census
          triggers:
            - uuid: 33a0e2815f7245a9a40f8fffeec4c0c8
              expression: 'last(/MSSQL Observability/mssql.observability.instance.count)<{$MSSQL.INSTANCE.DISCOVERY.MIN} and {$MSSQL.INSTANCE.DISCOVERY.MIN}>0'
              name: 'MSSQL: fewer named instances than expected'
              event_name: 'MSSQL: named instance count {ITEM.LASTVALUE1} < {$MSSQL.INSTANCE.DISCOVERY.MIN}'
              priority: AVERAGE
              description: |
                WMI named-instance census is below {$MSSQL.INSTANCE.DISCOVERY.MIN}.
                Default MIN is 0 so default-only hosts stay quiet. Set MIN on the
                Device only when you know how many named instances that box has.
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: cb908a0bf4d64704b69907e919467af3
          name: 'MSSQL: Named instance discovery'
          type: DEPENDENT
          key: mssql.named.instance.discovery
          delay: '0'
          lifetime: 7d
          lifetime_type: DELETE_AFTER
          enabled_lifetime: '0'
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: |
            Named SQL Server instances (MSSQL$PITDV02, …). Stock Agent 2 owns
            the default instance. Host prototypes create one child host per
            named instance so stock can run first-level database LLD.
            Filter on {#MSSQL.INSTANCE}; do not put instance names in NetBox.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#MSSQL.INSTANCE}'
                value: '{$MSSQL.INSTANCE.MATCHES}'
                formulaid: A
              - macro: '{#MSSQL.INSTANCE}'
                operator: NOT_MATCHES_REGEX
                value: '{$MSSQL.INSTANCE.NOT_MATCHES}'
                formulaid: B
          item_prototypes:
            - uuid: 0625bb035bb240dbaac8b402852eeb93
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Version'
              key: 'mssql.version["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 5m
              value_type: CHAR
              trends: '0'
              description: 'Plugin version probe for this named instance. URI is LLD, not {$MSSQL.URI}. Stable versions emit on every poll so nodata detects actual silence.'
              timeout: 30s
              tags:
                - tag: component
                  value: application
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
              trigger_prototypes:
                - uuid: 70b0db2ec48940d2912ad06244c7fe17
                  expression: 'nodata(/MSSQL Observability/mssql.version["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"],15m)=1'
                  name: 'MSSQL [{#MSSQL.INSTANCE}]: no version data for 15m'
                  priority: AVERAGE
                  description: |
                    Named-instance plugin item is unsupported or silent. Typical
                    causes: login missing on that instance, plugin too old for
                    instance-in-URI, SQL Browser/port, or the Windows service
                    is stopped (Windows by agent already tickets the service).
                    Not a site Disaster and not a TCP-1433 simple check.
                    Do not DISCARD_UNCHANGED with a heartbeat longer than this
                    nodata window (1d discard made a stable version look silent).
                  tags:
                    - tag: scope
                      value: availability
                    - tag: sql_instance
                      value: '{#MSSQL.INSTANCE}'
            - uuid: 945c5894c04248aa9aafaf11d753df2f
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get performance counters'
              key: 'mssql.perfcounter.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 1m
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Stock perfcounter master, keyed by named-instance URI. JSON dependents are v1-out of scope.'
              timeout: 30s
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: b6b8df024f6140728afe38346cd4980b
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get job status'
              key: 'mssql.job.status.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 10m
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Stock job-status master for this named instance. No nested job LLD in v1.'
              timeout: 30s
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 3e701a797e4e4c3a91227d823c504b00
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get last backup'
              key: 'mssql.last.backup.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 10m
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Stock last-backup source for this named instance. Retained for 7d and normalized into the per-instance backup inventory below; this companion does not create nested per-database LLD.'
              timeout: 30s
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 45b50c5a4ea6461e82186d0a3b265ac5
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Get database'
              key: 'mssql.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              delay: 1h
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Stock db.get source for this named instance. Retained for 7d and normalized into the durable database inventory below; Zabbix cannot nest per-database LLD below this instance LLD on one host.'
              timeout: 30s
              tags:
                - tag: component
                  value: raw
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: cc5e55eea05e459ab565ebd64e119f82
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Database count'
              type: DEPENDENT
              key: 'mssql.observability.db.count["{#MSSQL.INSTANCE}"]'
              delay: '0'
              history: 90d
              value_type: FLOAT
              description: 'What SQL returned (includes system DBs). Not the stock DBNAME.NOT_MATCHES filter.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.length()
              master_item:
                key: 'mssql.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              tags:
                - tag: component
                  value: application
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: e6ad71399bd54a2d88fea9d94ed3ce40
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Database inventory'
              type: DEPENDENT
              key: 'mssql.observability.db.inventory["{#MSSQL.INSTANCE}"]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              description: |
                Normalized name/recovery-model inventory for every database
                returned by db.get on this named instance. This remains one
                text item per instance: Zabbix cannot nest database LLD under
                this named-instance LLD while keeping one Windows host.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var parsed;
                      try {
                        parsed = JSON.parse(value);
                      } catch (e) {
                        throw 'MSSQL named database inventory: invalid db.get JSON';
                      }

                      var rows = [];
                      if (parsed === null) {
                        return '[]';
                      }
                      if (Object.prototype.toString.call(parsed) === '[object Array]') {
                        rows = parsed;
                      } else if (typeof parsed === 'object') {
                        rows = [parsed];
                      } else {
                        throw 'MSSQL named database inventory: db.get must return an array';
                      }

                      var recoveryModels = {
                        '1': 'FULL',
                        '2': 'BULK_LOGGED',
                        '3': 'SIMPLE'
                      };
                      var seen = {};
                      var out = [];

                      for (var i = 0; i < rows.length; i++) {
                        var row = rows[i];
                        var name = row && row.dbname;
                        if (typeof name !== 'string' || !name || seen[name]) {
                          continue;
                        }

                        seen[name] = true;
                        var model = row.recovery_model;
                        if (model === null || typeof model === 'undefined' || model === '') {
                          model = '';
                        } else {
                          model = recoveryModels[String(model)] || String(model);
                        }

                        out.push({
                          name: name,
                          recovery_model: model
                        });
                      }

                      out.sort(function (a, b) {
                        return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
                      });
                      return JSON.stringify(out);
              master_item:
                key: 'mssql.db.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              tags:
                - tag: component
                  value: database
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
            - uuid: 9fe1c57ed32a47e398ba141148f50d1c
              name: 'MSSQL [{#MSSQL.INSTANCE}]: Backup inventory'
              type: DEPENDENT
              key: 'mssql.observability.backup.inventory["{#MSSQL.INSTANCE}"]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: |
                Normalized full, differential, and log backup ages for every
                database returned by last.backup.get on this named instance.
                This is visible per database in Latest data without inventing
                unsupported nested LLD or per-database threshold triggers.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var parsed;
                      try {
                        parsed = JSON.parse(value);
                      } catch (e) {
                        throw 'MSSQL named backup inventory: invalid last.backup.get JSON';
                      }

                      var rows = [];
                      if (parsed === null) {
                        return '[]';
                      }
                      if (Object.prototype.toString.call(parsed) === '[object Array]') {
                        rows = parsed;
                      } else if (typeof parsed === 'object') {
                        rows = [parsed];
                      } else {
                        throw 'MSSQL named backup inventory: last.backup.get must return an array';
                      }

                      var recoveryModels = {
                        '1': 'FULL',
                        '2': 'BULK_LOGGED',
                        '3': 'SIMPLE'
                      };
                      var backupKinds = {
                        D: 'full',
                        I: 'diff',
                        L: 'log'
                      };
                      var byName = {};

                      function seconds(value) {
                        if (value === null || typeof value === 'undefined' || value === '') {
                          return null;
                        }
                        var numeric = Number(value);
                        return isFinite(numeric) && numeric >= 0 ? numeric : null;
                      }

                      for (var i = 0; i < rows.length; i++) {
                        var row = rows[i];
                        var name = row && row.dbname;
                        var kind = row && backupKinds[row.type];
                        if (typeof name !== 'string' || !name || !kind) {
                          continue;
                        }

                        var record = byName[name];
                        if (!record) {
                          record = {name: name};
                          var model = row.db_recovery_model;
                          if (model !== null && typeof model !== 'undefined' && model !== '') {
                            record.recovery_model = recoveryModels[String(model)] || String(model);
                          }
                          byName[name] = record;
                        }

                        var age = seconds(row.time_since_last_backup);
                        if (age !== null) {
                          record[kind + '_age_seconds'] = age;
                        }
                      }

                      var out = [];
                      for (var dbname in byName) {
                        if (Object.prototype.hasOwnProperty.call(byName, dbname)) {
                          out.push(byName[dbname]);
                        }
                      }
                      out.sort(function (a, b) {
                        return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
                      });
                      return JSON.stringify(out);
              master_item:
                key: 'mssql.last.backup.get["{#MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]'
              tags:
                - tag: component
                  value: backup
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
          host_prototypes:
            - uuid: c8e4b17a9d5f4c2e8a6b3d0f1e7c5948
              host: '{#MSSQL.PARENT}-mssql-{#MSSQL.INSTANCE}'
              name: '{#MSSQL.PARENT} / {#MSSQL.INSTANCE}'
              group_links:
                - group:
                    name: 'MSSQL instances'
              templates:
                - name: 'MSSQL by Zabbix agent 2'
              inventory_mode: DISABLED
              custom_interfaces: 'NO'
              macros:
                - macro: '{$MSSQL.URI}'
                  value: 'sqlserver://localhost/{#MSSQL.INSTANCE}'
                  description: 'Named instance URI (no port). Overrides the parent default-instance URI inherited from the Windows host.'
              tags:
                - tag: component
                  value: mssql-instance
                - tag: sql_instance
                  value: '{#MSSQL.INSTANCE}'
                - tag: parent_host
                  value: '{#MSSQL.PARENT}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var parsed;
                  try {
                    parsed = JSON.parse(value);
                  } catch (e) {
                    throw 'MSSQL named-instance LLD: invalid WMI JSON';
                  }
                  var rows = [];
                  if (parsed === null) {
                    return '[]';
                  }
                  if (Object.prototype.toString.call(parsed) === '[object Array]') {
                    rows = parsed;
                  } else if (typeof parsed === 'object') {
                    rows = [parsed];
                  } else {
                    return '[]';
                  }
                  var PREFIX = 'MSSQL$';
                  var parentMacro = '{$MSSQL.PARENT.HOST}';
                  var out = [];
                  function trimCopy(text) {
                    return String(text).replace(/^[ \t]+|[ \t]+$/g, '');
                  }
                  function sanitizeParent(name) {
                    var cleaned = '';
                    var i;
                    for (i = 0; i < name.length; i++) {
                      var ch = name.charAt(i);
                      if (
                        (ch >= '0' && ch <= '9') ||
                        (ch >= 'A' && ch <= 'Z') ||
                        (ch >= 'a' && ch <= 'z') ||
                        ch === '_' ||
                        ch === '.' ||
                        ch === ' ' ||
                        ch === '-'
                      ) {
                        cleaned += ch;
                      } else {
                        cleaned += '_';
                      }
                    }
                    return trimCopy(cleaned);
                  }
                  function resolveParent(row) {
                    var macro = trimCopy(parentMacro);
                    var raw = '';
                    if (macro && macro.indexOf('{$') !== 0 && macro !== 'CHANGE_IF_NEEDED') {
                      raw = macro;
                    } else if (row && typeof row.SystemName === 'string') {
                      raw = row.SystemName;
                    }
                    return sanitizeParent(raw);
                  }
                  for (var i = 0; i < rows.length; i++) {
                    var row = rows[i];
                    var name = row && row.Name;
                    if (typeof name !== 'string') {
                      continue;
                    }
                    if (name.indexOf(PREFIX) !== 0) {
                      continue;
                    }
                    if (name.indexOf('MSSQLFDLauncher') === 0) {
                      continue;
                    }
                    var instance = name.substring(PREFIX.length);
                    if (!instance) {
                      continue;
                    }
                    var parent = resolveParent(row);
                    if (!parent) {
                      throw 'MSSQL named-instance LLD: missing parent host name';
                    }
                    out.push({
                      '{#MSSQL.SERVICE}': name,
                      '{#MSSQL.INSTANCE}': instance,
                      '{#MSSQL.URI}': 'sqlserver://localhost/' + instance,
                      '{#MSSQL.DISPLAY}': row.DisplayName || name,
                      '{#MSSQL.PARENT}': parent
                    });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'wmi.getall[root\cimv2,"SELECT Name,DisplayName,State,StartMode,SystemName FROM Win32_Service WHERE Name LIKE ''MSSQL%''"]'
      macros:
        - macro: '{$MSSQL.INSTANCE.DISCOVERY.MIN}'
          value: '0'
          description: 'Expected named-instance count. 0 disables the census trigger (default-only hosts).'
        - macro: '{$MSSQL.INSTANCE.MATCHES}'
          value: '.*'
          description: 'Include discovered named instances (regex on {#MSSQL.INSTANCE}).'
        - macro: '{$MSSQL.INSTANCE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Exclude discovered named instances (e.g. SQLEXPRESS).'
        - macro: '{$MSSQL.PARENT.HOST}'
          value: ''
          description: |
            Optional Zabbix technical name of this Windows host. User macros
            expand in JS preprocessing; {HOST.HOST} does not. When set, LLD
            uses it for {#MSSQL.PARENT} (child technical and visible names).
            Empty falls back to Win32_Service.SystemName. Set from NetBox
            to the device name when the Windows computer name differs from
            the Zabbix host. Not used for host groups.
