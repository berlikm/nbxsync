              value: sap-application
          triggers:
            - uuid: 142ad164e911452ea427fe9646efde8f
              expression: '{$SAP.APP.CONTROL}=1 and (nodata(/SAP ME from Sensirion/sap.app.promonitor,30m)=1 or last(/SAP ME from Sensirion/sap.app.promonitor)=0)'
