        - uuid: 779bdb49521f49c1a2a690d12f5749f6
          name: TLS certificate JSON
          type: ZABBIX_PASSIVE
          key: 'web.certificate.get[{$SAP.CERT.HOST},{$SAP.CERT.PORT},{$SAP.CERT.SNI}]'
          delay: 1h
          value_type: TEXT
          history: 7d
          trends: '0'
          description: |
            LM SSL Certificate Expiration. Zabbix agent on the SAP host (Agent :10050 already on SAP Agent+SNMP). Set {$SAP.CERT.HOST} to the ICM/HTTPS name. Empty host is caught so the item does not inflate unsupported count.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '{}'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{}'
          tags:
            - tag: component
              value: certificate
        - uuid: 42129a3a15d743ca91edf6718483170e
          name: TLS certificate not after
          type: DEPENDENT
          key: sap.host.cert.not_after
          delay: '0'
          value_type: UNSIGNED
          units: unixtime
          description: $.x509.not_after from the agent certificate JSON.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.x509.not_after'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'web.certificate.get[{$SAP.CERT.HOST},{$SAP.CERT.PORT},{$SAP.CERT.SNI}]'
          tags:
            - tag: component
              value: certificate
          triggers:
            - uuid: 2416768b9c6b457d87a58b83584e9b52
              expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP ME from Sensirion/sap.host.cert.not_after)>0 and last(/SAP ME from Sensirion/sap.host.cert.not_after)<=now()'
              name: 'SAP host: TLS certificate expired'
              event_name: 'SAP host: TLS certificate expired'
              priority: AVERAGE
              description: |
                Set {$SAP.CERT.HOST} and {$SAP.CERT.CONTROL}=1. Agent check, not Promonitor.
              tags:
                - tag: scope
                  value: availability
            - uuid: f124af354ebb4976859f84d42d71d8ee
              expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP ME from Sensirion/sap.host.cert.not_after)>now() and last(/SAP ME from Sensirion/sap.host.cert.not_after)-now()<{$SAP.CERT.WARN}'
              name: 'SAP host: TLS certificate expires soon'
              event_name: 'SAP host: TLS certificate expires soon'
              priority: WARNING
              description: |
                Renew the leaf certificate before {$SAP.CERT.WARN}.
              dependencies:
                - name: 'SAP host: TLS certificate expired'
                  expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP ME from Sensirion/sap.host.cert.not_after)>0 and last(/SAP ME from Sensirion/sap.host.cert.not_after)<=now()'
              tags:
                - tag: scope
                  value: availability
        - uuid: d1fda3a0e3c6468989be416bb97b827a
          name: TLS certificate days remaining
          type: CALCULATED
          key: sap.host.cert.days
          delay: 1h
          value_type: FLOAT
          units: d
          params: '(last(//sap.host.cert.not_after)>0)*(last(//sap.host.cert.not_after)-now())/86400'
          description: 0 while {$SAP.CERT.HOST} is unset.
          tags:
            - tag: component
              value: certificate
        - uuid: a2de5809813841b6b56731fae9dfc2f9
          name: TCP port
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$SAP.PORT.TCP}]'
          delay: 1m
          description: |
            LM Port. SIMPLE from the assigned proxy to the host interface (no connection macro in the key). Default 50001 next to the certificate check. CONTROL=0 because the LM Port row was often unused. ME ssl.ports also listed 50014,51014 (sapstartsrv); override {$SAP.PORT.TCP} per host — do not ticket instance 10 on every ME box.
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 7abb00b09ad243829715799f804313f7
              expression: '{$SAP.PORT.CONTROL}=1 and max(/SAP ME from Sensirion/net.tcp.service[tcp,,{$SAP.PORT.TCP}],#3)=0'
              name: 'SAP host: TCP port is down'
              event_name: 'SAP host: TCP port is down'
              priority: AVERAGE
              description: |
                Not ICMP. ICMP High stays on the SAP Agent+SNMP CG.
              tags:
                - tag: scope
                  value: availability
