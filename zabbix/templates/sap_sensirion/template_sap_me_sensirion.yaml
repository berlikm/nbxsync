              event_name: 'SAP application: sapcontrol is down'
              priority: WARNING
              description: |
                CONTROL=1 after the Host Agent UserParameter works. Default 0 so a missing script does not page. last=0 covers CHECK_NOT_SUPPORTED; nodata covers a dead agent.
