zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7c4e2b91a06f4d8e9b15c3a8d0e4f217
      name: Templates/Applications
  templates:
    - uuid: eeba521f01b348ebaf61489646b7c7d2
      template: SAP ME from Sensirion
      name: SAP ME from Sensirion
      description: |
        Sensirion SAP ME pack (Windows AS Java). LogicMonitor parity from
        zabbix/logicmonitor-assessment.md. Hosts like ch-sta-p-as02, ch-sta-d-as01, ch-sta-p-me05.

        This template is SAP ME only. SAP HANA is openSUSE — see SAP template from Sensirion.
        No UCD-SNMP, no Linux UserParameter, no host IF/FS LLD.

        1. OS — Windows by Zabbix agent (platform rule). CPU / memory / disks /
           IP / TCP-UDP stay there. Do not duplicate those keys. Ping stays on
           CG SAP Agent+SNMP.

        2. Application — sapcontrol.exe via PowerShell UserParameter (SAP Host
           Agent C:\Program Files\SAP\hostctrl). GetProcessList = jstart /
           jcontrol GREEN/YELLOW. GetAlerts CCMS is usually empty on ME Java
           (not ST22 / IDoc / qRFC). {$SAP.APP.CONTROL}=0 until the script is
           installed.

        3. jstart — LM Windows jstart process check is proc.num[jstart.exe] on
           this template (ch-sta-p-as02 / ch-sta-d-as01). ch-sta-p-me05.sensirion.lokal LM
           Alerting tree has no jstart process DS / Promonitor / ABAP / IDoc /
           Instance Status (Promonitor, Application Server Instance Status, ABAP, IDoc). sapcontrol +
           jstart here are additive because ssl.ports prove sapstartsrv, not
           because LM collected those KPIs on me05.

        4. Certificate / Port — Windows agent web.certificate.get + SIMPLE
           {$SAP.CERT.PORT}/{$SAP.PORT.TCP} default 50001
           (AS Java HTTPS 5NN01). LM Manage Resource ch-sta-p-me05.sensirion.lokal ssl.ports
           = 50001,50014,51014 (50001 = ICM HTTPS;
           50014 = sapstartsrv HTTPS instance 00;
           51014 = sapstartsrv HTTPS instance 10).
           Windows collector CH-STA-P-LMCO02. Set {$SAP.CERT.HOST}
           to the FQDN (e.g. ch-sta-p-me05.sensirion.lokal). system.categories SAP,PCoIP —
           PCoIP is Horizon/Teradici, not a SAP KPI.

        me05 LM Alerting tree (Windows + SSL + NoData only):
        CPU, CPU Cores, Disks, DotNet, File Server, Host Status, Interfaces, Memory and Processes, Memory Stats, Microsoft_Defender_for_Endpoint_2019, NoDataMonitoring, Ping, SSL Certificate Expiration, TCP stats, Terminal Services, Time Offset, UDP stats.
        NoDataMonitoring is the !tlist Groovy. Do not hunt Promonitor /
        C_PROMONITOR on this host card. Look at as02 / as01 (Windows
        ME), not SH01 (Linux HANA). Do not add Defender / DotNet / File Server
        / Terminal Services here (Windows by agent or a later estate pack).

        SNMP SAPUSER on the CG is unused here until a Windows SNMP walk
        proves it. Do not poll Linux Net-SNMP OIDs on these hosts.

        Ungrouped LM DataSource_batchscript.powershell is the Windows ME vehicle,
        replaced by the PowerShell sapcontrol snippet. Do not execute collector
        scripts on the Zabbix proxy. Does not invent a Promonitor API.

        Operator notes: zabbix/templates/sap_sensirion/SAPCONTROL.md.
        Refresh with configure_nbxsync_network.py --apply-sap.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$SAP.APP.CONTROL}'
          value: 0
          description: '1 enables sapcontrol heartbeat and threshold triggers. 0 = collect-first until the Host Agent UserParameter is installed and quiet.'
        - macro: '{$SAP.INSTANCE}'
          value: ''
          description: 'sapstartsrv instance number (00). Empty = saphostctrl ListInstances, then 00/01/02.'
        - macro: '{$SAP.SID}'
          value: ''
          description: 'SAP SID filter for ListInstances (HDB, MEP). Empty = every instance on the host.'
        - macro: '{$SAP.CONTROL.HOST}'
          value: ''
          description: 'sapcontrol -host / SOAP peer. Empty = localhost (the agent box). Do not put a Zabbix host macro here.'
        - macro: '{$SAP.API.HOST}'
          value: ''
          description: 'ICM FQDN for HTTPS SOAP Z_GET_ST22. Empty skips ST22 and keeps CCMS. LM used system.displayname. Do not put a Zabbix host macro here.'
        - macro: '{$SAP.API.PORT}'
          value: 44301
          description: 'LM SAP Monitoring Interface HTTPS port (44301).'
        - macro: '{$SAP.API.PATH}'
          value: /abapruntimeerror
          description: 'LM ICF path /abapruntimeerror.'
        - macro: '{$SAP.API.USER}'
          value: ''
          description: 'LM property sap.api.user (often C_PROMONITOR). Empty skips ST22.'
        - macro: '{$SAP.API.PASS}'
          value: ''
          description: 'LM property sap.api.pass. Use a Zabbix secret macro. Never commit the value.'
        - macro: '{$SAP.APP.ABAP.MAX}'
          value: 0
          description: 'ABAP runtime-error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.IDOC.MAX}'
          value: 0
          description: 'IDoc error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.JOB.MAX}'
          value: 0
          description: 'Job alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.LOCKS.MAX}'
          value: 0
          description: 'Lock-entry count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.IN.MAX}'
          value: 0
          description: 'qRFC inbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.OUT.MAX}'
          value: 0
          description: 'qRFC outbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SPOOL.MAX}'
          value: 0
          description: 'Spool error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SYSLOG.MAX}'
          value: 0
          description: 'Syslog alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.TRFC.MAX}'
          value: 0
          description: 'Transactional RFC error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.UPDATE.MAX}'
          value: 0
          description: 'Update-request count Warning when CONTROL=1.'
        - macro: '{$SAP.CERT.HOST}'
          value: ''
          description: 'TLS peer the Zabbix agent dials. Empty stays silent (CHECK_NOT_SUPPORTED). Set per host, e.g. the ICM FQDN.'
        - macro: '{$SAP.CERT.PORT}'
          value: 50001
          description: 'AS Java HTTPS (5NN01). LM ssl.ports on ch-sta-p-me05: 50001,50014,51014. 50014/51014 are sapstartsrv HTTPS (instances 00 and 10). Override per host if needed.'
        - macro: '{$SAP.CERT.SNI}'
          value: ''
          description: 'SNI. Leave empty to send {$SAP.CERT.HOST}.'
        - macro: '{$SAP.CERT.CONTROL}'
          value: 0
          description: '1 enables certificate expiry triggers after {$SAP.CERT.HOST} is set. 0 = collect-first.'
        - macro: '{$SAP.CERT.WARN}'
          value: 30d
          description: 'Warn this long before the leaf certificate expires.'
        - macro: '{$SAP.PORT.TCP}'
          value: 50001
          description: 'LM Port / first ssl.ports entry (AS Java HTTPS). SIMPLE from the assigned proxy. Override to 50014 or 51014 for sapstartsrv. CONTROL=0 because extra instances are host-specific.'
        - macro: '{$SAP.PORT.CONTROL}'
          value: 0
          description: '1 tickets when the TCP port is down. 0 = collect-first (LM Port was often unused).'
      items:
        - uuid: f60f92a59d1543e58c4e3857ebc340ba
          name: SAP Control JSON
          type: ZABBIX_PASSIVE
          key: 'sap.sensirion[json,{$SAP.INSTANCE},{$SAP.SID},{$SAP.CONTROL.HOST},{$SAP.API.HOST},{$SAP.API.PORT},{$SAP.API.PATH},{$SAP.API.USER},{$SAP.API.PASS}]'
          delay: 1m
          value_type: TEXT
          history: 7d
          trends: '0'
          description: |
            One sapcontrol snapshot from the Windows Zabbix agent already on SAP Agent+SNMP. UserParameter sap.sensirion[*] runs sap_sensirion.ps1 (Host Agent C:\Program Files\SAP\hostctrl\exe\sapcontrol.exe, then SOAP 5NN13). Empty {$SAP.INSTANCE} / {$SAP.SID} uses ListInstances. Missing UserParameter stays silent (CHECK_NOT_SUPPORTED).
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '{}'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{}'
          tags:
            - tag: component
              value: sap-application
        - uuid: d8e5c218ba484c748f24c836a043555b
