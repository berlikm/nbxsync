        - uuid: c9dd5218afd2470aba4ab9976d70bd66
          name: TLS certificate JSON
          type: ZABBIX_PASSIVE
          key: 'web.certificate.get[{$SAP.CERT.HOST},{$SAP.CERT.PORT},{$SAP.CERT.SNI}]'
          delay: 1h
          value_type: TEXT
          history: 7d
          trends: '0'
          description: |
            LM SSL Certificate Expiration. Zabbix agent on the SAP host (Agent :10050 already on SAP Agent+SNMP). Set {$SAP.CERT.HOST} to the ICM/HTTPS name. Empty host is caught so the item does not inflate unsupported count.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '{}'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{}'
          tags:
            - tag: component
              value: certificate
        - uuid: eb3e120d6d3f41ca8c13a7ac53d969de
          name: TLS certificate not after
          type: DEPENDENT
          key: sap.host.cert.not_after
          delay: '0'
          value_type: UNSIGNED
          units: unixtime
          description: $.x509.not_after from the agent certificate JSON.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.x509.not_after'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'web.certificate.get[{$SAP.CERT.HOST},{$SAP.CERT.PORT},{$SAP.CERT.SNI}]'
          tags:
            - tag: component
              value: certificate
          triggers:
            - uuid: 611b44945c39450fabe3c658cc1d465a
              expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP template from Sensirion/sap.host.cert.not_after)>0 and last(/SAP template from Sensirion/sap.host.cert.not_after)<=now()'
              name: 'SAP host: TLS certificate expired'
              event_name: 'SAP host: TLS certificate expired'
              priority: AVERAGE
              description: |
                Set {$SAP.CERT.HOST} and {$SAP.CERT.CONTROL}=1. Agent check, not Promonitor.
              tags:
                - tag: scope
                  value: availability
            - uuid: ca554d57735742879425964c4f122280
              expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP template from Sensirion/sap.host.cert.not_after)>now() and last(/SAP template from Sensirion/sap.host.cert.not_after)-now()<{$SAP.CERT.WARN}'
              name: 'SAP host: TLS certificate expires soon'
              event_name: 'SAP host: TLS certificate expires soon'
              priority: WARNING
              description: |
                Renew the leaf certificate before {$SAP.CERT.WARN}.
              dependencies:
                - name: 'SAP host: TLS certificate expired'
                  expression: '{$SAP.CERT.CONTROL}=1 and last(/SAP template from Sensirion/sap.host.cert.not_after)>0 and last(/SAP template from Sensirion/sap.host.cert.not_after)<=now()'
              tags:
                - tag: scope
                  value: availability
        - uuid: a5e2209d1c0345c9b539508e7112b66c
          name: TLS certificate days remaining
          type: CALCULATED
          key: sap.host.cert.days
          delay: 1h
          value_type: FLOAT
          units: d
          params: '(last(//sap.host.cert.not_after)>0)*(last(//sap.host.cert.not_after)-now())/86400'
          description: 0 while {$SAP.CERT.HOST} is unset.
          tags:
            - tag: component
              value: certificate
        - uuid: 924022241e8b4fff8bed5e27dc8c5a60
          name: TCP port
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$SAP.PORT.TCP}]'
          delay: 1m
          description: |
            LM Port. SIMPLE from the assigned proxy to the host interface (no connection macro in the key). Default 443 next to the certificate check. CONTROL=0 because the LM Port row was often unused.
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 42e79dca00bb48a683f8d297fa9abdb9
              expression: '{$SAP.PORT.CONTROL}=1 and max(/SAP template from Sensirion/net.tcp.service[tcp,,{$SAP.PORT.TCP}],#3)=0'
              name: 'SAP host: TCP port is down'
              event_name: 'SAP host: TCP port is down'
              priority: AVERAGE
              description: |
                Not ICMP. ICMP High stays on the SAP Agent+SNMP CG.
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 53957a36a6a740e88f9b8d7273d959b6
          name: Network interfaces
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: sap.host.net.if.discovery
          delay: 1h
          description: IF-MIB ifTable from the SH01 probe. 64-bit ifXTable octet counters (LM Interfaces 64 bit). Drops lo.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: A
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
          item_prototypes:
            - uuid: 9be2bc3f3c1a4928b3f512557ee9a5f5
              name: 'Interface {#IFDESCR}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'sap.host.net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              trends: '0'
              valuemap:
                name: IF-MIB::ifStatus
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
              trigger_prototypes:
                - uuid: 5be24f4f90774562a613e2d99fd00a4a
                  expression: '{$IFCONTROL:"{#IFDESCR}"}=1 and min(/SAP template from Sensirion/sap.host.net.if.status[ifOperStatus.{#SNMPINDEX}],#3)<>1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/SAP template from Sensirion/sap.host.net.if.status[ifOperStatus.{#SNMPINDEX}])=1 or {$IFCONTROL:"{#IFDESCR}"}=0'
                  name: 'SAP host: Interface {#IFDESCR}: Link down'
                  priority: AVERAGE
                  description: Host NIC, not SAP RFC. Mute with {$IFCONTROL:"eth0"}=0.
                  dependencies:
                    - name: 'SAP host: No SNMP data collection'
                      expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 540056b309ca428991c3b2c33e3f8972
              name: 'Interface {#IFDESCR}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'sap.host.net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
            - uuid: 7539e66a9af34d08b1c047c272813d27
              name: 'Interface {#IFDESCR}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'sap.host.net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
            - uuid: 82bf52936bde4f77b74c7a21e28b363d
              name: 'Interface {#IFDESCR}: In errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'sap.host.net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: eps
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
              trigger_prototypes:
                - uuid: 5d7eb2aa3a9e4bf6bb92b2d68a550c59
                  expression: 'min(/SAP template from Sensirion/sap.host.net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)+min(/SAP template from Sensirion/sap.host.net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$SAP.NET.IF.ERRORS.WARN}'
                  name: 'SAP host: Interface {#IFDESCR}: High error rate'
                  priority: WARNING
                  dependencies:
                    - name: 'SAP host: No SNMP data collection'
                      expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
                  tags:
                    - tag: scope
                      value: performance
            - uuid: eb64aac77ba04059ba02862dd1211791
              name: 'Interface {#IFDESCR}: Out errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'sap.host.net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: eps
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
          graph_prototypes:
            - uuid: 6adabcd43534448aa4541fcbba1dc31b
              name: 'Interface {#IFDESCR}: Traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: SAP template from Sensirion
                    key: 'sap.host.net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: SAP template from Sensirion
                    key: 'sap.host.net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
        - uuid: 464baba7ba83485a938e28e211416ad8
          name: Filesystems
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FSNAME},1.3.6.1.2.1.25.2.3.1.3,{#FSTYPE},1.3.6.1.2.1.25.2.3.1.2]'
          key: sap.host.vfs.fs.discovery
          delay: 1h
          description: HOST-RESOURCES fixed disks. Memory/swap stay on UCD scalars.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.MATCHES}'
                formulaid: A
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.MATCHES}'
                formulaid: C
          item_prototypes:
            - uuid: 5cbbfecda9d541368352f1c5ff6aa55d
              name: 'Filesystem {#FSNAME}: Total blocks'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}'
              key: 'sap.host.vfs.fs.size[{#SNMPINDEX},total]'
              delay: 5m
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: 600188b6082a42e290763729743c7cb3
              name: 'Filesystem {#FSNAME}: Used blocks'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}'
              key: 'sap.host.vfs.fs.size[{#SNMPINDEX},used]'
              delay: 5m
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: d718ae629d01410abcba45ec3b4e77f7
              name: 'Filesystem {#FSNAME}: Used %'
              type: CALCULATED
              key: 'sap.host.vfs.fs.pused[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: "%"
              params: '(last(//sap.host.vfs.fs.size[{#SNMPINDEX},total])>0)*100*last(//sap.host.vfs.fs.size[{#SNMPINDEX},used])/(last(//sap.host.vfs.fs.size[{#SNMPINDEX},total])+(last(//sap.host.vfs.fs.size[{#SNMPINDEX},total])=0))'
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
              trigger_prototypes:
                - uuid: a1c4eb5a25cc446ba719f791b6d8e963
                  expression: min(/SAP template from Sensirion/sap.host.vfs.fs.pused[{#SNMPINDEX}],15m)>{$SAP.VFS.FS.PUSED.MAX}
                  name: 'SAP host: File system {#FSNAME}: Disk space is low'
                  priority: WARNING
                  dependencies:
                    - name: 'SAP host: No SNMP data collection'
                      expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
                  tags:
                    - tag: scope
                      value: capacity
          graph_prototypes:
            - uuid: b5babe45c30047f5b49232c4c77750dc
