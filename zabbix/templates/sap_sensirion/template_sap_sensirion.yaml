zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7c4e2b91a06f4d8e9b15c3a8d0e4f217
      name: Templates/Applications
  templates:
    - uuid: 9544cd1cb6824e23950e991bd9cb593c
      template: SAP template from Sensirion
      name: SAP template from Sensirion
      description: |
        Sensirion SAP HANA pack (openSUSE). LogicMonitor parity from
        zabbix/logicmonitor-assessment.md plus the 2026-09-05 SNMP probe of CH-STA-P-SH01.

        This template is SAP HANA application only (11 LM SAP hosts
        included HANA + ME). SAP ME is Windows — see SAP ME from Sensirion.
        Do not link this YAML on role SAP ME.

        1. Host / OS — stock Linux SNMP OS template on role SAP HANA (CPU cores,
           disk IO, filesystems, RAM, NICs). Transport is CG SAP Agent+SNMP
           (SAPUSER MD5/DES), not the snmp-tag Linux CG. There is no
           official openSUSE template. Do not attach Linux by Zabbix agent —
           the HANA appliance may not take an agent. This YAML does not poll
           UCD / IF-MIB / HOST-RESOURCES (those keys live on the OS template).
           IP-MIB / TCP-UDP stay omitted until an agent exists. Probe of
           CH-STA-P-SH01 (10.0.105.112) proved Linux Net-SNMP only
           (1.3.6.1.4.1.8072.3.2.10). Host CPU/RAM is not HANA allocation.

        2. Application — ST22 / sapcontrol. The LM C_PROMONITOR names
           via local sapcontrol (Linux Zabbix agent UserParameter, Host Agent
           /usr/sap/hostctrl) only if an agent is installed later. GetProcessList
           = hdb* GREEN/YELLOW. GetAlerts CCMS counts stay 0 on a HANA-only box
           (not HANA SQL). {$SAP.APP.CONTROL}=0 until the UserParameter is
           installed. SH01 Alerting tree has one SAP row: ABAPRuntimeErrorsCount_LMS. LM
           system.displayname is ch-sta-p-sh01.sensirion.lokal (openSUSE). The PowerShell ran
           on an LM collector *against* that Linux FQDN
           https://ch-sta-p-sh01.sensirion.lokal:44301/abapruntimeerror
           (Z_GET_ST22, sap.api.user / sap.api.pass). --apply-sap writes the URL
           macros on device CH-STA-P-SH01 only — not role SAP HANA, not ME.
           User/pass stay operator secrets. The LMS Groovy that counts
           LogicMonitor alerts is not ported.

        3. Certificate — agent web.certificate.get when an agent exists. Set
           {$SAP.CERT.HOST}. {$SAP.CERT.CONTROL}=0 until then.

        Ping stays on SAP Agent+SNMP ICMP. --apply-sap turns off ping items on
        the OS template so they do not collide with the CG. LM OS rows on SH01
        were Linux SNMP (SAPUSER), not a host agent. ABAP is
        ABAPRuntimeErrorsCount_LMS on CH-STA-P-SH01 only.

        Ungrouped LM DataSource_* are collector methods. Groovy/batch is retired.
        Do not execute collector scripts on the Zabbix proxy.

        jstart lives on the Windows ME template (ch-sta-p-as02, ch-sta-d-as01, ch-sta-p-me05).
        Does not invent a Promonitor API.

        Operator notes: zabbix/notes/sap-snmp-walk.md,
        zabbix/templates/sap_sensirion/SAPCONTROL.md.
        Refresh with configure_nbxsync_network.py --apply-sap.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$SAP.APP.CONTROL}'
          value: 0
          description: '1 enables sapcontrol heartbeat and threshold triggers. 0 = collect-first until the Host Agent UserParameter is installed and quiet.'
        - macro: '{$SAP.INSTANCE}'
          value: ''
          description: 'sapstartsrv instance number (00). Empty = saphostctrl ListInstances, then 00/01/02.'
        - macro: '{$SAP.SID}'
          value: ''
          description: 'SAP SID filter for ListInstances (HDB, MEP). Empty = every instance on the host.'
        - macro: '{$SAP.CONTROL.HOST}'
          value: ''
          description: 'sapcontrol -host / SOAP peer. Empty = localhost (the agent box). Do not put a Zabbix host macro here.'
        - macro: '{$SAP.API.HOST}'
          value: ''
          description: 'Empty on this template. --apply-sap sets ch-sta-p-sh01.sensirion.lokal on device CH-STA-P-SH01 only. Empty skips ST22.'
        - macro: '{$SAP.API.PORT}'
          value: 44301
          description: 'LM SAP Monitoring Interface HTTPS port (44301).'
        - macro: '{$SAP.API.PATH}'
          value: /abapruntimeerror
          description: 'LM ICF path /abapruntimeerror.'
        - macro: '{$SAP.API.USER}'
          value: ''
          description: 'LM property sap.api.user (often C_PROMONITOR). Empty skips ST22.'
        - macro: '{$SAP.API.PASS}'
          value: ''
          description: 'LM property sap.api.pass. Use a Zabbix secret macro. Never commit the value.'
        - macro: '{$SAP.APP.ABAP.MAX}'
          value: 0
          description: 'ABAP runtime-error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.IDOC.MAX}'
          value: 0
          description: 'IDoc error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.JOB.MAX}'
          value: 0
          description: 'Job alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.LOCKS.MAX}'
          value: 0
          description: 'Lock-entry count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.IN.MAX}'
          value: 0
          description: 'qRFC inbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.OUT.MAX}'
          value: 0
          description: 'qRFC outbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SPOOL.MAX}'
          value: 0
          description: 'Spool error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SYSLOG.MAX}'
          value: 0
          description: 'Syslog alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.TRFC.MAX}'
          value: 0
          description: 'Transactional RFC error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.UPDATE.MAX}'
          value: 0
          description: 'Update-request count Warning when CONTROL=1.'
        - macro: '{$SAP.CERT.HOST}'
          value: ''
          description: 'TLS peer the Zabbix agent dials. Empty stays silent (CHECK_NOT_SUPPORTED). Set per host, e.g. the ICM FQDN.'
        - macro: '{$SAP.CERT.PORT}'
          value: 443
          description: 'TLS port for web.certificate.get. LM SSL Certificate Expiration.'
        - macro: '{$SAP.CERT.SNI}'
          value: ''
          description: 'SNI. Leave empty to send {$SAP.CERT.HOST}.'
        - macro: '{$SAP.CERT.CONTROL}'
          value: 0
          description: '1 enables certificate expiry triggers after {$SAP.CERT.HOST} is set. 0 = collect-first.'
        - macro: '{$SAP.CERT.WARN}'
          value: 30d
          description: 'Warn this long before the leaf certificate expires.'
        - macro: '{$SAP.PORT.TCP}'
          value: 443
          description: 'LM Port check. SIMPLE from the assigned proxy to the host interface.'
        - macro: '{$SAP.PORT.CONTROL}'
          value: 0
          description: '1 tickets when the TCP port is down. 0 = collect-first (LM Port was often unused).'
      items:
        - uuid: 16daa2a2d41a4dd89254fa610a853ae8
          name: SAP Control JSON
          type: ZABBIX_PASSIVE
          key: 'sap.sensirion[json,{$SAP.INSTANCE},{$SAP.SID},{$SAP.CONTROL.HOST},{$SAP.API.HOST},{$SAP.API.PORT},{$SAP.API.PATH},{$SAP.API.USER},{$SAP.API.PASS}]'
          delay: 1m
          value_type: TEXT
          history: 7d
          trends: '0'
          description: |
            One sapcontrol snapshot from the Linux Zabbix agent already on SAP Agent+SNMP. UserParameter sap.sensirion[*] runs zabbix/externalscripts/sap_sensirion.py on the openSUSE HANA host ch-sta-p-sh01.sensirion.lokal (Host Agent /usr/sap/hostctrl, then SOAP 5NN13). Empty {$SAP.INSTANCE} / {$SAP.SID} is fine on a single-instance HANA box. Z_GET_ST22 uses LM system.displayname ch-sta-p-sh01.sensirion.lokal:44301/abapruntimeerror when API macros are set. Missing UserParameter stays silent (CHECK_NOT_SUPPORTED).
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '{}'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{}'
          tags:
            - tag: component
              value: sap-application
        - uuid: 347c6efd3ef144bd9990e2053f5c1e9c
          name: SAP Control heartbeat
          type: DEPENDENT
          key: sap.app.promonitor
          delay: '0'
          description: |
            LM SAP / C_PROMONITOR session replacement. 1 when local sapcontrol answers. Not a Promonitor API.
            JSONPath from the sapcontrol master. Not SNMP.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.promonitor'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'sap.sensirion[json,{$SAP.INSTANCE},{$SAP.SID},{$SAP.CONTROL.HOST},{$SAP.API.HOST},{$SAP.API.PORT},{$SAP.API.PATH},{$SAP.API.USER},{$SAP.API.PASS}]'
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: 51e0cbed287042689e513c5af1194cd9
              expression: '{$SAP.APP.CONTROL}=1 and (nodata(/SAP template from Sensirion/sap.app.promonitor,30m)=1 or last(/SAP template from Sensirion/sap.app.promonitor)=0)'
              name: 'SAP application: sapcontrol is down'
              event_name: 'SAP application: sapcontrol is down'
              priority: WARNING
              description: |
                CONTROL=1 after the Host Agent UserParameter works. Default 0 so a missing script does not page. last=0 covers CHECK_NOT_SUPPORTED; nodata covers a dead agent.
              tags:
                - tag: scope
                  value: availability
        - uuid: c83515ef4cc84a0fa38511994113f975
          name: Application server instance status
          type: DEPENDENT
          key: sap.app.instance.status
          delay: '0'
          description: |
            LM Application Server Instance Status. sapcontrol GetProcessList: HANA hdb* / ABAP disp+work / ME jstart GREEN or YELLOW = 1.
            JSONPath from the sapcontrol master. Not SNMP.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.instance_status'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'sap.sensirion[json,{$SAP.INSTANCE},{$SAP.SID},{$SAP.CONTROL.HOST},{$SAP.API.HOST},{$SAP.API.PORT},{$SAP.API.PATH},{$SAP.API.USER},{$SAP.API.PASS}]'
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: df7a5ff44ffb4440bcde8e5ee326c0b7
