zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7c4e2b91a06f4d8e9b15c3a8d0e4f217
      name: Templates/Applications
  templates:
    - uuid: 9544cd1cb6824e23950e991bd9cb593c
      template: SAP template from Sensirion
      name: SAP template from Sensirion
      description: |
        Sensirion SAP pack. LogicMonitor parity from zabbix/logicmonitor-assessment.md
        (LM account export Aug 2026) plus the 2026-09-05 SNMP probe of CH-STA-P-SH01.

        LM had two planes — this template covers both, without inventing a Promonitor API:

        1. Host / SNMP — LM group credential SAPUSER (MD5/DES) on SAP systems.
           Probe of CH-STA-P-SH01 (10.0.105.112) proved Linux Net-SNMP only
           (1.3.6.1.4.1.8072.3.2.10). The SAP enterprise tree and
           Net-SNMP extend were empty. Items here are IF-MIB / UCD / HOST-RESOURCES.

        2. Application — LM Promonitor / C_PROMONITOR on 11 SAP
           hosts: ABAP runtime errors, AS instance status, IDoc, job alerts, lock
           entries, qRFC in/out, RFC status, spool, syslog, transactional RFC,
           update requests. DNUS scripts (Robert) own that contract. Trapper keys
           only. {$SAP.APP.CONTROL}=0 until DNUS pushes values.

        3. Certificate — LM SSL Certificate Expiration via the Zabbix agent already
           on SAP Agent+SNMP (not a proxy external script). Set {$SAP.CERT.HOST}
           per host, then {$SAP.CERT.CONTROL}=1.

        Host OS extras LM also had (CPU cores, disks IO, IP/TCP/UDP stats, ping)
        stay on Linux by agent + the SAP Agent+SNMP ICMP item. This pack does not
        nest ICMP or duplicate those agent keys.

        Not in this template: AS Java jstart process stats (ch-sta-p-as02 /
        ch-sta-d-as01) — that is the AS Java agent stub, not SAP HANA / SAP ME.
        Does not link the stock Linux SNMP template. Does not walk the enterprise
        tree unbounded.

        Operator notes: zabbix/notes/sap-snmp-walk.md,
        zabbix/templates/sap_sensirion/LM_PARITY.md.
        Refresh with configure_nbxsync_network.py --apply-sap.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'SNMP availability trigger window.'
        - macro: '{$UNSUPPORTED.MAX}'
          value: 1
          description: 'Average when unsupported SNMP items stay above this for 30m.'
        - macro: '{$SAP.MEMORY.UTIL.MAX}'
          value: 101
          description: 'Host RAM used % Warning. 101 collects first.'
        - macro: '{$SAP.CPU.UTIL.MAX}'
          value: 101
          description: 'Host CPU used % Warning. 101 collects first.'
        - macro: '{$SAP.CPU.LOAD.MAX}'
          value: 101
          description: '15-minute load Warning. 101 collects first.'
        - macro: '{$SAP.SWAP.UTIL.MAX}'
          value: 101
          description: 'Swap used % Warning. 101 collects first.'
        - macro: '{$SAP.VFS.FS.PUSED.MAX}'
          value: 101
          description: 'Filesystem used % Warning. 101 collects first.'
        - macro: '{$SAP.NET.IF.ERRORS.WARN}'
          value: 2
          description: 'IF-MIB in+out errors/s Warning.'
        - macro: '{$IFCONTROL}'
          value: 1
          description: '1 tickets admin-up link-down. {$IFCONTROL:"eth0"}=0 mutes one NIC.'
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: ^.+$
          description: 'Interface LLD include.'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: '^(?i)(lo|loopback)(.*)$'
          description: 'Drop loopback. SH01 probe saw lo + eth0.'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: ^24$
          description: 'Drop softwareLoopback(24).'
        - macro: '{$VFS.FS.FSNAME.MATCHES}'
          value: ^.+$
          description: 'Filesystem LLD include.'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: '^(?i)(physical memory|virtual memory|memory buffers|cached memory|swap|/dev|/sys|/run|/proc).*$'
          description: 'Keep mounted disks; UCD memory is scalars, not this LLD.'
        - macro: '{$VFS.FS.FSTYPE.MATCHES}'
          value: '^(\.iso\.org\.dod\.internet\.mgmt\.mib-2\.host\.hrStorage\.hrStorageTypes\.hrStorageFixedDisk|1\.3\.6\.1\.2\.1\.25\.2\.1\.4)$'
          description: 'hrStorageFixedDisk only.'
        - macro: '{$SAP.APP.CONTROL}'
          value: 0
          description: '1 enables Promonitor/DNUS nodata and threshold triggers. 0 = collect-first (LM application gap).'
        - macro: '{$SAP.APP.ABAP.MAX}'
          value: 0
          description: 'ABAP runtime-error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.IDOC.MAX}'
          value: 0
          description: 'IDoc error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.JOB.MAX}'
          value: 0
          description: 'Job alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.LOCKS.MAX}'
          value: 0
          description: 'Lock-entry count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.IN.MAX}'
          value: 0
          description: 'qRFC inbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.QRFC.OUT.MAX}'
          value: 0
          description: 'qRFC outbound queue Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SPOOL.MAX}'
          value: 0
          description: 'Spool error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.SYSLOG.MAX}'
          value: 0
          description: 'Syslog alert count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.TRFC.MAX}'
          value: 0
          description: 'Transactional RFC error count Warning when CONTROL=1.'
        - macro: '{$SAP.APP.UPDATE.MAX}'
          value: 0
          description: 'Update-request count Warning when CONTROL=1.'
        - macro: '{$SAP.CERT.HOST}'
          value: ''
          description: 'TLS peer the Zabbix agent dials. Empty stays silent (CHECK_NOT_SUPPORTED). Set per host, e.g. the ICM FQDN.'
        - macro: '{$SAP.CERT.PORT}'
          value: 443
          description: 'TLS port for web.certificate.get. LM SSL Certificate Expiration.'
        - macro: '{$SAP.CERT.SNI}'
          value: ''
          description: 'SNI. Leave empty to send {$SAP.CERT.HOST}.'
        - macro: '{$SAP.CERT.CONTROL}'
          value: 0
          description: '1 enables certificate expiry triggers after {$SAP.CERT.HOST} is set. 0 = collect-first.'
        - macro: '{$SAP.CERT.WARN}'
          value: 30d
          description: 'Warn this long before the leaf certificate expires.'
        - macro: '{$SAP.PORT.TCP}'
          value: 443
          description: 'LM Port check. SIMPLE from the assigned proxy to the host interface.'
        - macro: '{$SAP.PORT.CONTROL}'
          value: 0
          description: '1 tickets when the TCP port is down. 0 = collect-first (LM Port was often unused).'
      items:
        - uuid: 1506a7f0938d4c10bf852ce79b75e318
          name: SNMP agent availability
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            LM SAPUSER plane. 0/1/2. ICMP High from the SAP Agent+SNMP CG pages if the box is gone.
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: f1fc151e23514db3a887f559bcf29046
              expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              name: 'SAP host: No SNMP data collection'
              event_name: 'SAP host: No SNMP data collection'
              priority: WARNING
              description: |
                SNMP SAPUSER MD5/DES failed from the assigned proxy. Host infra, not an ABAP dump. Canary CH-STA-P-SH01.
              tags:
                - tag: scope
                  value: availability
        - uuid: 33f768c932e84f62b492dfeb2b85e419
          name: Unsupported item count
          type: INTERNAL
          key: 'zabbix[host,,items_unsupported]'
          delay: 15m
          description: Watch the watcher for the SNMP plane only. Trapper application items do not go unsupported.
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 8c535db7246e43e9b56521f85e86a1fe
              expression: min(/SAP template from Sensirion/zabbix[host,,items_unsupported],30m)>{$UNSUPPORTED.MAX}
              name: 'SAP host: Too many unsupported items'
              event_name: 'SAP host: Too many unsupported items'
              priority: AVERAGE
              description: SNMP=1 but host items unsupported — OID/view mismatch.
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: availability
        - uuid: 700c48e0f2d5466d849c6e3a13235a96
          name: SNMP
          type: CALCULATED
          key: sap.host.snmp.available
          delay: 1m
          value_type: FLOAT
          params: 'last(//zabbix[host,snmp,available])'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
        - uuid: 39c333f619e64062a9339f0a22c58796
          name: System name
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 3ee1550ab88d430b8affbde3a2cfabb3
              expression: last(/SAP template from Sensirion/system.name,#1)<>last(/SAP template from Sensirion/system.name,#2) and length(last(/SAP template from Sensirion/system.name))>0
              name: 'SAP host: System name has changed'
              event_name: 'SAP host: System name has changed'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 3eacdb1840804374bd72ad59e3a2807a
          name: System description
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          inventory_link: TYPE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: db9da0e48f374500a096ad2dc31fb1a1
          name: System object ID
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'system.objectid[sysObjectID.0]'
          delay: 1h
          value_type: CHAR
          history: 7d
          trends: '0'
          description: CH-STA-P-SH01 is Linux Net-SNMP 1.3.6.1.4.1.8072.3.2.10.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 537d8d26e7ef4b7794ad08f1902f708a
          name: Linux Net-SNMP identity
          type: DEPENDENT
          key: sap.host.netsnmp
          delay: '0'
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          valuemap:
            name: SAP host identity
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                    var oid = String(value || '').replace(/^\\.+/, '');
                    var expect = '1.3.6.1.4.1.8072.3.2.10';
                    return oid === expect || oid === "." + expect ? 1 : 0;

          master_item:
            key: 'system.objectid[sysObjectID.0]'
          tags:
            - tag: component
              value: system
        - uuid: 6cc011530a7b41ea975435adce362b2f
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 1m
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 484890c3aae3408e9eba43fe5665d53d
              expression: last(/SAP template from Sensirion/system.net.uptime[sysUpTime.0])>0 and last(/SAP template from Sensirion/system.net.uptime[sysUpTime.0])<10m
              name: 'SAP host: Host has been restarted'
              event_name: 'SAP host: Host has been restarted'
              priority: INFO
              manual_close: 'YES'
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: notice
        - uuid: 67b2d8ef6bf240fd85d7285d23c88030
          name: Load average (1m)
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.10.1.3.1
          key: 'sap.host.load[1m]'
          delay: 1m
          value_type: FLOAT
          description: UCD laLoad. Host infra, not SAP dialog response time.
          tags:
            - tag: component
              value: os
        - uuid: d8d4c740db924a11ba22465bca96a761
          name: Load average (5m)
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.10.1.3.2
          key: 'sap.host.load[5m]'
          delay: 1m
          value_type: FLOAT
          description: UCD laLoad. Host infra, not SAP dialog response time.
          tags:
            - tag: component
              value: os
        - uuid: 2da2bc19070542bca382a92d91a0485f
          name: Load average (15m)
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.10.1.3.3
          key: 'sap.host.load[15m]'
          delay: 1m
          value_type: FLOAT
          description: UCD laLoad. Host infra, not SAP dialog response time.
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: 0c38ed623b2442a58c0217d7dd022ac4
              expression: min(/SAP template from Sensirion/sap.host.load[15m],15m)>{$SAP.CPU.LOAD.MAX}
              name: 'SAP host: Load average is high'
              event_name: 'SAP host: Load average is high'
              priority: WARNING
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: performance
        - uuid: 7971cbead7e94afaa31399c9d5692d91
          name: CPU idle
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.11.11.0
          key: sap.host.cpu.idle
          delay: 1m
          units: "%"
          tags:
            - tag: component
              value: os
        - uuid: 7e742c1e0ae94d3599ff0177fc1f58ec
          name: CPU utilization
          type: CALCULATED
          key: sap.host.cpu.util
          delay: 1m
          value_type: FLOAT
          units: "%"
          params: '100-last(//sap.host.cpu.idle)'
          description: 100 − UCD ssCpuIdle. Not ST06 SAP CPU.
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: b9aface2a1bb4a808b1789b06e535f68
              expression: min(/SAP template from Sensirion/sap.host.cpu.util,15m)>{$SAP.CPU.UTIL.MAX}
              name: 'SAP host: CPU utilization is high'
              event_name: 'SAP host: CPU utilization is high'
              priority: WARNING
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: performance
        - uuid: 63eb31232f0c4064b60391ce28b4676f
          name: Memory total
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.5.0
          key: sap.host.memory.total
          delay: 1m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: os
        - uuid: caabe8efbf584f108ada503bcee75ea7
          name: Memory available
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.6.0
          key: sap.host.memory.avail
          delay: 1m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: os
        - uuid: eda055318dd94cc9b01db60978acb5d4
          name: Swap total
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.3.0
          key: sap.host.swap.total
          delay: 1m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: os
        - uuid: 3a8f1414be084c1fb451a6777fe16419
          name: Swap available
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.4.0
          key: sap.host.swap.avail
          delay: 1m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: os
        - uuid: b26a41b7c2a2439e8e1c113402b2f2c4
          name: Memory utilization
          type: CALCULATED
          key: sap.host.memory.pused
          delay: 1m
          value_type: FLOAT
          units: "%"
          params: '(last(//sap.host.memory.total)>0)*100*(last(//sap.host.memory.total)-last(//sap.host.memory.avail))/(last(//sap.host.memory.total)+(last(//sap.host.memory.total)=0))'
          description: Host RAM (total−avail)/total. Not HANA allocation.
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: 3180022d06fc43a486f54781b1e99f97
              expression: min(/SAP template from Sensirion/sap.host.memory.pused,15m)>{$SAP.MEMORY.UTIL.MAX}
              name: 'SAP host: Memory utilization is high'
              event_name: 'SAP host: Memory utilization is high'
              priority: WARNING
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: performance
        - uuid: 5176d22144bb438db713e484ac175b31
          name: Swap utilization
          type: CALCULATED
          key: sap.host.swap.pused
          delay: 1m
          value_type: FLOAT
          units: "%"
          params: '(last(//sap.host.swap.total)>0)*100*(last(//sap.host.swap.total)-last(//sap.host.swap.avail))/(last(//sap.host.swap.total)+(last(//sap.host.swap.total)=0))'
          description: 0 when the host has no swap.
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: 3ac3a0e980794bbba3f2534919482ddd
              expression: min(/SAP template from Sensirion/sap.host.swap.pused,15m)>{$SAP.SWAP.UTIL.MAX}
              name: 'SAP host: Swap utilization is high'
              event_name: 'SAP host: Swap utilization is high'
              priority: WARNING
              dependencies:
                - name: 'SAP host: No SNMP data collection'
                  expression: max(/SAP template from Sensirion/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
              tags:
                - tag: scope
                  value: performance
        - uuid: 1a924d0f022e42808f3ca29973673df6
          name: Process count
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.1.6.0
          key: sap.host.processes
          delay: 5m
          description: hrSystemProcesses. Does not LLD disp+work or treat process names as SAP health.
          tags:
            - tag: component
              value: os
        - uuid: 347c6efd3ef144bd9990e2053f5c1e9c
          name: Promonitor / C_PROMONITOR
          type: TRAP
          key: sap.app.promonitor
          delay: 1m
          description: |
            LM SAP / C_PROMONITOR session. 1 when DNUS reports Promonitor is up on the 11 SAP hosts.
            DNUS/Robert pushes zabbix_sender to this trapper. Not SNMP. Not UserParameter until that contract exists.
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: 51e0cbed287042689e513c5af1194cd9
              expression: '{$SAP.APP.CONTROL}=1 and nodata(/SAP template from Sensirion/sap.app.promonitor,30m)=1'
              name: 'SAP application: No Promonitor/DNUS data for 30m'
              event_name: 'SAP application: No Promonitor/DNUS data for 30m'
              priority: WARNING
              description: |
                CONTROL=1 after DNUS ships. Default 0 so an empty trapper does not page.
              tags:
                - tag: scope
                  value: availability
        - uuid: c83515ef4cc84a0fa38511994113f975
          name: Application server instance status
          type: TRAP
          key: sap.app.instance.status
          delay: 1m
          description: |
            LM Application Server Instance Status. 1=up 0=down.
            DNUS/Robert pushes zabbix_sender to this trapper. Not SNMP. Not UserParameter until that contract exists.
          valuemap:
            name: Service state
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: df7a5ff44ffb4440bcde8e5ee326c0b7
              expression: '{$SAP.APP.CONTROL}=1 and last(/SAP template from Sensirion/sap.app.instance.status)=0'
              name: 'SAP application: Application server instance is down'
              event_name: 'SAP application: Application server instance is down'
              priority: AVERAGE
              description: |
                LM application datasource. Disabled while CONTROL=0. Ticket, not SMS, until a quiet baseline.
              dependencies:
                - name: 'SAP application: No Promonitor/DNUS data for 30m'
                  expression: '{$SAP.APP.CONTROL}=1 and nodata(/SAP template from Sensirion/sap.app.promonitor,30m)=1'
              tags:
                - tag: scope
                  value: sap-application
        - uuid: d1b44708d416473a87688c061012e6a0
          name: ABAP runtime errors
          type: TRAP
          key: sap.app.abap.errors
          delay: 1m
          description: |
            LM ABAP Runtime Errors. Count in the last poll.
            DNUS/Robert pushes zabbix_sender to this trapper. Not SNMP. Not UserParameter until that contract exists.
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: de8df13630c840788682aa05f23f440c
              expression: '{$SAP.APP.CONTROL}=1 and min(/SAP template from Sensirion/sap.app.abap.errors,15m)>{$SAP.APP.ABAP.MAX}'
              name: 'SAP application: ABAP runtime errors'
              event_name: 'SAP application: ABAP runtime errors'
              priority: AVERAGE
              description: |
                LM application datasource. Disabled while CONTROL=0. Ticket, not SMS, until a quiet baseline.
              dependencies:
                - name: 'SAP application: No Promonitor/DNUS data for 30m'
                  expression: '{$SAP.APP.CONTROL}=1 and nodata(/SAP template from Sensirion/sap.app.promonitor,30m)=1'
              tags:
                - tag: scope
                  value: sap-application
        - uuid: 5131a5f3e134440e8fcc2a49a5847061
          name: IDoc errors
          type: TRAP
          key: sap.app.idoc.errors
          delay: 1m
          description: |
            LM IDoc Errors.
            DNUS/Robert pushes zabbix_sender to this trapper. Not SNMP. Not UserParameter until that contract exists.
          tags:
            - tag: component
              value: sap-application
          triggers:
            - uuid: f58461bccf724880ab96434924ee6303
              expression: '{$SAP.APP.CONTROL}=1 and min(/SAP template from Sensirion/sap.app.idoc.errors,15m)>{$SAP.APP.IDOC.MAX}'
              name: 'SAP application: IDoc errors'
              event_name: 'SAP application: IDoc errors'
              priority: AVERAGE
