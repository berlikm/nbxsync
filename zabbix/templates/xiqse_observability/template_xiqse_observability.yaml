zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: d66fadb95254489ebaaa0b5eb4e6763f
      template: XIQ-SE Observability
      name: XIQ-SE Observability
      description: |
        ExtremeCloud IQ Site Engine companion. HTTPS GraphQL (OAuth client
        credentials) from the proxy. Does not nest ICMP Ping — OS/ICMP stay on
        the VM / Agent Monitoring path. Do not GraphQL Control engines. Do not
        install an agent on the OVA for this pack.

        Operator page: zabbix/07-extreme-control.md.
        Refresh with configure_nbxsync_network.py --apply-xiqse.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$XIQSE.API.FQDN}'
          value: ''
          description: 'Site Engine FQDN or IP. Platform Jinja on primary_ip4.'
        - macro: '{$XIQSE.API.PORT}'
          value: '8443'
          description: 'NBI HTTPS port.'
        - macro: '{$XIQSE.SCHEME}'
          value: 'https'
          description: 'http only for a lab break-glass.'
        - macro: '{$XIQSE.API.CLIENT.ID}'
          value: ''
          description: 'Client API Access id. Prefer a secret CG over YAML.'
        - macro: '{$XIQSE.API.CLIENT.SECRET}'
          type: SECRET_TEXT
          value: ''
          description: 'Client API Access secret.'
        - macro: '{$XIQSE.DATA.TIMEOUT}'
          value: '30s'
          description: 'Health SCRIPT timeout.'
        - macro: '{$XIQSE.LICENSE.TIMEOUT}'
          value: '60s'
          description: 'End-system / device-license SCRIPT timeout.'
        - macro: '{$XIQ.NAC.TOTAL}'
          value: '0'
          description: 'Purchased XIQ-NAC-S end-systems. 0 = graph used only.'
        - macro: '{$XIQ.NAC.USED.WARN}'
          value: '90'
          description: 'Warning percent of {$XIQ.NAC.TOTAL}.'
        - macro: '{$XIQ.NAC.ES.MAXRESULTS}'
          value: '20000'
          description: 'Stop paging at this many end-system rows.'
        - macro: '{$XIQ.NAC.ES.PAGE}'
          value: '500'
          description: 'endSystems page size.'
        - macro: '{$XIQ.NAC.FRESH}'
          value: '86400'
          description: 'Auth-event stale after this many seconds.'
        - macro: '{$XIQ.NAC.FRESH.CONTROL}'
          value: '1'
          description: 'Ticket stale auth events during business hours.'
        - macro: '{$XIQ.NAC.FRESH.TIME.START}'
          value: '070000'
          description: 'Stale-event window start (HHMMSS).'
        - macro: '{$XIQ.NAC.FRESH.TIME.END}'
          value: '190000'
          description: 'Stale-event window end (HHMMSS).'
        - macro: '{$XIQ.PILOT.TOTAL}'
          value: '0'
          description: 'Purchased Pilot seats. 0 = graph used only.'
        - macro: '{$XIQ.PILOT.REMAIN.WARN}'
          value: '2'
          description: 'Warning when remaining Pilot seats at or below this.'
        - macro: '{$XIQ.NAV.TOTAL}'
          value: '0'
          description: 'Purchased Navigator seats. 0 = graph used only.'
        - macro: '{$XIQ.NAV.REMAIN.WARN}'
          value: '2'
          description: 'Warning when remaining Navigator seats at or below this.'
        - macro: '{$XIQ.ENGINE.CONNECTED.CONTROL}'
          value: '1'
          description: 'Ticket engines with connected=0. Unknown (2) is silent.'
        - macro: '{$XIQ.ENGINE.ENFORCE.CONTROL}'
          value: '1'
          description: 'Ticket needsEnforce=1.'
        - macro: '{$XIQ.ENGINE.RADIUSD.CONTROL}'
          value: '1'
          description: 'Page FreeRADIUS disabled on an engine.'
        - macro: '{$XIQSE.CERT.CONTROL}'
          value: '1'
          description: 'Certificate Warning. Set 0 if the host has no agent.'
        - macro: '{$XIQSE.CERT.WARN}'
          value: '30'
          description: 'Days before 8443 cert expiry.'
      items:
        - uuid: d8612bcd47b44c4cb60e679df06b67bd
          name: XIQ-SE NBI health snapshot
          type: SCRIPT
          key: xiqse.nbi.health
          delay: 2m
          history: 7d
          trends: '0'
          value_type: TEXT
          params: |
            function parseAuthTime(raw) {
              if (raw === null || raw === undefined || raw === '') {
                return null;
              }
              if (typeof raw === 'number' && isFinite(raw)) {
                return raw > 0 && raw < 1e11 ? raw * 1000 : raw;
              }
              var text = String(raw);
              if (/^\d+$/.test(text)) {
                var numeric = Number(text);
                return numeric > 0 && numeric < 1e11 ? numeric * 1000 : numeric;
              }
              var parsed = Date.parse(text);
              return isNaN(parsed) ? null : parsed;
            }

            function objectSize(obj) {
              var count = 0;
              var key;
              for (key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                  count++;
                }
              }
              return count;
            }

            function countLicenseWindow(rows, nowMs, windowMs) {
              var macs = {};
              var users = {};
              var byEngine = {};
              var i;
              if (!Array.isArray(rows)) {
                rows = [];
              }
              for (i = 0; i < rows.length; i++) {
                var row = rows[i] || {};
                var stamp = parseAuthTime(row.lastAuthEventTime);
                if (stamp === null || nowMs - stamp > windowMs || stamp > nowMs + 60000) {
                  continue;
                }
                var mac = String(row.macAddress || '').toLowerCase();
                if (!mac) {
                  continue;
                }
                macs[mac] = 1;
                var user = String(row.username || '').replace(/^\s+|\s+$/g, '');
                if (user) {
                  users[user] = 1;
                }
                var ip = String(row.nacApplianceIP || row.nacApplianceIp || '');
                if (!ip) {
                  continue;
                }
                if (!byEngine[ip]) {
                  byEngine[ip] = { macs: {}, lastAuth: 0 };
                }
                byEngine[ip].macs[mac] = 1;
                if (stamp > byEngine[ip].lastAuth) {
                  byEngine[ip].lastAuth = stamp;
                }
              }
              var engines = {};
              var engineIp;
              for (engineIp in byEngine) {
                if (!Object.prototype.hasOwnProperty.call(byEngine, engineIp)) {
                  continue;
                }
                engines[engineIp] = {
                  used24h: objectSize(byEngine[engineIp].macs),
                  lastAuthAge: byEngine[engineIp].lastAuth
                    ? Math.floor((nowMs - byEngine[engineIp].lastAuth) / 1000)
                    : -1
                };
              }
              return {
                nacUsed24h: objectSize(macs),
                users24h: objectSize(users),
                engines: engines
              };
            }

            function bool01(value) {
              if (value === true || value === 1 || value === '1' || value === 'true') {
                return 1;
              }
              if (value === false || value === 0 || value === '0' || value === 'false') {
                return 0;
              }
              return 2;
            }

            function uptimeSeconds(raw) {
              var numeric = Number(raw);
              if (!isFinite(numeric) || numeric < 0) {
                return 0;
              }
              if (numeric > 1e10) {
                return Math.floor(numeric / 1000);
              }
              return Math.floor(numeric);
            }

            function normalizeEngine(raw) {
              var row = raw || {};
              var ip = String(row.ipAddress || row.ip || '');
              var connected = 2;
              if (row.connected !== undefined) {
                connected = bool01(row.connected);
              } else if (row.isConnected !== undefined) {
                connected = bool01(row.isConnected);
              }
              return {
                ip: ip,
                name: String(row.displayName || row.name || ip),
                version: String(row.version || ''),
                licensed: bool01(row.licensed),
                capacity: Number(row.capacity) || 0,
                freeRadiusEnabled: bool01(row.freeRadiusEnabled),
                needsEnforce: bool01(row.needsEnforce),
                connected: connected,
                virtual: bool01(row.virtual)
              };
            }

            function normalizeEngines(raw) {
              var rows = Array.isArray(raw) ? raw : [];
              var out = [];
              var i;
              for (i = 0; i < rows.length; i++) {
                var engine = normalizeEngine(rows[i]);
                if (engine.ip) {
                  out.push(engine);
                }
              }
              return out;
            }

            function enginesToLld(engines) {
              var out = [];
              var i;
              var rows = Array.isArray(engines) ? engines : [];
              for (i = 0; i < rows.length; i++) {
                var engine = rows[i] || {};
                if (!engine.ip) {
                  continue;
                }
                out.push({
                  '{#ENGINE.IP}': String(engine.ip),
                  '{#ENGINE.NAME}': String(engine.name || engine.ip),
                  '{#ENGINE.CAPACITY}': String(engine.capacity || 0)
                });
              }
              return out;
            }

            function emptyDeviceLicenses() {
              return {
                pilotUsed: 0,
                navigatorUsed: 0,
                pending: 0,
                unmanaged: 0,
                platformOne: 0,
                other: 0
              };
            }

            function countDeviceLicenses(devices) {
              var out = emptyDeviceLicenses();
              var i;
              var rows = Array.isArray(devices) ? devices : [];
              for (i = 0; i < rows.length; i++) {
                var data = rows[i] && rows[i].deviceData;
                var state = data ? String(data.xiqLicenseState || '') : '';
                if (!state) {
                  continue;
                }
                if (state === 'XIQ_PILOT') {
                  out.pilotUsed++;
                } else if (state === 'XIQ_NAVIGATOR') {
                  out.navigatorUsed++;
                } else if (state === 'XIQ_PENDING') {
                  out.pending++;
                } else if (state === 'XIQ_UNMANAGED') {
                  out.unmanaged++;
                } else if (state.indexOf('XIQ_ADVANCED') === 0 || state.indexOf('XIQ_STANDARD') === 0) {
                  out.platformOne++;
                } else {
                  out.other++;
                }
              }
              return out;
            }

            function countPilot(devices) {
              return countDeviceLicenses(devices).pilotUsed;
            }

            function pickEngineField(payload, ip, field, missing) {
              var engines = payload && Array.isArray(payload.engines) ? payload.engines : [];
              var i;
              for (i = 0; i < engines.length; i++) {
                if (String(engines[i].ip) === String(ip)) {
                  if (engines[i][field] === undefined || engines[i][field] === null) {
                    return missing;
                  }
                  return engines[i][field];
                }
              }
              return missing;
            }

            function pickLicenseEngineField(payload, ip, field, missing) {
              var row = payload && payload.engines ? payload.engines[String(ip)] : null;
              if (!row || row[field] === undefined || row[field] === null) {
                return missing;
              }
              return row[field];
            }

            function httpAuthBasic() {
              return typeof HTTPAUTH_BASIC === 'number' ? HTTPAUTH_BASIC : 1;
            }

            function nbiBase(params) {
              return params.scheme + '://' + params.fqdn + ':' + params.port;
            }

            function fetchToken(params) {
              var request = new HttpRequest();
              request.addHeader('Content-Type: application/x-www-form-urlencoded');
              request.setHttpAuth(httpAuthBasic(), params.client_id, params.client_secret);
              var url = nbiBase(params) + '/oauth/token/access-token?grant_type=client_credentials';
              var response = request.post(url, '');
              var code = request.getStatus();
              if (code !== 200) {
                return { ok: 0, error: 'oauth HTTP ' + code };
              }
              var body;
              try {
                body = JSON.parse(response);
              } catch (error) {
                return { ok: 0, error: 'oauth invalid JSON' };
              }
              if (!body || !body.access_token) {
                return { ok: 0, error: 'oauth no access_token' };
              }
              return { ok: 1, token: body.access_token };
            }

            function graphql(params, token, query) {
              var request = new HttpRequest();
              request.addHeader('Accept: application/json');
              request.addHeader('Content-Type: application/json');
              request.addHeader('Authorization: Bearer ' + token);
              var url = nbiBase(params) + '/nbi/graphql';
              var response = request.post(url, JSON.stringify({ query: query }));
              var code = request.getStatus();
              var body;
              try {
                body = JSON.parse(response);
              } catch (error) {
                return { ok: 0, error: 'graphql invalid JSON HTTP ' + code };
              }
              if (code !== 200) {
                return { ok: 0, error: 'graphql HTTP ' + code };
              }
              if (body && Array.isArray(body.errors) && body.errors.length && !body.data) {
                return { ok: 0, error: String(body.errors[0].message || 'graphql error') };
              }
              return {
                ok: 1,
                data: body.data,
                errorCount: body && Array.isArray(body.errors) ? body.errors.length : 0
              };
            }

            function graphqlTry(params, token, queries) {
              var last = { ok: 0, error: 'no graphql query' };
              var i;
              for (i = 0; i < queries.length; i++) {
                last = graphql(params, token, queries[i]);
                if (last.ok) {
                  return last;
                }
              }
              return last;
            }

            var SERVER_INFO_QUERY = '{ administration { serverInfo { version upTime startTime heapMemoryUsed heapMemoryMax freePhysicalMemory totalPhysicalMemory threadCount } } }';
            var ENGINES_QUERIES = [
              '{ accessControl { engines { ipAddress name displayName version licensed capacity freeRadiusEnabled needsEnforce connected virtual } } }',
              '{ accessControl { engines { ipAddress name displayName version licensed capacity freeRadiusEnabled needsEnforce isConnected virtual } } }',
              '{ accessControl { engines { ipAddress name displayName version licensed capacity freeRadiusEnabled needsEnforce virtual } } }',
              '{ accessControl { engines { ipAddress name version licensed capacity } } }',
              '{ accessControl { engines { ipAddress name } } }'
            ];

            function collectHealth(params) {
              var auth = fetchToken(params);
              if (!auth.ok) {
                return { ok: 0, error: auth.error, engineCount: 0, engines: [] };
              }
              var info = graphql(params, auth.token, SERVER_INFO_QUERY);
              if (!info.ok) {
                return { ok: 0, error: info.error, engineCount: 0, engines: [] };
              }
              var server = (((info.data || {}).administration || {}).serverInfo) || {};
              var enginesResult = graphqlTry(params, auth.token, ENGINES_QUERIES);
              var engines = [];
              if (enginesResult.ok) {
                engines = normalizeEngines((((enginesResult.data || {}).accessControl) || {}).engines);
              }
              return {
                ok: 1,
                error: enginesResult.ok ? '' : String(enginesResult.error || ''),
                version: String(server.version || ''),
                upTime: uptimeSeconds(server.upTime),
                startTime: String(server.startTime || ''),
                heapMemoryUsed: Number(server.heapMemoryUsed) || 0,
                heapMemoryMax: Number(server.heapMemoryMax) || 0,
                freePhysicalMemory: Number(server.freePhysicalMemory) || 0,
                totalPhysicalMemory: Number(server.totalPhysicalMemory) || 0,
                threadCount: Number(server.threadCount) || 0,
                engineCount: engines.length,
                engines: engines
              };
            }

            var params = JSON.parse(value);
            return JSON.stringify(collectHealth(params));
          timeout: '{$XIQSE.DATA.TIMEOUT}'
          parameters:
            - name: fqdn
              value: '{$XIQSE.API.FQDN}'
            - name: port
              value: '{$XIQSE.API.PORT}'
            - name: scheme
              value: '{$XIQSE.SCHEME}'
            - name: client_id
              value: '{$XIQSE.API.CLIENT.ID}'
            - name: client_secret
              value: '{$XIQSE.API.CLIENT.SECRET}'
          description: |
            OAuth + serverInfo + engines. Query only. New HttpRequest per call.
          tags:
            - tag: component
              value: nbi
            - tag: scope
              value: health
