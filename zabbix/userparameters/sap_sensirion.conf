# SAP template from Sensirion — sapcontrol via the local Zabbix agent.
# Install on each SAP HANA / SAP ME host (not on the Zabbix proxy):
#   1. Copy zabbix/externalscripts/sap_sensirion.py to
#      /usr/lib/zabbix/externalscripts/sap_sensirion.py (0755, root:zabbix)
#   2. Copy this file to /etc/zabbix/zabbix_agentd.d/sap_sensirion.conf
#   3. Agent Timeout=15 (sapcontrol is slower than a ping)
#   4. sudoers: zabbix ALL=(sapadm) NOPASSWD: /usr/sap/hostctrl/exe/sapcontrol, /usr/sap/hostctrl/exe/saphostctrl
#   5. systemctl restart zabbix-agent
#   6. zabbix_agentd -t 'sap.sensirion[json,,]'
#
# --apply-sap cannot push this file. Empty {$SAP.INSTANCE}/{$SAP.SID} is fine
# on a single-instance HANA box (ListInstances). See
# zabbix/templates/sap_sensirion/SAPCONTROL.md

UserParameter=sap.sensirion[*],/usr/bin/python3 /usr/lib/zabbix/externalscripts/sap_sensirion.py "$1" "$2" "$3" "$4"
