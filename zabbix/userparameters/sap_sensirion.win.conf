# SAP ME from Sensirion — sapcontrol.exe via the Windows Zabbix agent.
# Install on each SAP ME host (not on openSUSE HANA, not on the proxy):
#   1. Copy zabbix/externalscripts/sap_sensirion.ps1 to
#      C:\Program Files\Zabbix Agent\externalscripts\sap_sensirion.ps1
#   2. Copy this file to the agent UserParameter include directory
#   3. Agent Timeout=15
#   4. Restart the Zabbix agent service
#   5. zabbix_agentd.exe -t sap.sensirion[json,,]
#
# --apply-sap cannot push this file. See
# zabbix/templates/sap_sensirion/SAPCONTROL.md

UserParameter=sap.sensirion[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent\externalscripts\sap_sensirion.ps1" "$1" "$2" "$3" "$4"
